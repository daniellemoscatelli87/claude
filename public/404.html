<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada • Dani Moscatelli | Experience Design Studio</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; font-family: "Plus Jakarta Sans", system-ui, sans-serif; color: #0f172a; background: #fbfbfd; text-align: center; }
  main { max-width: 480px; }
  img { display: block; height: 56px; width: auto; margin: 0 auto 32px; }
  p.tag { display: inline-block; margin: 0 0 16px; padding: 4px 14px; border-radius: 999px; background: #fdeeee; color: #c13e3e; font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
  h1 { margin: 0 0 12px; font-size: clamp(1.75rem, 5vw, 2.25rem); font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
  p { margin: 0 0 28px; color: #64748b; line-height: 1.6; }
  a.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 24px; border-radius: 999px; background: #d44d4d; color: #fff; font-weight: 600; text-decoration: none; }
  a.btn:hover { background: #c13e3e; }
</style>
</head>
<body>
<main>
  <img src="/logo-dm.png" alt="Dani Moscatelli | Experience Design Studio">
  <p class="tag">Erro 404</p>
  <h1>Página não encontrada</h1>
  <p>O endereço pode ter mudado ou não existe mais.</p>
  <a class="btn" href="/">Ir para a página inicial</a>
</main>
</body>
</html>
