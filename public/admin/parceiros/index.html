<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Parceiros | Área restrita</title>
<link rel="icon" type="image/png" href="/favicon-dm.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
<style>
  .tabs { display: inline-flex; gap: 4px; padding: 4px; background: #fff; border: 1px solid var(--line); border-radius: 14px; margin: 20px 0 16px; }
  .tab { background: none; border: 0; border-radius: 10px; padding: 9px 18px; color: var(--muted); font-size: 14px; }
  .tab[aria-selected=true] { background: var(--dark); color: #fff; }
  .tab .n { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 999px; background: rgb(148 163 184 / .25); font-size: 12px; }
  .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; align-items: end; }
  .filters label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .filters .search { grid-column: 1 / -1; }
  .filters-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; font-size: 13px; }
  .fold summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
  .fold summary::-webkit-details-marker { display: none; }
  .fold summary .chev { transition: transform .2s; color: var(--muted); }
  .fold[open] summary .chev { transform: rotate(180deg); }
  .fold[open] summary { margin-bottom: 14px; }
  .active-count { font-size: 12px; font-weight: 600; color: var(--red); margin-left: 8px; }

  .block { margin-top: 32px; }
  .block-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .block-head .num { font-size: 12px; font-weight: 800; color: var(--red); letter-spacing: .1em; }
  .g { display: grid; gap: 12px; }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .span2 { grid-column: span 2; } .span3 { grid-column: 1 / -1; }
  @media (max-width: 900px) { .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 640px) { .g2, .g3 { grid-template-columns: 1fr; } .span2 { grid-column: auto; } }
  .note { font-size: 12px; color: var(--muted); margin: -8px 0 12px; }

  /* Indicadores */
  .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 1000px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 640px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .kpi { position: relative; overflow: hidden; }
  .kpi .ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; margin-bottom: 12px; }
  .kpi .ic svg { width: 20px; height: 20px; }
  .kpi .v { font-size: 32px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
  .kpi .k { font-size: 13px; color: var(--dark); margin-top: 6px; font-weight: 600; line-height: 1.35; }
  .kpi .p { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .kpi.hero { background: var(--dark); color: #fff; border-color: var(--dark); }
  .kpi.hero .k { color: #fff; } .kpi.hero .p { color: #cbd5e1; }

  /* Barras horizontais */
  .bars { display: grid; gap: 9px; }
  .bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 10px; font-size: 13px; }
  .bar .val { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
  .bar .val b { color: var(--dark); }
  .bar .track { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .bar .fill { height: 100%; border-radius: 4px; background: var(--red); }
  .bar.zero .lbl, .bar.zero .val { color: #94a3b8; }

  /* Grupos de habilidades */
  .skill-groups { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 900px) { .skill-groups { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 520px) { .skill-groups { grid-template-columns: 1fr; } }
  .sg { border-top: 4px solid var(--c); }
  .sg .gn { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .sg .gv { display: flex; align-items: baseline; gap: 8px; margin: 6px 0 10px; }
  .sg .gv b { font-size: 30px; font-weight: 800; letter-spacing: -.03em; }
  .sg .gv span { font-size: 13px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12.5px; background: var(--track); border-radius: 999px; padding: 4px 10px; }
  .chip b { margin-left: 4px; color: var(--red); }
  .cloud .chip { font-size: var(--fs, 13px); padding: 5px 12px; }

  /* Rosca */
  .donut-wrap { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  .donut { width: 150px; height: 150px; flex-shrink: 0; position: relative; }
  .donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .donut .ctr { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .donut .ctr b { font-size: 26px; font-weight: 800; display: block; line-height: 1; }
  .donut .ctr span { font-size: 11px; color: var(--muted); }
  .legend { display: grid; gap: 7px; flex: 1; min-width: 180px; font-size: 13px; }
  .legend .li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 8px; align-items: start; }
  .legend .dot { width: 12px; height: 12px; border-radius: 3px; margin-top: 3px; }
  .legend .n { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
  .legend .n b { color: var(--dark); }
  .legend .li.zero { color: #94a3b8; }

  /* Colunas */
  .cols { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; align-items: end; height: 190px; padding-top: 18px; }
  .col { display: grid; grid-template-rows: auto 1fr auto; height: 100%; text-align: center; }
  .col .cv { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .col .ct { display: flex; align-items: flex-end; justify-content: center; }
  .col .cb { width: min(100%, 36px); border-radius: 4px 4px 0 0; background: var(--seq); min-height: 2px; }
  .col .cl { font-size: 11px; color: var(--muted); line-height: 1.25; margin-top: 6px; min-height: 28px; }

  /* Anel de porcentagem */
  .ring-wrap { display: flex; gap: 18px; align-items: center; }
  .ring { width: 120px; height: 120px; flex-shrink: 0; position: relative; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .ctr { position: absolute; inset: 0; display: grid; place-items: center; font-size: 24px; font-weight: 800; }

  /* Estados */
  .uf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
  .uf { border-radius: 12px; padding: 10px; background: var(--track); text-align: center; }
  .uf b { display: block; font-size: 22px; font-weight: 800; line-height: 1.1; }
  .uf span { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .06em; }
  .uf.top { background: var(--red); color: #fff; } .uf.top span { color: #fde2e2; }

  /* Lista de candidaturas */
  .cand-meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
</style>
</head>
<body>
<main class="wrap hidden" id="app">
  <div id="view-main">
    <span class="tag">Área restrita</span>
    <h1>Parceiros</h1>
    <p class="muted">Métricas, habilidades disponíveis e candidaturas à Rede de Parceiros.</p>
    <p class="msg err hidden" id="load-err"></p>

    <div class="tabs" role="tablist" aria-label="Seções de parceiros">
      <button type="button" class="tab" role="tab" id="tab-dashboard" aria-controls="panel-dashboard" aria-selected="true">Dashboard</button>
      <button type="button" class="tab" role="tab" id="tab-candidaturas" aria-controls="panel-candidaturas" aria-selected="false">Candidaturas <span class="n" id="n-cand">0</span></button>
    </div>

    <details class="card fold" id="filters-box">
      <summary><span>Filtros<span class="active-count" id="active-count"></span></span><svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>
      <div class="filters" id="filters">
        <div class="search">
          <label for="f-busca">Buscar</label>
          <input type="search" id="f-busca" placeholder="Nome, e-mail, especialização, atividades, ferramentas, cidade…">
        </div>
      </div>
      <div class="filters-foot">
        <span class="muted" id="showing"></span>
        <button type="button" class="btn-ghost" id="clear">Limpar filtros</button>
      </div>
    </details>

    <section id="panel-dashboard" role="tabpanel" aria-labelledby="tab-dashboard">
      <div class="block"><div class="kpis" id="kpis"></div></div>

      <div class="block">
        <div class="block-head"><span class="num">01</span><h2>Habilidades disponíveis</h2></div>
        <div class="skill-groups" id="skill-groups"></div>
        <div class="g g2" style="margin-top:12px" id="skills-more"></div>
      </div>

      <div class="block">
        <div class="block-head"><span class="num">02</span><h2>Perfil e senioridade</h2></div>
        <div class="g g3" id="perfil"></div>
      </div>

      <div class="block">
        <div class="block-head"><span class="num">03</span><h2>Disponibilidade e formato</h2></div>
        <div class="g g3" id="disponibilidade"></div>
      </div>

      <div class="block">
        <div class="block-head"><span class="num">04</span><h2>Segmentos e conhecimento setorial</h2></div>
        <div class="g g3" id="segmentos"></div>
      </div>

      <div class="block">
        <div class="block-head"><span class="num">05</span><h2>Localização e origem</h2></div>
        <div class="g g3" id="localizacao"></div>
      </div>
    </section>

    <section id="panel-candidaturas" role="tabpanel" aria-labelledby="tab-candidaturas" class="hidden">
      <div class="cand-meta"><span id="cand-count"></span></div>
      <div class="card"><div class="rows" id="list"></div></div>
    </section>
  </div>

  <div id="view-detail" class="hidden">
    <a class="back" id="back" href="/admin/parceiros/?aba=candidaturas">← Todas as candidaturas</a>
    <div id="detail"></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/admin/admin.js"></script>
<script src="/admin/form-parceiros.js"></script>
<script>
const { el } = Admin;
const Q = Object.fromEntries(FORM_PARCEIROS.flatMap((s) => s.questions).map((q) => [q.id, q]));
const optionsOf = (id) => Q[id].groups ? Q[id].groups.flatMap((g) => g.options) : Q[id].options;
const SECOES = FORM_PARCEIROS.map((s) => ({ title: s.title, fields: s.questions.map((q) => [q.id, q.n + ". " + q.label]) }));
const CAT = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "var(--s5)", "var(--s6)"];
const clean = (s) => String(s).replace(/\.$/, "");
const pct = (n, t) => (t ? Math.round((n / t) * 100) : 0);
const plural = (n, s, p) => n + " " + (n === 1 ? s : p);
const norm = (s) => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const uf = (s) => ((s || "").toUpperCase().match(/\b([A-Z]{2})\s*\.?$/) || [])[1] || "—";
const cidade = (s) => (s || "").split(/[—–\-\/,]/)[0].trim().replace(/\s+/g, " ").toLowerCase().replace(/(^|\s)\S/g, (c) => c.toUpperCase()) || "Não informado";
const startsSim = (v) => typeof v === "string" && v.startsWith("Sim");
const svg = (tag, attrs) => { const e = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };

/* ---------- Filtros ---------- */
const FILTROS = [
  { id: "areas_experiencia", label: "Área de experiência" },
  { id: "segmentos", label: "Segmento de mercado" },
  { id: "atuacao_pj", label: "Situação PJ" },
  { id: "disponibilidade_colaborar", label: "Disponibilidade" },
  { id: "horas_semanais", label: "Horas semanais" },
  { id: "formatos_atuacao", label: "Formato de atuação" },
  { id: "tempo_especialidade", label: "Tempo na especialidade" },
  { id: "uf", label: "Estado", derived: true },
];
const BUSCA = ["nome", "email", "cidade_estado", "apresentacao", "principal_especializacao", "atividades_entregaveis", "conhecimento_segmento", "formacao", "certificacoes", "ferramentas", "projeto_relevante"];
let ALL = [];

function buildFilters() {
  const box = document.getElementById("filters");
  for (const f of FILTROS) {
    const wrap = el("div");
    const lab = el("label", null, f.label); lab.htmlFor = "f-" + f.id;
    const sel = el("select"); sel.id = "f-" + f.id;
    sel.append(new Option("Todos", ""));
    const opts = f.derived ? [...new Set(ALL.map((r) => uf(r.cidade_estado)))].sort() : optionsOf(f.id);
    for (const o of opts) sel.append(new Option(clean(o), o));
    sel.addEventListener("change", update);
    wrap.append(lab, sel);
    box.appendChild(wrap);
  }
  document.getElementById("f-busca").addEventListener("input", update);
  document.getElementById("clear").addEventListener("click", () => {
    document.getElementById("f-busca").value = "";
    FILTROS.forEach((f) => (document.getElementById("f-" + f.id).value = ""));
    update();
  });
}

function filtered() {
  const q = norm(document.getElementById("f-busca").value.trim());
  return ALL.filter((r) => {
    for (const f of FILTROS) {
      const v = document.getElementById("f-" + f.id).value;
      if (!v) continue;
      const rv = f.derived ? uf(r.cidade_estado) : r[f.id];
      if (Array.isArray(rv) ? !rv.includes(v) : rv !== v) return false;
    }
    return !q || BUSCA.some((k) => norm(r[k]).includes(q));
  });
}

function activeFilters() {
  return FILTROS.filter((f) => document.getElementById("f-" + f.id).value).length + (document.getElementById("f-busca").value.trim() ? 1 : 0);
}

/* ---------- Contagens ---------- */
// Escolha única: ordem do formulário (inclui zeros). Múltipla escolha: da mais para a menos frequente, sem zeros.
function counts(rows, id, getter) {
  const opts = getter ? [] : optionsOf(id);
  const m = new Map(opts.map((o) => [o, 0]));
  for (const r of rows) {
    const v = getter ? getter(r) : r[id];
    for (const x of Array.isArray(v) ? v : [v]) if (x != null && x !== "") m.set(x, (m.get(x) || 0) + 1);
  }
  let e = [...m.entries()];
  if (getter || Q[id]?.type === "checkbox") e = e.filter(([, n]) => n).sort((a, b) => b[1] - a[1]);
  return e;
}

/* ---------- Componentes visuais ---------- */
function card(title, opts = {}) {
  const c = el("div", "card" + (opts.cls ? " " + opts.cls : ""));
  c.appendChild(el("h3", null, title));
  if (opts.note) c.appendChild(el("p", "note", opts.note));
  return c;
}
const emptyNote = () => el("p", "muted", "Sem dados para os filtros atuais.");

function bars(entries, total, { limit } = {}) {
  const box = el("div", "bars");
  const list = limit ? entries.slice(0, limit) : entries;
  const max = Math.max(1, ...list.map(([, n]) => n));
  for (const [label, n] of list) {
    const b = el("div", "bar" + (n ? "" : " zero"));
    b.title = clean(label) + ": " + plural(n, "parceiro", "parceiros") + " (" + pct(n, total) + "%)";
    const val = el("span", "val"); val.append(el("b", null, String(n)), document.createTextNode(" · " + pct(n, total) + "%"));
    const track = el("div", "track"), fill = el("div", "fill");
    fill.style.width = (n / max) * 100 + "%";
    track.appendChild(fill);
    b.append(el("span", "lbl", clean(label)), val, track);
    box.appendChild(b);
  }
  return box;
}

// Rosca: cor fixa por opção (ordem do formulário), números sempre visíveis na legenda.
function donut(entries, total, centerLabel) {
  const wrap = el("div", "donut-wrap");
  const d = el("div", "donut");
  const s = svg("svg", { viewBox: "0 0 42 42", role: "img", "aria-label": centerLabel });
  const R = 15.9155, C = 2 * Math.PI * R, GAP = entries.filter(([, n]) => n).length > 1 ? 0.6 : 0;
  s.appendChild(svg("circle", { cx: 21, cy: 21, r: R, fill: "none", stroke: "#f1f5f9", "stroke-width": 6 }));
  let off = 0;
  entries.forEach(([label, n], i) => {
    if (!n || !total) return;
    const len = (n / total) * C;
    const c = svg("circle", { cx: 21, cy: 21, r: R, fill: "none", stroke: CAT[i % CAT.length], "stroke-width": 6,
      "stroke-dasharray": Math.max(len - GAP, 0.01) + " " + (C - Math.max(len - GAP, 0.01)), "stroke-dashoffset": -off });
    const t = svg("title", {}); t.textContent = clean(label) + ": " + n + " (" + pct(n, total) + "%)";
    c.appendChild(t); s.appendChild(c);
    off += len;
  });
  d.appendChild(s);
  const ctr = el("div", "ctr"); const inner = el("div"); inner.append(el("b", null, String(total)), el("span", null, centerLabel)); ctr.appendChild(inner);
  d.appendChild(ctr);
  const lg = el("div", "legend");
  entries.forEach(([label, n], i) => {
    const li = el("div", "li" + (n ? "" : " zero"));
    const dot = el("span", "dot"); dot.style.background = n ? CAT[i % CAT.length] : "#e2e8f0";
    const v = el("span", "n"); v.append(el("b", null, String(n)), document.createTextNode(" · " + pct(n, total) + "%"));
    li.append(dot, el("span", null, clean(label)), v);
    lg.appendChild(li);
  });
  wrap.append(d, lg);
  return wrap;
}

// Colunas para respostas em escala (tempo, horas): mantém a ordem da escala.
function columns(entries, total, shortLabel) {
  const box = el("div", "cols");
  const max = Math.max(1, ...entries.map(([, n]) => n));
  for (const [label, n] of entries) {
    const c = el("div", "col");
    c.title = clean(label) + ": " + plural(n, "parceiro", "parceiros") + " (" + pct(n, total) + "%)";
    const t = el("div", "ct"), b = el("div", "cb");
    b.style.height = (n / max) * 100 + "%";
    if (!n) b.style.background = "#e2e8f0";
    t.appendChild(b);
    c.append(el("div", "cv", String(n)), t, el("div", "cl", shortLabel(clean(label))));
    box.appendChild(c);
  }
  return box;
}

function ring(n, total, text) {
  const wrap = el("div", "ring-wrap");
  const r = el("div", "ring");
  const s = svg("svg", { viewBox: "0 0 42 42", role: "img", "aria-label": text });
  const R = 15.9155, C = 2 * Math.PI * R, len = total ? (n / total) * C : 0;
  s.append(svg("circle", { cx: 21, cy: 21, r: R, fill: "none", stroke: "#f1f5f9", "stroke-width": 5 }),
    svg("circle", { cx: 21, cy: 21, r: R, fill: "none", stroke: "var(--s3)", "stroke-width": 5, "stroke-linecap": "round", "stroke-dasharray": len + " " + (C - len) }));
  r.append(s, el("div", "ctr", pct(n, total) + "%"));
  const t = el("div"); t.append(el("div", null, text), el("div", "muted", plural(n, "parceiro", "parceiros") + " de " + total));
  wrap.append(r, t);
  return wrap;
}

const shortTempo = (l) => l.replace("Entre ", "").replace(" anos", "a").replace("Menos de 1 ano", "<1a").replace("Mais de ", ">").replace(" e ", "–").replace("Ainda não comecei, mas tenho interesse", "Ainda não");
const shortHoras = (l) => l.replace(" horas semanais", "h").replace("Até ", "≤").replace("Mais de ", ">").replace("De ", "").replace(" a ", "–").replace("Disponibilidade variável conforme o projeto", "Variável");

/* ---------- Dashboard ---------- */
const KPI_ICONS = {
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2a5 5 0 0 1 5.5 5.8"/>',
  doc: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  bolt: '<path d="M13 3L5 13h6l-1 8 8-10h-6z"/>',
  flag: '<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
  pin: '<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
};
const TINTS = [["#e8f0fb", "var(--s1)"], ["#fdece4", "var(--s2)"], ["#e3f5ee", "#12865c"], ["#fdf3dc", "#a06d00"]];

function kpis(rows) {
  const box = document.getElementById("kpis"); box.replaceChildren();
  const t = rows.length;
  const items = [
    ["Candidaturas na rede", t, "users"],
    ["Com CNPJ ativo ou empresa própria", rows.filter((r) => startsSim(r.atuacao_pj)).length, "doc"],
    ["Disponibilidade imediata", rows.filter((r) => r.disponibilidade_colaborar === "Disponibilidade imediata.").length, "bolt"],
    ["Lideram projetos ou frentes", rows.filter((r) => startsSim(r.lideranca)).length, "flag"],
    ["Podem atuar presencialmente em Curitiba", rows.filter((r) => startsSim(r.presencial_curitiba)).length, "pin"],
  ];
  items.forEach(([k, v, ic], i) => {
    const c = el("div", "card kpi" + (i === 0 ? " hero" : ""));
    const badge = el("div", "ic");
    if (i === 0) { badge.style.background = "rgb(255 255 255 / .12)"; badge.style.color = "#fff"; }
    else { badge.style.background = TINTS[i - 1][0]; badge.style.color = TINTS[i - 1][1]; }
    badge.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${KPI_ICONS[ic]}</svg>`;
    c.append(badge, el("div", "v", String(v)), el("div", "k", k));
    c.appendChild(el("div", "p", i === 0 ? (t === ALL.length ? "Total recebido" : "de " + ALL.length + " no total") : pct(v, t) + "% das candidaturas"));
    box.appendChild(c);
  });
}

function skills(rows) {
  const t = rows.length;
  const groups = document.getElementById("skill-groups"); groups.replaceChildren();
  Q.areas_experiencia.groups.forEach((g, i) => {
    const people = rows.filter((r) => (r.areas_experiencia || []).some((x) => g.options.includes(x))).length;
    const top = counts(rows, "areas_experiencia").filter(([o]) => g.options.includes(o)).slice(0, 4);
    const c = el("div", "card sg"); c.style.setProperty("--c", CAT[i % CAT.length]);
    const gv = el("div", "gv"); gv.append(el("b", null, String(people)), el("span", null, (people === 1 ? "parceiro" : "parceiros") + " · " + pct(people, t) + "%"));
    const chips = el("div", "chips");
    top.forEach(([o, n]) => { const ch = el("span", "chip", clean(o)); ch.appendChild(el("b", null, String(n))); chips.appendChild(ch); });
    if (!top.length) chips.appendChild(el("span", "muted", "Nenhuma habilidade nesta área."));
    c.append(el("div", "gn", g.title), gv, chips);
    groups.appendChild(c);
  });

  const more = document.getElementById("skills-more"); more.replaceChildren();
  const c1 = card("Top 10 habilidades", { note: "Pergunta 11 · cada parceiro pode marcar várias." });
  const e1 = counts(rows, "areas_experiencia");
  c1.appendChild(e1.length ? bars(e1, t, { limit: 10 }) : emptyNote());
  const c2 = card("Especializações declaradas", { note: "Pergunta 12 · resposta livre, agrupada por texto igual." });
  const m = new Map();
  for (const r of rows) { const raw = (r.principal_especializacao || "").trim(); if (!raw) continue; const k = norm(raw); const cur = m.get(k) || { label: raw, n: 0 }; cur.n++; m.set(k, cur); }
  const list = [...m.values()].sort((a, b) => b.n - a.n);
  if (!list.length) c2.appendChild(emptyNote());
  else {
    const maxN = list[0].n, cloud = el("div", "chips cloud");
    list.forEach(({ label, n }) => { const ch = el("span", "chip", label); ch.style.setProperty("--fs", 12 + (maxN > 1 ? ((n - 1) / (maxN - 1)) * 6 : 0) + "px"); if (n > 1) ch.appendChild(el("b", null, String(n))); cloud.appendChild(ch); });
    c2.appendChild(cloud);
  }
  const c3 = card("Etapas de projeto em que atuam", { note: "Pergunta 14" });
  const e3 = counts(rows, "etapas_projeto"); c3.appendChild(e3.length ? bars(e3, t) : emptyNote());
  const c4 = card("Formas de colaboração de interesse", { note: "Pergunta 9" });
  const e4 = counts(rows, "formas_colaboracao"); c4.appendChild(e4.length ? bars(e4, t) : emptyNote());
  more.append(c1, c2, c3, c4);
}

function addDonut(box, title, rows, id, center, cls) {
  const c = card(title, { cls });
  c.appendChild(rows.length ? donut(counts(rows, id), rows.length, center) : emptyNote());
  box.appendChild(c);
}
function addBars(box, title, rows, id, opts = {}) {
  const c = card(title, { cls: opts.cls, note: Q[id]?.type === "checkbox" ? "Cada parceiro pode marcar várias." : null });
  const e = counts(rows, id, opts.getter);
  c.appendChild(rows.length && e.length ? bars(e, rows.length, opts) : emptyNote());
  box.appendChild(c);
}
function addCols(box, title, rows, id, short, cls) {
  const c = card(title, { cls });
  c.appendChild(rows.length ? columns(counts(rows, id), rows.length, short) : emptyNote());
  box.appendChild(c);
}

function dashboard(rows) {
  kpis(rows);
  skills(rows);

  const per = document.getElementById("perfil"); per.replaceChildren();
  addDonut(per, "Situação PJ", rows, "atuacao_pj", "candidaturas");
  addCols(per, "Tempo na principal especialidade", rows, "tempo_especialidade", shortTempo, "span2");
  addBars(per, "Nível de formação", rows, "nivel_formacao");
  addCols(per, "Tempo atuando de forma independente", rows, "tempo_independente", shortTempo);
  addBars(per, "Experiência com liderança", rows, "lideranca");
  addBars(per, "Modelo de atuação", rows, "modelo_atuacao", { cls: "span2" });
  addBars(per, "Já atuou como especialista externo", rows, "servicos_especialista_externo");

  const dis = document.getElementById("disponibilidade"); dis.replaceChildren();
  addDonut(dis, "Disponibilidade para projetos", rows, "disponibilidade_colaborar", "candidaturas");
  addCols(dis, "Horas semanais disponíveis", rows, "horas_semanais", shortHoras, "span2");
  addBars(dis, "Formatos de atuação", rows, "formatos_atuacao");
  addBars(dis, "Presencial em Curitiba / região", rows, "presencial_curitiba");
  addBars(dis, "Viagens e deslocamentos", rows, "viagens");
  addBars(dis, "Formatos de contratação aceitos", rows, "formatos_contratacao");
  addBars(dis, "Forma de precificação", rows, "precificacao");
  addBars(dis, "Equipe ou rede própria", rows, "equipe_propria");
  addBars(dis, "Interesse em projetos em parceria", rows, "interesse_parceria", { cls: "span3" });

  const seg = document.getElementById("segmentos"); seg.replaceChildren();
  addBars(seg, "Segmentos de mercado", rows, "segmentos", { cls: "span2", limit: 12 });
  addDonut(seg, "Projetos multidisciplinares", rows, "colaboracao_multidisciplinar", "candidaturas");

  const loc = document.getElementById("localizacao"); loc.replaceChildren();
  const cu = card("Estados", { cls: "span2", note: "Identificado pela sigla no fim da pergunta 4 (ex.: “Curitiba — PR”)." });
  const ufs = counts(rows, "uf", (r) => uf(r.cidade_estado));
  if (!ufs.length) cu.appendChild(emptyNote());
  else { const g = el("div", "uf-grid"); ufs.forEach(([u, n], i) => { const t = el("div", "uf" + (i === 0 ? " top" : "")); t.title = u + ": " + plural(n, "parceiro", "parceiros"); t.append(el("b", null, String(n)), el("span", null, u)); g.appendChild(t); }); cu.appendChild(g); }
  loc.appendChild(cu);
  const wa = card("Grupo de WhatsApp");
  wa.appendChild(rows.length ? ring(rows.filter((r) => startsSim(r.interesse_whatsapp)).length, rows.length, "querem participar do grupo de networking") : emptyNote());
  loc.appendChild(wa);
  addBars(loc, "Cidades", rows, "cidade", { getter: (r) => cidade(r.cidade_estado), limit: 10 });
  addDonut(loc, "Como conheceram a iniciativa", rows, "como_conheceu", "respostas", "span2");
}

/* ---------- Candidaturas ---------- */
function candidaturas(rows) {
  document.getElementById("cand-count").textContent = rows.length === ALL.length ? plural(ALL.length, "candidatura", "candidaturas") : rows.length + " de " + plural(ALL.length, "candidatura", "candidaturas");
  const list = document.getElementById("list"); list.replaceChildren();
  if (!rows.length) return list.appendChild(el("div", "empty", ALL.length ? "Nenhuma candidatura para os filtros atuais." : "Nenhuma candidatura ainda."));
  rows.forEach((r) => list.appendChild(Admin.rowLink("/admin/parceiros/?id=" + r.id, r.nome, [r.principal_especializacao, r.cidade_estado, r.email].filter(Boolean).join(" · "), r.created_at)));
}

function update() {
  const rows = filtered();
  const n = activeFilters();
  document.getElementById("active-count").textContent = n ? "· " + plural(n, "ativo", "ativos") : "";
  document.getElementById("showing").textContent = "Mostrando " + rows.length + " de " + plural(ALL.length, "candidatura", "candidaturas");
  document.getElementById("n-cand").textContent = rows.length;
  dashboard(rows);
  candidaturas(rows);
}

function setTab(name) {
  const dash = name !== "candidaturas";
  document.getElementById("tab-dashboard").setAttribute("aria-selected", String(dash));
  document.getElementById("tab-candidaturas").setAttribute("aria-selected", String(!dash));
  document.getElementById("panel-dashboard").classList.toggle("hidden", !dash);
  document.getElementById("panel-candidaturas").classList.toggle("hidden", dash);
  const url = new URL(location.href);
  if (dash) url.searchParams.delete("aba"); else url.searchParams.set("aba", "candidaturas");
  history.replaceState(null, "", url);
}
document.getElementById("tab-dashboard").addEventListener("click", () => setTab("dashboard"));
document.getElementById("tab-candidaturas").addEventListener("click", () => setTab("candidaturas"));

Admin.init({ page: "parceiros", onReady: async () => {
  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  if (id) {
    document.getElementById("view-main").classList.add("hidden");
    document.getElementById("view-detail").classList.remove("hidden");
    const { data, error } = await Admin.sb.from("cadastros").select("*").eq("id", id).maybeSingle();
    const box = document.getElementById("detail");
    if (error || !data) { box.replaceChildren(el("div", "card empty", error ? "Não foi possível carregar a candidatura." : "Candidatura não encontrada.")); return; }
    box.replaceChildren(Admin.detail(data, SECOES, "Candidatura enviada em " + Admin.fmtDate(data.created_at)));
    return;
  }
  const { data, error } = await Admin.sb.from("cadastros").select("*").order("created_at", { ascending: false });
  const err = document.getElementById("load-err");
  err.classList.toggle("hidden", !error);
  if (error) { err.textContent = "Não foi possível carregar as candidaturas: " + error.message; return; }
  ALL = data;
  if (!document.getElementById("f-areas_experiencia")) buildFilters();
  if (window.matchMedia("(min-width: 800px)").matches) document.getElementById("filters-box").open = true;
  setTab(params.get("aba"));
  update();
}});
</script>
