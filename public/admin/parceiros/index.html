<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Parceiros | Área restrita</title>
<link rel="icon" type="image/png" href="/favicon-dm.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
<style>
  .tabs { display: inline-flex; gap: 4px; padding: 4px; background: #fff; border: 1px solid var(--line); border-radius: 14px; margin: 20px 0 16px; }
  .tab { background: none; border: 0; border-radius: 10px; padding: 9px 18px; color: var(--muted); font-size: 14px; }
  .tab[aria-selected=true] { background: var(--dark); color: #fff; }
  .tab .n { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 999px; background: rgb(148 163 184 / .25); font-size: 12px; }
  .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; align-items: end; }
  .filters label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .filters .search { grid-column: 1 / -1; }
  .filters-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; font-size: 13px; }
  .fold summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
  .fold summary::-webkit-details-marker { display: none; }
  .fold summary .chev { transition: transform .2s; color: var(--muted); }
  .fold[open] summary .chev { transform: rotate(180deg); }
  .fold[open] summary { margin-bottom: 14px; }
  .active-count { font-size: 12px; font-weight: 600; color: var(--red); margin-left: 8px; }

  .block { margin-top: 32px; }
  .block-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .block-head .num { font-size: 12px; font-weight: 800; color: var(--red); letter-spacing: .1em; }
  .g { display: grid; gap: 12px; }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .span2 { grid-column: span 2; } .span3 { grid-column: 1 / -1; }
  @media (max-width: 900px) { .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 640px) { .g2, .g3 { grid-template-columns: 1fr; } .span2 { grid-column: auto; } }
  .note { font-size: 12px; color: var(--muted); margin: -8px 0 12px; }

  /* Indicadores */
  .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 1000px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 640px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .kpi { position: relative; overflow: hidden; }
  .kpi .ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; margin-bottom: 12px; }
  .kpi .ic svg { width: 20px; height: 20px; }
  .kpi .v { font-size: 32px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
  .kpi .k { font-size: 13px; color: var(--dark); margin-top: 6px; font-weight: 600; line-height: 1.35; }
  .kpi .p { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .kpi.hero { background: var(--dark); color: #fff; border-color: var(--dark); }
  .kpi.hero .k { color: #fff; } .kpi.hero .p { color: #cbd5e1; }

  .more { margin-top: 12px; font-size: 13px; font-weight: 700; color: var(--red); background: none; border: 0; padding: 0; }
  .more:hover { text-decoration: underline; }

  /* Lista numerada (rankings) */
  .ranked { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .ranked li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
  .ranked li:last-child { border-bottom: 0; }
  .ranked .pos { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: var(--track); color: var(--muted); }
  .ranked li:first-child .pos { background: var(--red); color: #fff; }
  .ranked .cnt { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ranked .cnt b { color: var(--dark); }
  .ranked.compact li { font-size: 13px; padding: 5px 0; grid-template-columns: 22px minmax(0, 1fr) auto; }
  .ranked.compact .pos { width: 20px; height: 20px; font-size: 11px; }


  /* Etapas do projeto: lista na ordem das fases, com barra de cobertura */
  .stages { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .stage { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--track); }
  .stage:last-child { border-bottom: 0; }
  .stage .sn { font-size: 12px; font-weight: 700; color: var(--muted); }
  .stage .sl { font-size: 14px; color: var(--dark); }
  .stage .sv { font-size: 13px; color: var(--muted); white-space: nowrap; text-align: right; }
  .stage .sv b { color: var(--dark); font-size: 15px; }
  .stage .bar { grid-column: 2 / -1; height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .stage .bar i { display: block; height: 100%; border-radius: 999px; background: var(--red); }
  .stage.zero .sl { color: var(--muted); }
  .stage.zero .sv { color: var(--red); font-weight: 600; }
  .stages-foot { margin-top: 12px; font-size: 13px; color: var(--muted); }
  .stages-foot b { color: var(--dark); }

  /* Grade de blocos com ícone */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .tile { border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; align-content: start; }
  .tile .ti { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--red-tint); color: var(--red); }
  .tile .ti svg { width: 18px; height: 18px; }
  .tile .tv { font-size: 24px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
  .tile .tv small { font-size: 12px; font-weight: 600; color: var(--muted); margin-left: 4px; }
  .tile .tl2 { font-size: 12.5px; line-height: 1.3; }
  .tile.lead { border-color: var(--red); }


  /* Cobertura de segmentos */
  .cov { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; }
  @media (max-width: 760px) { .cov { grid-template-columns: 1fr; gap: 18px; } }
  .cov-head { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .cov-head .big { font-size: 34px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
  .cov-head .big small { font-size: 16px; font-weight: 700; color: var(--muted); }
  .cov-head .txt { font-size: 13px; color: var(--muted); }
  .meter { flex: 1; min-width: 160px; height: 10px; border-radius: 5px; background: var(--track); overflow: hidden; }
  .meter > div { height: 100%; border-radius: 5px; background: var(--red); }
  .cov h4 { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  .gaps { font-size: 13.5px; line-height: 1.7; color: var(--muted); margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; }
  .gaps li::before { content: "• "; color: #cbd5e1; }
  @media (max-width: 520px) { .gaps { grid-template-columns: 1fr; } }
  .gaps-box.closed .gaps { max-height: 0; overflow: hidden; }
  .none-note { font-size: 13.5px; color: var(--muted); }

  /* Rosca */
  .donut-wrap { display: flex; flex-direction: column; gap: 18px; align-items: stretch; }
  .donut-wrap .donut { align-self: center; }
  .donut { width: 150px; height: 150px; flex-shrink: 0; position: relative; }
  .donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .donut .ctr { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .donut .ctr b { font-size: 26px; font-weight: 800; display: block; line-height: 1; }
  .donut .ctr span { font-size: 11px; color: var(--muted); }
  .legend { display: grid; gap: 7px; width: 100%; font-size: 13px; }
  .legend .li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 8px; align-items: start; }
  .legend .dot { width: 12px; height: 12px; border-radius: 3px; margin-top: 3px; }
  .legend .n { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
  .legend .n b { color: var(--dark); }
  .legend .li.zero { color: #94a3b8; }

  /* Destaques (percentual + conclusão) */
  .insights { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .ins { display: grid; gap: 6px; align-content: start; }
  .ins .q { font-size: 15px; font-weight: 700; }
  .ins .qn { font-size: 12px; color: var(--muted); line-height: 1.4; }
  .ins .big { font-size: 34px; font-weight: 800; letter-spacing: -.03em; color: var(--red); line-height: 1; margin-top: 8px; }
  .ins .concl { margin: 0; font-size: 14px; color: var(--dark); line-height: 1.45; }
  .ins .next, .ins .base { margin: 0; font-size: 12.5px; color: var(--muted); }

  /* Barras horizontais (escalas) */
  .hbars { display: grid; gap: 12px; }
  .hb { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 12px; align-items: baseline; }
  .hb .hl { font-size: 13px; color: var(--dark); }
  .hb .hv { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .hb .hv b { font-size: 14px; }
  .hb .hv small { font-size: 12px; color: var(--muted); margin-left: 6px; }
  .hb .hv small::before { content: "· "; }
  .hb .hbar { grid-column: 1 / -1; height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .hb .hbar i { display: block; height: 100%; border-radius: 999px; background: var(--seq); }
  .hb.zero .hl, .hb.zero .hv b { color: #94a3b8; }

  /* Anel de porcentagem */
  .ring-wrap { display: flex; gap: 18px; align-items: center; }
  .ring { width: 120px; height: 120px; flex-shrink: 0; position: relative; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .ctr { position: absolute; inset: 0; display: grid; place-items: center; font-size: 24px; font-weight: 800; }

  /* Estados */
  .uf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
  .uf { border-radius: 12px; padding: 10px; background: var(--track); text-align: center; }
  .uf b { display: block; font-size: 22px; font-weight: 800; line-height: 1.1; }
  .uf span { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .06em; }
  .uf.top { background: var(--red); color: #fff; } .uf.top span { color: #fde2e2; }

  /* Lista de candidaturas */
  .cand-meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
</style>
</head>
<body>
<main class="wrap hidden" id="app">
  <div id="view-main">
    <h1>Parceiros</h1>
    <p class="muted">Métricas, habilidades disponíveis e candidaturas à Rede de Parceiros.</p>
    <p class="msg err hidden" id="load-err"></p>

    <div class="tabs" role="tablist" aria-label="Seções de parceiros">
      <button type="button" class="tab" role="tab" id="tab-dashboard" aria-controls="panel-dashboard" aria-selected="true">Dashboard</button>
      <button type="button" class="tab" role="tab" id="tab-candidaturas" aria-controls="panel-candidaturas" aria-selected="false">Candidaturas <span class="n" id="n-cand">0</span></button>
    </div>

    <details class="card fold" id="filters-box">
      <summary><span>Filtros<span class="active-count" id="active-count"></span></span><svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>
      <div class="filters" id="filters">
        <div class="search">
          <label for="f-busca">Buscar</label>
          <input type="search" id="f-busca" placeholder="Nome, empresa, e-mail, especialização, atividades, ferramentas, cidade…">
        </div>
      </div>
      <div class="filters-foot">
        <span class="muted" id="showing"></span>
        <button type="button" class="btn-ghost" id="clear">Limpar filtros</button>
      </div>
    </details>

    <section id="panel-dashboard" role="tabpanel" aria-labelledby="tab-dashboard">
      <div class="block"><div class="kpis" id="kpis"></div></div>

      <div class="block">
        <div class="block-head"><span class="num">01</span><h2>Habilidades disponíveis</h2></div>
        <div class="skill-groups" id="skill-groups"></div>
        <div class="g g3" style="margin-top:12px" id="skills-more"></div>
      </div>

      <div class="block">
        <div class="block-head"><span class="num">02</span><h2>Perfil e senioridade</h2></div>
        <div class="g g3" id="perfil"></div>
      </div>

      <div class="block">
        <div class="block-head"><span class="num">03</span><h2>Disponibilidade e formato</h2></div>
        <div class="g g3" id="disponibilidade"></div>
      </div>

      <div class="block">
        <div class="block-head"><span class="num">04</span><h2>Segmentos e conhecimento setorial</h2></div>
        <div class="g g3" id="segmentos"></div>
      </div>

      <div class="block">
        <div class="block-head"><span class="num">05</span><h2>Localização e origem</h2></div>
        <div class="g g3" id="localizacao"></div>
      </div>
    </section>

    <section id="panel-candidaturas" role="tabpanel" aria-labelledby="tab-candidaturas" class="hidden">
      <div class="cand-meta"><span id="cand-count"></span></div>
      <div class="card"><div class="rows" id="list"></div></div>
    </section>
  </div>

  <div id="view-detail" class="hidden">
    <a class="back" id="back" href="/admin/parceiros/?aba=candidaturas">← Todas as candidaturas</a>
    <div id="detail"></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/admin/admin.js"></script>
<script src="/admin/form-parceiros.js"></script>
<script>
const { el } = Admin;
const Q = Object.fromEntries(FORM_PARCEIROS.flatMap((s) => s.questions).map((q) => [q.id, q]));
const optionsOf = (id) => Q[id].groups ? Q[id].groups.flatMap((g) => g.options) : Q[id].options;
const SECOES = FORM_PARCEIROS.map((s) => ({ title: s.title, fields: s.questions.map((q) => [q.id, q.n + ". " + q.label]) }));
const CAT = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "var(--s5)", "var(--s6)"];
// Cor por opção (ordem do formulário); "Outro" sempre no cinza claro.
const catColor = (label, i) => (/^Outro/.test(label) ? "var(--s6)" : CAT[i % CAT.length]);
const clean = (s) => String(s).replace(/\.$/, "");
const pct = (n, t) => (t ? Math.round((n / t) * 100) : 0);
const plural = (n, s, p) => n + " " + (n === 1 ? s : p);
const norm = (s) => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const uf = (s) => ((s || "").toUpperCase().match(/\b([A-Z]{2})\s*\.?$/) || [])[1] || "-";
const MINUSC = new Set(["de", "da", "do", "das", "dos", "e"]);
// Tira o estado do fim ("Curitiba - PR", "Curitiba/PR", "Curitiba, PR") sem cortar nomes com hífen ("Embu-Guaçu").
const cidade = (s) => (s || "").replace(/\s*([—–\/,]|\s-)\s*[A-Za-z]{2}\s*\.?$/, "").split(/\s[—–-]\s|[\/,]/)[0].trim().replace(/\s+/g, " ").toLowerCase().split(" ").map((w, i) => (i && MINUSC.has(w) ? w : w.split("-").map((p) => p.charAt(0).toUpperCase() + p.slice(1)).join("-"))).join(" ") || "Não informado";
const startsSim = (v) => typeof v === "string" && v.startsWith("Sim");
const svg = (tag, attrs) => { const e = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };

/* ---------- Filtros ---------- */
const FILTROS = [
  { id: "areas_experiencia", label: "Área de experiência" },
  { id: "segmentos", label: "Segmento de mercado" },
  { id: "atuacao_pj", label: "Situação PJ" },
  { id: "disponibilidade_colaborar", label: "Disponibilidade" },
  { id: "horas_semanais", label: "Horas semanais" },
  { id: "formatos_atuacao", label: "Formato de atuação" },
  { id: "tempo_especialidade", label: "Tempo na especialidade" },
  { id: "uf", label: "Estado", derived: true },
];
const BUSCA = ["nome", "email", "cidade_estado", "apresentacao", "empresa", "principal_especializacao", "atividades_entregaveis", "conhecimento_segmento", "formacao", "certificacoes", "ferramentas", "projeto_relevante"];
let ALL = [];

function buildFilters() {
  const box = document.getElementById("filters");
  for (const f of FILTROS) {
    const wrap = el("div");
    const lab = el("label", null, f.label); lab.htmlFor = "f-" + f.id;
    const sel = el("select"); sel.id = "f-" + f.id;
    sel.append(new Option("Todos", ""));
    const opts = f.derived ? [...new Set(ALL.map((r) => uf(r.cidade_estado)))].sort() : optionsOf(f.id);
    for (const o of opts) sel.append(new Option(clean(o), o));
    sel.addEventListener("change", update);
    wrap.append(lab, sel);
    box.appendChild(wrap);
  }
  document.getElementById("f-busca").addEventListener("input", update);
  document.getElementById("clear").addEventListener("click", () => {
    document.getElementById("f-busca").value = "";
    FILTROS.forEach((f) => (document.getElementById("f-" + f.id).value = ""));
    update();
  });
}

function filtered() {
  const q = norm(document.getElementById("f-busca").value.trim());
  return ALL.filter((r) => {
    for (const f of FILTROS) {
      const v = document.getElementById("f-" + f.id).value;
      if (!v) continue;
      const rv = f.derived ? uf(r.cidade_estado) : r[f.id];
      if (Array.isArray(rv) ? !rv.includes(v) : rv !== v) return false;
    }
    return !q || BUSCA.some((k) => norm(r[k]).includes(q));
  });
}

function activeFilters() {
  return FILTROS.filter((f) => document.getElementById("f-" + f.id).value).length + (document.getElementById("f-busca").value.trim() ? 1 : 0);
}

/* ---------- Contagens ---------- */
// Escolha única: ordem do formulário (inclui zeros). Múltipla escolha: da mais para a menos frequente, sem zeros.
function counts(rows, id, getter) {
  const opts = getter ? [] : optionsOf(id);
  const m = new Map(opts.map((o) => [o, 0]));
  for (const r of rows) {
    const v = getter ? getter(r) : r[id];
    for (const x of Array.isArray(v) ? v : [v]) if (x != null && x !== "") m.set(x, (m.get(x) || 0) + 1);
  }
  let e = [...m.entries()];
  if (getter || Q[id]?.type === "checkbox") e = e.filter(([, n]) => n).sort((a, b) => b[1] - a[1]);
  return e;
}

/* ---------- Componentes visuais ---------- */
function card(title, opts = {}) {
  const c = el("div", "card" + (opts.cls ? " " + opts.cls : ""));
  c.appendChild(el("h3", null, title));
  if (opts.note) c.appendChild(el("p", "note", opts.note));
  return c;
}
const emptyNote = () => el("p", "muted", "Sem dados para os filtros atuais.");

// Escala da marca (escuro → claro) e a cor do texto que contrasta com cada passo.
const RAMP = ["#6e1f1f", "#9c3131", "#c94444", "#e06b63", "#ec948c"];
const rampFor = (n, max) => { const i = Math.min(RAMP.length - 1, Math.floor((1 - n / max) * RAMP.length)); return { bg: RAMP[i], fg: i <= 2 ? "#fff" : "var(--dark)" }; };

// Lista numerada (1º, 2º…); "Ver todas" abre o restante.
function ranked(entries, total, { limit = 5, compact = false } = {}) {
  const wrap = el("div");
  const ol = el("ol", "ranked" + (compact ? " compact" : ""));
  entries.forEach(([label, n], i) => {
    const li = el("li", i >= limit ? "hidden extra" : "");
    const cnt = el("span", "cnt"); cnt.append(el("b", null, String(n)));
    if (total) cnt.append(document.createTextNode(" · " + pct(n, total) + "%"));
    li.append(el("span", "pos", String(i + 1)), el("span", null, clean(label)), cnt);
    ol.appendChild(li);
  });
  wrap.appendChild(ol);
  if (entries.length > limit) wrap.appendChild(toggleMore(ol, entries.length));
  return wrap;
}

function toggleMore(box, n) {
  const btn = el("button", "more", "Ver todas (" + n + ")");
  btn.type = "button";
  btn.addEventListener("click", () => {
    const open = btn.dataset.open !== "1";
    box.querySelectorAll(".extra").forEach((x) => x.classList.toggle("hidden", !open));
    btn.dataset.open = open ? "1" : "";
    btn.textContent = open ? "Mostrar menos" : "Ver todas (" + n + ")";
  });
  return btn;
}

// Etapas do projeto: uma linha por fase, na ordem do projeto. Quem atua em todas as etapas
// conta em cada uma; a barra mostra a parte das candidaturas que cobre a fase.
function stages(rows, id) {
  const t = rows.length;
  const ALL = "Atuação transversal em todas as etapas.";
  const opts = optionsOf(id).filter((o) => o !== ALL);

// Grade de blocos com ícone por formato de contratação.
const CONTRATO_ICONS = [

  [/hora/, '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],
  [/diária/, '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'],
  [/entregáveis/, '<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/>'],
  [/recorrente/, '<path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>'],
  [/mentoria/, '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>'],
  [/negociável/, '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>'],
];
function tiles(rows, id) {
  const t = rows.length;
  const cnt = new Map(counts(rows, id));
  const opts = optionsOf(id).slice().sort((a, b) => (cnt.get(b) || 0) - (cnt.get(a) || 0));
  const g = el("div", "tiles");
  opts.forEach((o, i) => {
    const n = cnt.get(o) || 0;
    const tl = el("div", "tile" + (i === 0 && n ? " lead" : ""));
    tl.title = clean(o) + ": " + plural(n, "parceiro", "parceiros");
    const ic = el("div", "ti");
    const path = (CONTRATO_ICONS.find(([re]) => re.test(o)) || [null, '<circle cx="12" cy="12" r="9"/>'])[1];
    ic.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${path}</svg>`;
    const v = el("div", "tv", pct(n, t) + "%"); v.appendChild(el("small", null, "(" + n + ")"));
    tl.append(ic, v, el("div", "tl2", clean(o)));

// Cobertura de segmentos: quantos dos 24 têm parceiros, ranking dos cobertos e lista das lacunas.
function coverage(rows, id) {
  const t = rows.length;
  const cnt = new Map(counts(rows, id));
  const opts = optionsOf(id);
  const covered = opts.filter((o) => cnt.get(o)).map((o) => [o, cnt.get(o)]).sort((a, b) => b[1] - a[1]);
  const gaps = opts.filter((o) => !cnt.get(o));
  const wrap = el("div", "cov");

  const head = el("div", "cov-head");
  const big = el("div", "big", String(covered.length)); big.appendChild(el("small", null, " / " + opts.length));
  const meter = el("div", "meter"); const fill = el("div"); fill.style.width = pct(covered.length, opts.length) + "%"; meter.appendChild(fill);
  head.append(big, el("div", "txt", "segmentos com pelo menos um parceiro"), meter);
  wrap.appendChild(head);

  const left = el("div");
  left.appendChild(el("h4", null, "Onde a rede tem parceiros"));
  left.appendChild(covered.length ? ranked(covered, t, { limit: 8, compact: true }) : el("p", "none-note", "Nenhum segmento marcado ainda."));
  wrap.appendChild(left);

  const right = el("div", "gaps-box" + (gaps.length > 8 ? " closed" : ""));
  right.appendChild(el("h4", null, "Lacunas · " + plural(gaps.length, "segmento", "segmentos") + " sem parceiros"));
  if (!gaps.length) right.appendChild(el("p", "none-note", "Nenhuma lacuna: todos os segmentos têm parceiros."));
  else {
    const ul = el("ul", "gaps");
    gaps.forEach((o) => ul.appendChild(el("li", null, clean(o))));
    right.appendChild(ul);
    if (gaps.length > 8) {
      const btn = el("button", "more", "Ver as " + gaps.length + " lacunas");
      btn.type = "button";
      btn.addEventListener("click", () => { const closed = right.classList.toggle("closed"); btn.textContent = closed ? "Ver as " + gaps.length + " lacunas" : "Mostrar menos"; });
      right.appendChild(btn);
    }
  }
  wrap.appendChild(right);
  return wrap;
}

// Destaque: a resposta mais comum em evidência, com mini-rosca e a lista completa sob demanda.
// Destaque: em vez de gráfico, o percentual da resposta mais comum e uma conclusão em uma frase.
function insight(title, rows, id) {
  const c = el("div", "card ins");
  c.appendChild(el("div", "q", title));
  if (Q[id]) c.appendChild(el("div", "qn", "Pergunta " + Q[id].n + " · " + Q[id].label));
  const t = rows.length;
  const e = counts(rows, id).filter(([, n]) => n).sort((a, b) => b[1] - a[1]);
  if (!t || !e.length) { c.appendChild(emptyNote()); return c; }
  const [label, n] = e[0];
  const p = pct(n, t);
  const tie = e[1] && e[1][1] === n;
  const ans = "“" + clean(label) + "”";
  const sentence = tie ? "Empate entre " + ans + " e “" + clean(e[1][0]) + "”, com " + p + "% cada."
    : p === 100 ? "Todos os parceiros responderam " + ans + "."
    : p > 50 ? "A maioria da rede respondeu " + ans + "."
    : "A resposta mais comum foi " + ans + ".";
  c.append(el("div", "big", p + "%"), el("p", "concl", sentence));
  const rest = e.slice(tie ? 2 : 1, tie ? 3 : 2)[0];
  if (rest && !tie) c.appendChild(el("p", "next", "Em seguida: " + clean(rest[0]) + " (" + pct(rest[1], t) + "%)."));
  c.appendChild(el("p", "base", "Base: " + plural(t, "candidatura", "candidaturas") + "."));
  return c;
}

// Rosca: cor fixa por opção (ordem do formulário), números sempre visíveis na legenda.
function donut(entries, total, centerLabel) {
  const wrap = el("div", "donut-wrap");
  const d = el("div", "donut");
  const s = svg("svg", { viewBox: "0 0 42 42", role: "img", "aria-label": centerLabel });
  const R = 15.9155, C = 2 * Math.PI * R, GAP = entries.filter(([, n]) => n).length > 1 ? 0.6 : 0;
  s.appendChild(svg("circle", { cx: 21, cy: 21, r: R, fill: "none", stroke: "#f1f5f9", "stroke-width": 6 }));
  let off = 0;
  entries.forEach(([label, n], i) => {
    if (!n || !total) return;
    const len = (n / total) * C;
    const c = svg("circle", { cx: 21, cy: 21, r: R, fill: "none", stroke: catColor(label, i), "stroke-width": 6,
      "stroke-dasharray": Math.max(len - GAP, 0.01) + " " + (C - Math.max(len - GAP, 0.01)), "stroke-dashoffset": -off });
    const t = svg("title", {}); t.textContent = clean(label) + ": " + n + " (" + pct(n, total) + "%)";
    c.appendChild(t); s.appendChild(c);
    off += len;
  });
  d.appendChild(s);
  const ctr = el("div", "ctr"); const inner = el("div"); inner.append(el("b", null, String(total)), el("span", null, centerLabel)); ctr.appendChild(inner);
  d.appendChild(ctr);
  const lg = el("div", "legend");
  entries.forEach(([label, n], i) => {
    const li = el("div", "li" + (n ? "" : " zero"));
    const dot = el("span", "dot"); dot.style.background = n ? catColor(label, i) : "#e2e8f0";
    const v = el("span", "n"); v.append(el("b", null, String(n)), document.createTextNode(" · " + pct(n, total) + "%"));
    li.append(dot, el("span", null, clean(label)), v);
    lg.appendChild(li);
  });
  wrap.append(d, lg);
  return wrap;
}

// Barras horizontais para respostas em escala (tempo, formação, horas): mantém a ordem da escala
// e mostra a porcentagem das candidaturas; a quantidade fica ao lado.
function columns(entries, total) {
  const box = el("div", "hbars");
  for (const [label, n] of entries) {
    const p = pct(n, total);
    const row = el("div", "hb" + (n ? "" : " zero"));
    row.title = clean(label) + ": " + plural(n, "parceiro", "parceiros") + " (" + p + "%)";
    const v = el("span", "hv"); v.append(el("b", null, p + "%"), el("small", null, String(n)));
    const bar = el("span", "hbar"); const fill = el("i"); fill.style.width = p + "%"; bar.appendChild(fill);
    row.append(el("span", "hl", clean(label)), v, bar);
    box.appendChild(row);
  }
  return box;
}

function ring(n, total, text) {
  const wrap = el("div", "ring-wrap");
  const r = el("div", "ring");
  const s = svg("svg", { viewBox: "0 0 42 42", role: "img", "aria-label": text });
  const R = 15.9155, C = 2 * Math.PI * R, len = total ? (n / total) * C : 0;
  s.append(svg("circle", { cx: 21, cy: 21, r: R, fill: "none", stroke: "#f1f5f9", "stroke-width": 5 }),
    svg("circle", { cx: 21, cy: 21, r: R, fill: "none", stroke: "var(--red)", "stroke-width": 5, "stroke-linecap": "round", "stroke-dasharray": len + " " + (C - len) }));
  r.append(s, el("div", "ctr", pct(n, total) + "%"));
  const t = el("div"); t.append(el("div", null, text), el("div", "muted", plural(n, "parceiro", "parceiros") + " de " + total));
  wrap.append(r, t);
  return wrap;
}

function skills(rows) {
  const t = rows.length;
  const groups = document.getElementById("skill-groups"); groups.replaceChildren();
  Q.areas_experiencia.groups.forEach((g, i) => {
    const people = rows.filter((r) => (r.areas_experiencia || []).some((x) => g.options.includes(x))).length;

    const c = el("div", "card sg"); c.style.setProperty("--c", CAT[i % CAT.length]);
    const gv = el("div", "gv"); gv.append(el("b", null, String(people)), el("span", null, (people === 1 ? "parceiro" : "parceiros") + " · " + pct(people, t) + "%"));
    c.append(el("div", "gn", g.title), gv, top.length ? ranked(top.slice(0, 3), 0, { limit: 3, compact: true }) : el("span", "muted", "Nenhuma habilidade nesta área."));

  const m = new Map();
  for (const r of rows) { const raw = (r.principal_especializacao || "").trim(); if (!raw) continue; const k = norm(raw); const cur = m.get(k) || { label: raw, n: 0 }; cur.n++; m.set(k, cur); }

  const c3 = card("Tipos de serviço prestados", { cls: "span2", note: "Pergunta " + Q.formas_colaboracao.n + " · ranking dos mais oferecidos, com a quantidade de parceiros e o % das candidaturas." });

}

    Admin.markSeen("cadastros", data);
    // Junta à opção "Outro" o texto que a pessoa escreveu.
    const shown = { ...data };
    // Candidaturas antigas tinham certificações em pergunta separada; agora fica junto da formação.
    if (data.certificacoes) shown.formacao = [data.formacao, data.certificacoes].filter(Boolean).join("\n");
    for (const [k, txt] of Object.entries(data.outros || {})) {
      const addTxt = (v) => (/^Outr[oa]s?\b/.test(v) ? v.replace(/\.$/, "") + ": " + txt : v);
      shown[k] = Array.isArray(shown[k]) ? shown[k].map(addTxt) : addTxt(shown[k] || "");
    }
    box.replaceChildren(Admin.detail(shown, SECOES, "Candidatura enviada em " + Admin.fmtDate(data.created_at)));
    return;
  }
  const { data, error } = await Admin.sb.from("cadastros").select("*").order("created_at", { ascending: false });
  const err = document.getElementById("load-err");
  err.classList.toggle("hidden", !error);
  if (error) { err.textContent = "Não foi possível carregar as candidaturas: " + error.message; return; }
  // Respostas de versões antigas do formulário passam a contar na opção atual equivalente.
  const LEGADO = {
    atuacao_pj: { "Sim, tenho CNPJ ativo.": "Sim, tenho CNPJ ativo (MEI, empresa ou consultoria própria).", "Sim, atuo por meio de uma empresa ou consultoria própria.": "Sim, tenho CNPJ ativo (MEI, empresa ou consultoria própria)." },
    como_conheceu: { "Já conhecia o trabalho da Dani Moscatelli.": "Indicação da Dani Moscatelli." },
  };
  for (const r of data) for (const [k, map] of Object.entries(LEGADO)) if (map[r[k]]) r[k] = map[r[k]];
  ALL = data;
  if (!document.getElementById("f-areas_experiencia")) buildFilters();
  if (window.matchMedia("(min-width: 800px)").matches) document.getElementById("filters-box").open = true;
  setTab(params.get("aba"));
  update();
}});
</script>
</body>
</html>
