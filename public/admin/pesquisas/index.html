  @media (prefers-reduced-motion: reduce) { .pa-seg i, .pa-pilha2 i, .pa-div-esq i, .pa-div-dir i, .pa-colunas .c i, .pa-funil-linha .t i, .pa-cmp-l .t i, .pa-int-card { transition: none; } .pa-int-card:hover { transform: none; } }
  /* Cartão de insight (modelo da dona do produto) */
  .pa-ic { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 20px; display: grid; gap: 14px; align-content: start; transition: box-shadow .25s, transform .25s; }
  .pa-ic:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .pa-ic-topo { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
  .pa-ic-tags { display: flex; flex-wrap: wrap; gap: 6px; }

  .pa-ic-tag.leve { background: var(--card); border: 1px solid var(--border); color: var(--muted-foreground); font-weight: 600; }
  .pa-ic-sinal { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; }
  .pa-ic-sinal svg { width: 16px; height: 16px; }
  .pa-ic h3 { margin: 0; font-size: 18px; line-height: 1.35; letter-spacing: -0.01em; }

  .pa-ic-desc strong { color: var(--foreground); }
  .pa-ic-painel { display: grid; gap: 12px; padding: 16px; border-radius: var(--radius-md); background: var(--background); }
  .pa-ic-pcab { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--muted-foreground); }
  .pa-ic-pcab b { color: var(--foreground); text-align: right; }
  .pa-ic-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px 20px; }
  .pa-ic-kpis div { display: grid; gap: 2px; }
  .pa-ic-kpis b { font-size: 26px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em; }
  .pa-ic-kpis span { font-size: 12.5px; color: var(--muted-foreground); }
  .pa-ic-barra { display: grid; gap: 5px; }
  .pa-ic-barra .r { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
  .pa-ic-barra .r b { white-space: nowrap; }
  .pa-ic-barra .t { height: 8px; overflow: hidden; }
  .pa-ic-barra .t i { display: block; height: 100%; width: 0; border-radius: var(--radius-sm); transition: width .8s var(--ease-snappy); }
  .pa-ic-barra small { font-size: 11px; color: var(--muted-foreground); }
  .pa-ic-barra:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; border-radius: var(--radius-sm); }
  .pa-ic-nota { margin: 0; font-size: 12.5px; color: var(--muted-foreground); }
  .pa-ic-painel .pa-fluxos li { background: var(--card); }
  .pa-ic-painel .pa-int-tab td, .pa-ic-painel .pa-int-tab th { border-bottom-color: var(--muted); }
  .pa-ic-sig { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; }
  .pa-ic-ic { width: 22px; height: 22px; color: var(--foreground); margin-top: 1px; }
  .pa-ic-ic svg { width: 22px; height: 22px; }
  .pa-ic-sig h4, .pa-ic-prox h4 { margin: 0 0 4px; font-size: 15px; }
  .pa-ic-sig p, .pa-ic-prox p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--foreground); }
  .pa-ic-prox { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-top: 14px; border-top: 1px solid var(--border); }
  .pa-ic-prox p { color: var(--muted-foreground); font-size: 13.5px; }
  .pa-ic-seta { width: 20px; height: 20px; color: var(--foreground); flex: none; margin-top: 2px; }
  .pa-ic-seta svg { width: 20px; height: 20px; }
  @media (prefers-reduced-motion: reduce) { .pa-ic, .pa-ic-barra .t i { transition: none; } .pa-ic:hover { transform: none; } }
  .pa-vazio { text-align: center; padding: 28px 12px; color: var(--muted-foreground); }
  .pa-vazio b { display: block; color: var(--foreground); font-size: 15px; margin-bottom: 4px; }
  .pa-esqueleto { height: 120px; border-radius: var(--radius-lg); background: linear-gradient(90deg, var(--muted) 0%, var(--background) 50%, var(--muted) 100%); background-size: 200% 100%; animation: pa-brilho 1.4s ease-in-out infinite; }
  @keyframes pa-brilho { to { background-position: -200% 0; } }
  .pa-entra { animation: pa-entra .5s var(--ease-snappy) both; }
  @keyframes pa-entra { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .pa-entra, .pa-esqueleto, .pa-status::before { animation: none; } .pa-barra .t i, .pa-escala .c i, .pa-pilha i { transition: none; } }
  .pa-spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: pa-gira .7s linear infinite; flex-shrink: 0; }
  @keyframes pa-gira { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .pa-spin { animation-duration: 2s; } }
  #pa-print { display: none; }
  @media print {
    body.pa-imprimindo > *:not(#pa-print) { display: none !important; }
    body.pa-imprimindo { background: #fff !important; }

    #pa-print .pa-print-tit { font-size: 20px; margin: 0 0 12px; }
    #pa-print .card { box-shadow: none !important; break-inside: avoid; }
    /* no papel, os cards ficam um embaixo do outro (a grade de 2 colunas quebrava uma página por card) */

<body>
<main class="wrap hidden" id="app">
  <a class="back hidden" id="voltar" href="/admin/pesquisas/">← Pesquisas</a>
  <h1 id="titulo">Pesquisas</h1>
  <p class="muted" id="sub">Pesquisas do Studio: acompanhe as respostas, compartilhe o link e tire do ar quando quiser.</p>
  <p class="msg err hidden" id="load-err" role="alert"></p>
  <div id="conteudo"><div class="pa-esqueleto"></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/admin/admin.js?v=20261123g"></script>
<script>
(() => {
  const { sb, el, icon, fmtDate, fmtDay, log, confirmDialog, toast } = Admin;
  const SITE = "https://www.danimoscatelli.com.br";
  const API = "https://lipfvnerohkaajegqvwr.supabase.co/functions/v1/pesquisa";
  // Pesquisas conhecidas pelo site: endereço público de cada uma
  const PAGINAS = { "moda-curitiba": "/pesquisa/moda-curitiba/" };
  const $ = (id) => document.getElementById(id);
  const svg = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const IC = {
    copiar: svg('<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>'),
    ok: svg('<path d="M20 6 9 17l-5-5"/>'),
    abrir: svg('<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>'),
    pausa: svg('<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>'),
    play: svg('<path d="m6 3 14 9-14 9z"/>'),
    pesquisa: svg('<path d="M9 11h6M9 15h4"/><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 3v3h6V3"/>'),
    info: svg('<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>'),
    lixo: svg('<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>'),
  };
  const pct = (n, d) => (d ? Math.round((n / d) * 100) : 0);
  const plural = (n, um, varios) => `${n.toLocaleString("pt-BR")} ${n === 1 ? um : varios}`;
  const SITUACAO = { completa: "Completas", fora_de_curitiba: "Fora de Curitiba e Região Metropolitana", sem_compras: "Não compraram este ano" };
  const slug = new URLSearchParams(location.search).get("p");

  Admin.init({ page: "pesquisas", onReady: () => (slug ? painel(slug) : lista()) });

  /* ---------- Lista de pesquisas ---------- */
  async function lista() {
    const [{ data: ps, error }, { data: novas }] = await Promise.all([
      sb.from("pesquisas").select("slug, titulo, ativa, criada_em").order("criada_em", { ascending: false }),
      sb.from("pesquisa_respostas").select("pesquisa").is("visualizado_em", null).limit(5000),
    ]);
    if (error) return erro("Não foi possível carregar as pesquisas: " + error.message);
    const contagem = {}; (novas || []).forEach((r) => { contagem[r.pesquisa] = (contagem[r.pesquisa] || 0) + 1; });
    const c = $("conteudo"); c.replaceChildren();
    if (!ps.length) { c.appendChild(vazio("Nenhuma pesquisa ainda", "Quando houver uma pesquisa, ela aparece aqui.")); return; }
    const wrap = el("div", "pa-lista pa-entra");
    ps.forEach((p) => {
      const a = el("a", "pa-item"); a.href = "?p=" + encodeURIComponent(p.slug);
      const ic = el("span", "ic"); ic.innerHTML = IC.pesquisa;
      const tx = el("span", "tx"); tx.append(el("b", null, p.titulo), el("span", null, (p.ativa ? "No ar" : "Fora do ar") + " · criada em " + new Date(p.criada_em).toLocaleDateString("pt-BR")));
      a.append(ic, tx);
      if (contagem[p.slug]) a.appendChild(el("span", "pa-novas", plural(contagem[p.slug], "nova", "novas")));
      else a.appendChild(el("span"));
      wrap.appendChild(a);
    });
    c.appendChild(wrap);
  }

  /* ---------- Painel de uma pesquisa ---------- */
  let P = null, Q = null, R = [], I = [];
  async function painel(s) {
    $("voltar").classList.remove("hidden");
    const [p, r, i, q] = await Promise.all([
      sb.from("pesquisas").select("slug, titulo, ativa, criada_em, atualizado_em").eq("slug", s).maybeSingle(),
      sb.from("pesquisa_respostas").select("id, envio_id, created_at, situacao, respostas, relato, quer_novidades, visualizado_em").eq("pesquisa", s).order("created_at", { ascending: false }).limit(10000),
      sb.from("pesquisa_interessados").select("id, envio_id, created_at, nome, email, whatsapp, consentimento_em, consentimento_versao").eq("pesquisa", s).order("created_at", { ascending: false }).limit(10000),
      fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ acao: "status", pesquisa: s }) }).then((x) => x.json()).catch(() => null),
    ]);
    if (p.error || !p.data) return erro(p.error ? "Não foi possível carregar a pesquisa: " + p.error.message : "Pesquisa não encontrada.");
    if (r.error) return erro("Não foi possível carregar as respostas: " + r.error.message);
    if (!q || !q.questionario) return erro("Não foi possível carregar as perguntas da pesquisa. Atualize a página para tentar de novo.");
    P = p.data; Q = q.questionario; R = r.data || []; I = i.data || [];
    document.title = P.titulo + " | Área restrita";
    $("titulo").textContent = P.titulo;
    $("sub").textContent = "Projeto do Dani Moscatelli Studio. Respostas analisadas em conjunto, sem identificar quem respondeu.";
    desenhar();
    // ao abrir, as respostas novas deixam de aparecer como notificação
    const novas = R.filter((x) => !x.visualizado_em).map((x) => x.id);
    if (novas.length) {
      for (let k = 0; k < novas.length; k += 200) await sb.from("pesquisa_respostas").update({ visualizado_em: new Date().toISOString() }).in("id", novas.slice(k, k + 200));
      Admin.refreshNotifications();
    }
  }

  function desenhar() {
    const c = $("conteudo"); c.replaceChildren();
    c.append(topo(), kpis(), apagarTudo(), abas());
  }

  // Cabeçalho do painel: situação e "Ações" na mesma linha; o link com "Copiar" logo abaixo.
  // As ações (ver, exportar, tirar do ar) ficam num menu, para o card não quebrar em várias linhas no celular.
  function topo() {
    const card = el("section", "card pa-topo pa-entra");
    const cab = el("div", "pa-cab");
    const esq = el("div");
    const st = el("span", "pa-status" + (P.ativa ? "" : " off"), P.ativa ? "No ar, recebendo respostas" : "Fora do ar");
    esq.append(st);
    const ult = R[0] ? "Última resposta: " + fmtDate(R[0].created_at) : "Ainda sem respostas";
    const m = el("p", "muted", ult); m.style.marginTop = "8px"; esq.appendChild(m);
    const url = SITE + (PAGINAS[P.slug] || "/pesquisa/" + P.slug + "/");
    cab.append(esq, menuAcoes(url));
    const link = el("div", "pa-link");
    const inp = el("input"); inp.type = "text"; inp.readOnly = true; inp.value = url; inp.setAttribute("aria-label", "Link da pesquisa");
    inp.addEventListener("focus", () => inp.select());
    const copiar = el("button", "pa-btn"); copiar.type = "button"; copiar.innerHTML = IC.copiar + '<span class="pa-rot">Copiar link</span>';
    copiar.setAttribute("aria-label", "Copiar link da pesquisa");
    copiar.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(url); } catch { inp.select(); document.execCommand && document.execCommand("copy"); }
      copiar.classList.add("ok"); copiar.innerHTML = IC.ok + '<span class="pa-rot">Link copiado</span>';
      setTimeout(() => { copiar.classList.remove("ok"); copiar.innerHTML = IC.copiar + '<span class="pa-rot">Copiar link</span>'; }, 2200);
    });
    link.append(inp, copiar);
    card.append(cab, link);
    return card;
  }
  // Menu "Ações": abre abaixo do botão, alinhado à direita; Esc, clique fora ou escolher uma ação fecham.
  // Setas para cima e para baixo navegam entre os itens. O próprio botão mostra o andamento (ex.: gerando planilha).
  function menuAcoes(url) {
    const caixa = el("div", "pa-menu-caixa");
    const btn = el("button", "pa-btn pa-menu-btn"); btn.type = "button";
    btn.setAttribute("aria-haspopup", "menu"); btn.setAttribute("aria-expanded", "false"); btn.id = "pa-acoes-btn";
    btn.innerHTML = '<span>Ações</span>' + svg('<path d="m6 9 6 6 6-6"/>');
    const menu = el("div", "pa-menu"); menu.setAttribute("role", "menu"); menu.setAttribute("aria-labelledby", btn.id); menu.hidden = true;
    const item = (ic, texto, dica, acao, cls = "") => {
      const b = el(acao.href ? "a" : "button", "pa-menu-it" + cls); b.setAttribute("role", "menuitem"); b.tabIndex = -1;
      if (acao.href) { b.href = acao.href; b.target = "_blank"; b.rel = "noopener"; } else b.type = "button";
      b.innerHTML = ic + "<span><b>" + texto + "</b>" + (dica ? "<small>" + dica + "</small>" : "") + "</span>";
      b.addEventListener("click", () => { fechar(false); if (acao.fn) acao.fn(); });
      return b;
    };
    menu.append(
      item(IC.abrir, "Ver a pesquisa", "Abre o link numa nova aba", { href: url }),
      item(IC_BAIXAR, "Exportar Excel", "Planilha com todas as abas", { fn: () => exportarExcel(btn) }),
      item(IC_BAIXAR, "Exportar PDF", "Relatório completo; escolha Salvar como PDF", { fn: exportarPdf }),
      el("div", "pa-menu-sep"),
      P.ativa ? item(IC.pausa, "Tirar do ar", "O link para de aceitar respostas", { fn: () => alternar(btn) }, " perigo")
              : item(IC.play, "Colocar no ar", "O link volta a aceitar respostas", { fn: () => alternar(btn) }, " liga"),
    );
    const itens = () => [...menu.querySelectorAll(".pa-menu-it")];
    const fora = (e) => { if (!caixa.contains(e.target)) fechar(false); };
    function abrir() {
      menu.hidden = false; btn.setAttribute("aria-expanded", "true"); caixa.classList.add("aberto");
      requestAnimationFrame(() => itens()[0]?.focus());
      document.addEventListener("pointerdown", fora);
    }
    function fechar(voltarFoco = true) {
      if (menu.hidden) return;
      menu.hidden = true; btn.setAttribute("aria-expanded", "false"); caixa.classList.remove("aberto");
      document.removeEventListener("pointerdown", fora);
      if (voltarFoco) btn.focus();
    }
    btn.addEventListener("click", () => (menu.hidden ? abrir() : fechar()));
    btn.addEventListener("keydown", (e) => { if (e.key === "ArrowDown") { e.preventDefault(); abrir(); } });
    menu.addEventListener("keydown", (e) => {
      const l = itens(), k = l.indexOf(document.activeElement);
      if (e.key === "Escape") { e.preventDefault(); fechar(); }
      else if (e.key === "ArrowDown") { e.preventDefault(); l[(k + 1) % l.length].focus(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); l[(k - 1 + l.length) % l.length].focus(); }
      else if (e.key === "Home") { e.preventDefault(); l[0].focus(); }
      else if (e.key === "End") { e.preventDefault(); l[l.length - 1].focus(); }
      else if (e.key === "Tab") fechar(false);
    });
    caixa.append(btn, menu);
    return caixa;
  }


  async function alternar(btn) {
    const ligar = !P.ativa;
    const ok = await confirmDialog(ligar
      ? { title: "Colocar a pesquisa no ar?", message: "O link volta a aceitar respostas na hora.", ok: "Colocar no ar", danger: false }
      : { title: "Tirar a pesquisa do ar?", message: "Quem abrir o link verá que a pesquisa não está recebendo respostas. As respostas já recebidas continuam aqui, e você pode colocar no ar de novo quando quiser.", ok: "Tirar do ar" });
    if (!ok) return;
    btn.disabled = true;
    const { error } = await sb.from("pesquisas").update({ ativa: ligar, atualizado_em: new Date().toISOString() }).eq("slug", P.slug);
    btn.disabled = false;
    if (error) return toast("Não foi possível alterar: " + error.message);
    P.ativa = ligar;
    log(ligar ? "Colocou a pesquisa no ar" : "Tirou a pesquisa do ar", P.titulo);
    toast(ligar ? "Pesquisa no ar" : "Pesquisa fora do ar");
    desenhar();
  }

  function kpis() {
    const completas = R.filter((x) => x.situacao === "completa").length;
    const encerradas = R.length - completas;
    const wrap = el("div", "pa-kpis pa-entra");
    const k = (n, t, s) => { const d = el("div", "pa-kpi"); d.append(el("b", null, n), el("span", null, t)); if (s) d.append(el("small", null, s)); return d; };
    wrap.append(
      k(R.length.toLocaleString("pt-BR"), "participações", R.length ? "todas as pessoas que enviaram" : ""),
      k(completas.toLocaleString("pt-BR"), "respostas completas", R.length ? pct(completas, R.length) + "% das participações" : ""),
      k(encerradas.toLocaleString("pt-BR"), "fora do público", encerradas ? `${R.filter((x) => x.situacao === "fora_de_curitiba").length} fora de Curitiba e RMC · ${R.filter((x) => x.situacao === "sem_compras").length} sem compras` : ""),
      (() => { const q = R.filter((x) => x.quer_novidades).length; return k(q.toLocaleString("pt-BR"), "querem novidades", completas ? `${pct(q, completas)}% das completas · ${plural(I.length, "contato guardado", "contatos guardados")}` : ""); })(),
    );
    return wrap;
  }

  let ABA_INICIAL = null; // depois de excluir, o painel é redesenhado e volta para a mesma aba
  function abas() {
    const relatos = R.filter((x) => x.relato && x.relato.trim());
    const box = el("div");
    const bar = el("div", "pa-abas"); bar.setAttribute("role", "tablist"); bar.setAttribute("aria-label", "Seções da pesquisa");
    const corpo = el("div"); corpo.setAttribute("role", "tabpanel");
    const defs = [["resultados", "Resultados", null], ["inteligencia", "Inteligência", null], ["respostas", "Respostas", R.length], ["relatos", "Relatos", relatos.length], ["interessados", "Interessados", I.length]];
    const botoes = defs.map(([id, t, n]) => {
      const b = el("button"); b.type = "button"; b.setAttribute("role", "tab"); b.id = "aba-" + id; b.append(t);
      if (n != null) b.appendChild(el("span", "n", String(n)));
      b.addEventListener("click", () => abrir(id));
      bar.appendChild(b); return b;
    });
    const abrir = (id) => {

      const fQ = pct(quer.filter((x) => ["frequentemente", "quase_sempre"].includes(x.respostas.q7)).length, quer.length), fT = pct(freq.length, n);

  /* ---------- Respostas individuais (ver e excluir) ---------- */
  const SIT_CURTA = { completa: "Completa", fora_de_curitiba: "Fora de Curitiba e RMC", sem_compras: "Não comprou este ano" };
  function textoResposta(p, v) {
    if (v == null) return "—";
    const op = (id) => ((p.opcoes || []).find((o) => o.id === id) || {}).texto?.replace(/ \(especifique\)$/, "") || id;
    if (p.tipo === "unica") return op(v);
    // classificação; respostas antigas de escolha única (ex.: pergunta 5 antes da v13) aparecem como 1º
    if (p.tipo === "ranking") return valores(v).map((id, k) => `${k + 1}º ${op(id)}`).join(" · ");
    if (p.tipo === "escala") return String(v);
    if (p.tipo === "escalas") return typeof v === "number" ? String(v) : (p.linhas || []).map((l) => `${l.texto}: ${v[l.id] ?? "—"}`).join("\n");
    if (p.tipo === "matriz") return p.linhas.map((l) => `${l.texto}: ${(p.colunas.find((c) => c.id === v[l.id]) || {}).texto || "—"}`).join("\n");
    return (v.opcoes || []).map((id) => op(id) + ((p.opcoes.find((o) => o.id === id) || {}).outro && v.outro ? ` (${v.outro})` : "")).join(" · ");
  }
  async function excluirRespostas(ids, todas) {
    const q = sb.from("pesquisa_respostas").delete();
    const { error } = await (todas ? q.eq("pesquisa", P.slug) : q.in("id", ids));
    if (error) { toast("Não foi possível excluir: " + error.message); return false; }
    // junto vai o interesse em receber os avisos do lançamento (o contato fica ligado à resposta pelo envio_id)
    const envios = todas ? null : R.filter((x) => ids.includes(x.id)).map((x) => x.envio_id).filter(Boolean);
    R = todas ? [] : R.filter((x) => !ids.includes(x.id));
    let falhaI = null;
    if (todas || envios.some((e) => I.some((y) => y.envio_id === e))) {
      const qi = sb.from("pesquisa_interessados").delete();
      const { error: eI } = await (todas ? qi.eq("pesquisa", P.slug) : qi.in("envio_id", envios));
      if (eI) falhaI = eI.message; else I = todas ? [] : I.filter((y) => !envios.includes(y.envio_id));
    }
    log(todas ? "Apagou todas as respostas e os interessados da pesquisa" : "Excluiu uma resposta da pesquisa", P.titulo);
    if (falhaI) { toast((todas ? "As respostas foram apagadas" : "A resposta foi excluída") + ", mas não foi possível apagar o contato em Interessados: " + falhaI); ABA_INICIAL = "interessados"; }
    else { toast(todas ? "Respostas e interessados apagados" : "Resposta excluída"); ABA_INICIAL = "respostas"; }
    desenhar(); Admin.refreshNotifications();
    return !falhaI;
  }

  // "Apagar todas as respostas" reinicia a pesquisa inteira, por isso fica fora das abas (e fora do menu Ações)

  const ROTULO = { q1: "Onde mora", q1_1: "Compra em Curitiba", q2: "Onde mais comprou este ano", q2_1: "Por que compra fora", q3: "Segunda mão (brechós)",

  function perfilDe(x) {

  function listaRespostas() {

  // valor de cada pergunta na ficha: texto, lista em ordem (1º, 2º, 3º), etiquetas ou barras de nota
  function valorFicha(p, v) {
    const op = (id) => ((p.opcoes || []).find((o) => o.id === id) || {});
    const nome = (id) => (op(id).texto || id).replace(/ \(especifique\)$/, "");
    if (p.tipo === "unica") return el("p", "pa-fv-tx", nome(v));
    if (p.tipo === "ranking") {
      const ol = el("ol", "pa-fv-rank");
      valores(v).forEach((id, k) => { const li = el("li"); li.append(el("span", "pos", `${k + 1}º`), el("span", null, nome(id))); ol.appendChild(li); });
      return ol;
    }
    if (p.tipo === "escalas" || p.tipo === "escala") {
      const max = p.max || 10, wrap = el("div", "pa-fv-notas");
      const linhas = typeof v === "number" ? [["Nota", v]] : (p.linhas || []).map((l) => [l.texto, v[l.id]]);
      linhas.forEach(([t, n]) => {
        const r = el("div", "pa-fv-nota");
        const barra = el("span", "barra"); const enc = el("span"); enc.style.setProperty("--w", typeof n === "number" ? Math.max(0, n) / max : 0); barra.appendChild(enc);
        r.append(el("span", "t", t), barra, el("b", null, typeof n === "number" ? String(n) : "—"));
        wrap.appendChild(r);
      });
      return wrap;
    }
    if (p.tipo === "matriz") {
      const ul = el("ul", "pa-fv-mat");
      p.linhas.forEach((l) => {
        const c = p.colunas.find((c) => c.id === v[l.id]); const li = el("li");
        const tag = el("span", "pa-tg n-" + (c ? c.id : "x"), c ? c.texto : "—");
        li.append(el("span", null, l.texto), tag); ul.appendChild(li);
      });
      return ul;
    }
    const tags = el("div", "pa-fv-tags");
    valores(v).forEach((id) => tags.appendChild(el("span", "pa-tg", nome(id) + (op(id).outro && v.outro ? `: ${v.outro}` : ""))));
    return tags;
  }
  function fichaConteudo(x) {
    const corpo = el("div", "pa-ficha-corpo");
    const bloco = (t, filhos) => { const s = el("section", "pa-fb"); s.appendChild(el("h3", null, t)); s.append(...filhos); corpo.appendChild(s); };
    const pf = perfilDe(x);
    if (pf.length) { const dl = el("dl", "pa-fb-perfil"); pf.forEach(([c, v]) => { const d = el("div"); d.append(el("dt", null, ROTULO_PF[c.id] || c.texto), el("dd", null, v)); dl.appendChild(d); }); bloco("Perfil", [dl]); }
    let num = 0; const nums = {};
    Q.perguntas.forEach((p) => { if (!p.condicao) num++; nums[p.id] = p.rotulo || String(num); });
    BLOCOS.forEach(([t, ids]) => {
      const itens = ids.map((id) => Q.perguntas.find((p) => p.id === id)).filter((p) => p && x.respostas[p.id] != null);
      if (!itens.length) return;
      bloco(t, itens.map((p) => {
        const it = el("div", "pa-fq");

        it.append(cab, valorFicha(p, x.respostas[p.id]));

      }));
    });
    if (x.relato && x.relato.trim()) { const q = el("blockquote", "pa-fb-relato", x.relato); bloco("Relato", [q]); }
    if (x.situacao === "completa") {
      const tem = I.some((y) => y.envio_id && y.envio_id === x.envio_id);
      bloco("Avisos do lançamento", [el("p", "pa-fv-tx", x.quer_novidades ? (tem ? "Quer receber. O contato está na aba Interessados." : "Quis receber. O contato já foi excluído.") : "Não quer receber.")]);
    }
    if (x.situacao !== "completa") corpo.appendChild(el("p", "pa-ficha-nota", x.situacao === "fora_de_curitiba" ? "A pesquisa terminou na pergunta 1: a pessoa não mora em Curitiba nem na Região Metropolitana." : "A pesquisa terminou na pergunta 2: a pessoa não comprou roupas, calçados ou acessórios este ano."));
    return corpo;
  }
  const ROTULO_PF = { cidade: "Cidade", bairro: "Bairro", genero: "Gênero", faixa_etaria: "Faixa etária", estado_civil: "Estado civil" };
  function abrirFicha(lista, k, origem) {

    const del = el("button", "pa-rl-del"); del.type = "button"; del.innerHTML = IC.lixo; del.title = "Excluir resposta";
    const fechar = el("button", "pa-ficha-x"); fechar.type = "button"; fechar.innerHTML = ICR.x; fechar.setAttribute("aria-label", "Fechar");
    cab.append(tit, del, fechar);
    const rolagem = el("div", "pa-ficha-rola");

    const ant = el("button", "pa-btn"); ant.type = "button"; ant.innerHTML = ICR.esq + "<span>Anterior</span>";
    const pos = el("span", "pa-ficha-pos"); pos.setAttribute("aria-live", "polite");
    const prox = el("button", "pa-btn"); prox.type = "button"; prox.innerHTML = "<span>Próxima</span>" + ICR.dir;
    nav.append(ant, pos, prox);
    dlg.append(cab, rolagem, nav);
    const mostrar = (n, dir) => {
      k = n; const x = lista[k];
      tit.replaceChildren(el("b", null, `Resposta #${numResp(x)}`), el("span", null, fmtDate(x.created_at)), el("span", "pa-resp-sit " + x.situacao, SIT_CURTA[x.situacao] || x.situacao));

      rolagem.replaceChildren(corpo); rolagem.scrollTop = 0;
      pos.textContent = `${k + 1} de ${lista.length}`;
      ant.disabled = k === 0; prox.disabled = k === lista.length - 1;
    };
    ant.addEventListener("click", () => k > 0 && mostrar(k - 1, -1));

    dlg.addEventListener("keydown", (e) => {

    fechar.addEventListener("click", () => dlg.close());
    dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });
    dlg.addEventListener("close", () => { dlg.remove(); document.documentElement.classList.remove("pa-trava"); if (origem && origem.isConnected) origem.focus({ preventScroll: true }); });
    document.body.appendChild(dlg);
    mostrar(k, 0);
    document.documentElement.classList.add("pa-trava");
    dlg.showModal(); fechar.focus();
  }

  /* ---------- Relatos ---------- */
  function listaRelatos(lista) {
    const card = el("section", "card pa-entra");
    const aviso = el("div", "pa-aviso"); aviso.innerHTML = IC.info; aviso.appendChild(el("span", null, "Relatos da pergunta aberta, exatamente como foram escritos. Aparecem sem nome, mesmo de quem deixou contato."));
    card.appendChild(aviso);
    if (!lista.length) { card.appendChild(vazio("Nenhum relato ainda", "A pergunta aberta é opcional; os relatos aparecem aqui quando alguém escrever.")); return card; }
    lista.forEach((x) => { const d = el("div", "pa-relato"); d.append(el("p", null, x.relato), el("small", null, fmtDate(x.created_at))); card.appendChild(d); });
    return card;
  }

  /* ---------- Interessados ---------- */
  function listaInteressados() {
    const card = el("section", "card pa-entra");
    const aviso = el("div", "pa-aviso"); aviso.innerHTML = IC.info;
    aviso.appendChild(el("span", null, "Pessoas que pediram para receber novidades sobre o lançamento, com autorização registrada (data, horário e versão do texto). Use estes contatos só para isso. Ficam separados das respostas da pesquisa."));
    card.appendChild(aviso);
    if (!I.length) { card.appendChild(vazio("Ninguém pediu novidades ainda", "Quem marcar “Sim, quero receber novidades” no fim da pesquisa aparece aqui.")); return card; }
    I.forEach((x) => {
      const d = el("div", "pa-int");
      const tx = el("div");
      const ctt = el("div", "c");
      const mail = el("a", null, x.email); mail.href = "mailto:" + x.email;
      const tel = x.whatsapp.replace(/^(\d{2})(\d{4,5})(\d{4})$/, "($1) $2-$3");
      const wa = el("a", null, tel); wa.href = "https://wa.me/55" + x.whatsapp; wa.target = "_blank"; wa.rel = "noopener";
      ctt.append(mail, " · ", wa);
      tx.append(el("div", "n", x.nome), ctt, el("small", null, "Autorizou em " + fmtDate(x.consentimento_em) + " · " + x.consentimento_versao));
      const del = el("button", "pa-btn perigo"); del.type = "button"; del.innerHTML = IC.lixo + "<span>Excluir</span>"; del.setAttribute("aria-label", "Excluir contato de " + x.nome);
      del.addEventListener("click", async () => {
        const ok = await confirmDialog({ title: "Excluir este contato?", message: `Os dados de ${x.nome} (nome, e-mail, WhatsApp e autorização) serão apagados de vez. Use quando a pessoa pedir a exclusão ou cancelar os avisos.`, ok: "Excluir" });
        if (!ok) return;
        const { error } = await sb.from("pesquisa_interessados").delete().eq("id", x.id);
        if (error) return toast("Não foi possível excluir: " + error.message);
        I = I.filter((y) => y.id !== x.id); log("Excluiu contato de interessado na pesquisa", P.titulo); toast("Contato excluído"); desenhar(); document.getElementById("aba-interessados").click();
      });
      d.append(tx, del); card.appendChild(d);
    });
    return card;
  }

  function vazio(t, s) { const d = el("div", "pa-vazio"); d.append(el("b", null, t), s); return d; }
  function erro(m) { $("conteudo").replaceChildren(); const e = $("load-err"); e.textContent = m; e.classList.remove("hidden"); }
})();
</script>
