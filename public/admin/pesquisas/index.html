  // Pesquisas conhecidas pelo site: endereço público de cada uma
  const PAGINAS = { "moda-curitiba": "/pesquisa/moda-curitiba/" };
  const $ = (id) => document.getElementById(id);
  const svg = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const IC = {
    copiar: svg('<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>'),
    ok: svg('<path d="M20 6 9 17l-5-5"/>'),
    abrir: svg('<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>'),
    pausa: svg('<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>'),
    play: svg('<path d="m6 3 14 9-14 9z"/>'),
    pesquisa: svg('<path d="M9 11h6M9 15h4"/><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 3v3h6V3"/>'),
    info: svg('<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>'),
    compartilhar: svg('<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.59 13.51 6.83 3.98"/><path d="m15.41 6.51-6.82 3.98"/>'),
    lixo: svg('<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>'),
  };
  const pct = (n, d) => (d ? Math.round((n / d) * 100) : 0);
  const plural = (n, um, varios) => `${n.toLocaleString("pt-BR")} ${n === 1 ? um : varios}`;
  const SITUACAO = { completa: "Completas", fora_de_curitiba: "Fora de Curitiba e Região Metropolitana", sem_compras: "Não compraram este ano" };
  const slug = new URLSearchParams(location.search).get("p");

  Admin.init({ page: "pesquisas", onReady: () => (slug ? painel(slug) : lista()) });

  /* ---------- Lista de pesquisas ---------- */
  async function lista() {
    const [{ data: ps, error }, { data: novas }] = await Promise.all([
      sb.from("pesquisas").select("slug, titulo, ativa, criada_em").order("criada_em", { ascending: false }),
      sb.from("pesquisa_respostas").select("pesquisa").is("visualizado_em", null).neq("situacao", "parcial").limit(5000),
    ]);
    if (error) return erro("Não foi possível carregar as pesquisas: " + error.message);
    const contagem = {}; (novas || []).forEach((r) => { contagem[r.pesquisa] = (contagem[r.pesquisa] || 0) + 1; });
    const c = $("conteudo"); c.replaceChildren();
    if (!ps.length) { c.appendChild(vazio("Nenhuma pesquisa ainda", "Quando houver uma pesquisa, ela aparece aqui.")); return; }
    const wrap = el("div", "pa-lista pa-entra");
    ps.forEach((p) => {
      const a = el("a", "pa-item"); a.href = "?p=" + encodeURIComponent(p.slug);
      const ic = el("span", "ic"); ic.innerHTML = IC.pesquisa;
      const tx = el("span", "tx"); tx.append(el("b", null, p.titulo), el("span", null, (p.ativa ? "No ar" : "Fora do ar") + " · criada em " + new Date(p.criada_em).toLocaleDateString("pt-BR")));
      a.append(ic, tx);
      if (contagem[p.slug]) a.appendChild(el("span", "pa-novas", plural(contagem[p.slug], "nova", "novas")));
      else a.appendChild(el("span"));
      wrap.appendChild(a);
    });
    c.appendChild(wrap);
  }

  /* ---------- Painel de uma pesquisa ---------- */
  let P = null, Q = null, R = [], I = [], RP = [];
  // R: participações concluídas (números, gráficos e exportações); RP: incompletas (quem parou no meio), só na lista de respostas
  const separar = (todas) => { R = todas.filter((x) => x.situacao !== "parcial"); RP = todas.filter((x) => x.situacao === "parcial"); };
  const todasR = () => [...R, ...RP].sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
  async function painel(s) {
    $("voltar").classList.remove("hidden");
    const [p, r, i, q] = await Promise.all([
      sb.from("pesquisas").select("slug, titulo, ativa, criada_em, atualizado_em").eq("slug", s).maybeSingle(),
      sb.from("pesquisa_respostas").select("id, envio_id, nome, email, whatsapp, created_at, situacao, respostas, relato, quer_novidades, visualizado_em, parou_em, atualizado_em").eq("pesquisa", s).order("created_at", { ascending: false }).limit(10000),
      sb.from("pesquisa_interessados").select("id, envio_id, created_at, nome, email, whatsapp, consentimento_em, consentimento_versao").eq("pesquisa", s).order("created_at", { ascending: false }).limit(10000),
      fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ acao: "status", pesquisa: s }) }).then((x) => x.json()).catch(() => null),
    ]);
    if (p.error || !p.data) return erro(p.error ? "Não foi possível carregar a pesquisa: " + p.error.message : "Pesquisa não encontrada.");
    if (r.error) return erro("Não foi possível carregar as respostas: " + r.error.message);
    if (!q || !q.questionario) return erro("Não foi possível carregar as perguntas da pesquisa. Atualize a página para tentar de novo.");
    P = p.data; Q = q.questionario; I = i.data || []; separar(r.data || []);
    document.title = P.titulo + " | Área restrita";
    $("titulo").textContent = P.titulo; document.querySelector(".pa-cabecalho").classList.add("painel");
    // quebra de linha depois de "em" (no computador); no celular o texto corre normalmente
    $("sub").innerHTML = 'Projeto do Dani Moscatelli Studio. Resultados analisados em<br class="pa-quebra"> conjunto; os nomes aparecem só na aba Dados.';
    desenhar();
  }
  // as respostas novas deixam de aparecer como notificação só quando a aba Dados é aberta
  // (abrir a pesquisa nas abas Resultado ou Inteligência não marca nada como visto)
  async function marcarVistas() {
    const novas = R.filter((x) => !x.visualizado_em);
    if (!novas.length) return;
    const agora = new Date().toISOString();
    novas.forEach((x) => { x.visualizado_em = agora; });
    const ids = novas.map((x) => x.id);
    for (let k = 0; k < ids.length; k += 200) await sb.from("pesquisa_respostas").update({ visualizado_em: agora }).in("id", ids.slice(k, k + 200));
    Admin.refreshNotifications();
  }

  function desenhar() {
    const c = $("conteudo"); c.replaceChildren();
    topo();
    c.append(abas());
  }

  async function apagarPesquisa(btn) {
    if (P.ativa) {
      toast("Não é possível apagar uma pesquisa no ar. Primeiro toque em “Tirar do ar”.");
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) { btn.classList.remove("pa-treme"); void btn.offsetWidth; btn.classList.add("pa-treme"); }
      return;
    }
    const total = R.length + RP.length;
    const ok = await confirmDialog({
      title: "Apagar a pesquisa inteira?",
      message: `A pesquisa “${P.titulo}” sai da área restrita e o link deixa de aceitar respostas. ` +
        (total ? `${plural(total, "participação", "participações")}, os relatos e ${plural(I.length, "contato de interessado", "contatos de interessados")} também serão apagados. ` : "") +
        "Não dá para desfazer. Se quiser guardar os dados, exporte o relatório e as respostas antes.",
      ok: "Apagar pesquisa", word: "APAGAR",
    });
    if (!ok) return;
    btn.disabled = true;
    const { error } = await sb.from("pesquisas").delete().eq("slug", P.slug);
    if (error) { btn.disabled = false; return toast("Não foi possível apagar: " + error.message); }
    log("Apagou a pesquisa", P.titulo);
    toast("Pesquisa apagada");
    Admin.refreshNotifications();
    setTimeout(() => { location.href = "/admin/pesquisas/"; }, 700);
  }

  // Cabeçalho do painel: situação e "Ações" na mesma linha; o link com "Copiar" logo abaixo.
  // As ações (ver, exportar, tirar do ar) ficam num menu, para o card não quebrar em várias linhas no celular.
  // Cabeçalho único do painel: situação (no ar / fora do ar) em cima, título e descrição, o link com Copiar, Abrir e
  // QR Code, e embaixo a barra de ações: última resposta à esquerda; Tirar do ar, Exportar relatório e Apagar pesquisa à direita.
  function topo() {
    const url = SITE + (PAGINAS[P.slug] || "/pesquisa/" + P.slug + "/");
    // canto superior direito: Exportar relatório e Apagar pesquisa
    const exp = menuAcoes("pa-relatorio-btn", "Exportar relatório", (item, btn) => [
      item(IC_BAIXAR, "PDF", "", { fn: exportarPdf }),
      item(IC_BAIXAR, "Excel", "", { fn: () => exportarExcel(btn) }),
    ]);
    exp.querySelector(".pa-menu-btn").insertAdjacentHTML("afterbegin", IC_RELATORIO);
    const del = el("button", "pa-btn perigo pa-del-pesq"); del.type = "button";
    del.innerHTML = IC.lixo + "<span>Apagar pesquisa</span>";
    if (P.ativa) { del.setAttribute("aria-disabled", "true"); del.title = "Para apagar, primeiro tire a pesquisa do ar."; }
    del.addEventListener("click", () => apagarPesquisa(del));
    $("cab-acoes").replaceChildren(exp, del);
    // card do link: situação e última resposta; link com copiar dentro do campo; Abrir, QR Code, Compartilhar; Tirar do ar
    const st = el("span", "pa-status" + (P.ativa ? "" : " off"));
    st.append(el("b", null, P.ativa ? "No ar" : "Fora do ar"));
    const ult = el("p", "pa-ult");
    ult.innerHTML = svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>');
    ult.append(R[0] ? "Última resposta em " + fmtDate(R[0].created_at) : "Ainda sem respostas");
    const info = el("div", "pa-cab-info"); info.append(st, ult);
    const campo = el("div", "pa-link-campo");
    const inp = el("input"); inp.type = "text"; inp.readOnly = true; inp.value = url; inp.setAttribute("aria-label", "Link da pesquisa");
    inp.addEventListener("focus", () => inp.select());
    const copiar = el("button", "pa-link-copiar"); copiar.type = "button"; copiar.innerHTML = IC.copiar;
    copiar.setAttribute("aria-label", "Copiar link da pesquisa"); copiar.title = "Copiar link";
    const copiarLink = async () => {
      try { await navigator.clipboard.writeText(url); } catch { inp.select(); document.execCommand && document.execCommand("copy"); }
    };
    copiar.addEventListener("click", async () => {
      await copiarLink();
      copiar.classList.add("ok"); copiar.innerHTML = IC.ok; copiar.setAttribute("aria-label", "Link copiado"); toast("Link copiado");
      setTimeout(() => { copiar.classList.remove("ok"); copiar.innerHTML = IC.copiar; copiar.setAttribute("aria-label", "Copiar link da pesquisa"); }, 2200);
    });
    campo.append(inp, copiar);
    const abrirL = el("a", "pa-btn"); abrirL.href = url; abrirL.target = "_blank"; abrirL.rel = "noopener";
    abrirL.innerHTML = IC.abrir + '<span class="pa-rot">Abrir</span>'; abrirL.setAttribute("aria-label", "Abrir a pesquisa numa nova aba");
    const qrBt = el("button", "pa-btn"); qrBt.type = "button";
    qrBt.innerHTML = svg('<rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/>') + '<span class="pa-rot">QR Code</span>';
    qrBt.setAttribute("aria-label", "Mostrar o QR Code da pesquisa"); qrBt.setAttribute("aria-haspopup", "dialog");
    qrBt.addEventListener("click", () => abrirQr(url, qrBt));
    // Compartilhar: abre o compartilhamento do aparelho (WhatsApp, e-mail…); onde não houver, copia o link
    const comp = el("button", "pa-btn"); comp.type = "button";
    comp.innerHTML = IC.compartilhar + '<span class="pa-rot">Compartilhar</span>'; comp.setAttribute("aria-label", "Compartilhar a pesquisa");
    comp.addEventListener("click", async () => {
      if (navigator.share) { try { await navigator.share({ title: P.titulo, url }); } catch {} return; }
      await copiarLink(); toast("Link copiado. Cole onde quiser compartilhar.");
    });
    const btns = el("div", "pa-cab-btns"); btns.append(abrirL, qrBt, comp);
    const tog = el("button", "pa-btn" + (P.ativa ? " perigo" : " liga")); tog.type = "button";
    tog.innerHTML = (P.ativa ? IC.pausa : IC.play) + "<span>" + (P.ativa ? "Tirar do ar" : "Colocar no ar") + "</span>";
    tog.addEventListener("click", () => alternar(tog));
    const sep = () => { const d = el("span", "pa-cab-sep"); d.setAttribute("aria-hidden", "true"); return d; };
    const linha = el("div", "pa-cab-linha"); linha.append(campo, sep(), btns, sep(), tog);
    $("cab-link").replaceChildren(info, linha);
  }
  // Menu "Ações": abre abaixo do botão, alinhado à direita; Esc, clique fora ou escolher uma ação fecham.
  // Setas para cima e para baixo navegam entre os itens. O próprio botão mostra o andamento (ex.: gerando planilha).
  // Menu suspenso (padrão "Ações"): abre abaixo do botão, alinhado à direita; Esc, clique fora ou escolher fecham.
  // Os itens são montados a cada abertura (montar), para refletir o estado atual (ex.: o que está marcado na lista).
  function menuAcoes(id = "pa-acoes-btn", rotulo = "Ações", montar = null, soIcone = false) {
    const caixa = el("div", "pa-menu-caixa");
    const btn = el("button", "pa-btn pa-menu-btn" + (soIcone ? " pa-menu-ic" : "")); btn.type = "button";
    btn.setAttribute("aria-haspopup", "menu"); btn.setAttribute("aria-expanded", "false"); btn.id = id;
    // só ícone (três pontinhos verticais): o nome fica para leitores de tela e na dica ao passar o mouse
    if (soIcone) { btn.setAttribute("aria-label", rotulo); btn.title = rotulo; btn.innerHTML = svg('<circle cx="12" cy="5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="19" r="1.6" fill="currentColor"/>'); }
    else btn.innerHTML = '<span>' + rotulo + '</span>' + svg('<path d="m6 9 6 6 6-6"/>');
    const menu = el("div", "pa-menu"); menu.setAttribute("role", "menu"); menu.setAttribute("aria-labelledby", btn.id); menu.hidden = true;
    const item = (ic, texto, dica, acao, cls = "") => {
      const b = el(acao.href ? "a" : "button", "pa-menu-it" + cls); b.setAttribute("role", "menuitem"); b.tabIndex = -1;
      if (acao.href) { b.href = acao.href; b.target = "_blank"; b.rel = "noopener"; } else b.type = "button";
      b.innerHTML = ic + "<span><b>" + texto + "</b>" + (dica ? "<small>" + dica + "</small>" : "") + "</span>";
      b.addEventListener("click", () => { fechar(false); if (acao.fn) acao.fn(); });
      return b;
    };
    const montarExtra = () => menu.replaceChildren(...(montar ? montar(item, btn) : []));
    const itens = () => [...menu.querySelectorAll(".pa-menu-it:not(:disabled)")];
    const fora = (e) => { if (!caixa.contains(e.target)) fechar(false); };
    function abrir() {
      montarExtra();
      menu.hidden = false; btn.setAttribute("aria-expanded", "true"); caixa.classList.add("aberto");
      requestAnimationFrame(() => itens()[0]?.focus());
      document.addEventListener("pointerdown", fora);
    }
    function fechar(voltarFoco = true) {
      if (menu.hidden) return;
      menu.hidden = true; btn.setAttribute("aria-expanded", "false"); caixa.classList.remove("aberto");
      document.removeEventListener("pointerdown", fora);
      if (voltarFoco) btn.focus();
    }
    btn.addEventListener("click", () => (menu.hidden ? abrir() : fechar()));
    btn.addEventListener("keydown", (e) => { if (e.key === "ArrowDown") { e.preventDefault(); abrir(); } });
    menu.addEventListener("keydown", (e) => {
      const l = itens(), k = l.indexOf(document.activeElement);
      if (e.key === "Escape") { e.preventDefault(); fechar(); }
      else if (e.key === "ArrowDown") { e.preventDefault(); l[(k + 1) % l.length].focus(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); l[(k - 1 + l.length) % l.length].focus(); }
      else if (e.key === "Home") { e.preventDefault(); l[0].focus(); }
      else if (e.key === "End") { e.preventDefault(); l[l.length - 1].focus(); }
      else if (e.key === "Tab") fechar(false);
    });
    caixa.append(btn, menu);
    return caixa;
  }


  async function alternar(btn) {
    const ligar = !P.ativa;
    const ok = await confirmDialog(ligar
      ? { title: "Colocar a pesquisa no ar?", message: "O link volta a aceitar respostas na hora.", ok: "Colocar no ar", danger: false }
      : { title: "Tirar a pesquisa do ar?", message: "Quem abrir o link verá que a pesquisa não está recebendo respostas. As respostas já recebidas continuam aqui, e você pode colocar no ar de novo quando quiser.", ok: "Tirar do ar" });
    if (!ok) return;
    btn.disabled = true;
    const { error } = await sb.from("pesquisas").update({ ativa: ligar, atualizado_em: new Date().toISOString() }).eq("slug", P.slug);
    btn.disabled = false;
    if (error) return toast("Não foi possível alterar: " + error.message);
    P.ativa = ligar;
    log(ligar ? "Colocou a pesquisa no ar" : "Tirou a pesquisa do ar", P.titulo);
    toast(ligar ? "Pesquisa no ar" : "Pesquisa fora do ar");
    desenhar();
  }



  let SELECAO = null; // seleção da aba aberta (Respostas ou Interessados), usada pelo item "Excluir" do menu Ações
  let ABA_INICIAL = null; // depois de excluir, o painel é redesenhado e volta para a mesma aba
  // Abas de cima: Resultado · Inteligência · Dados, com "Exportar relatório" (visão analítica) no canto direito.
  // Dentro de Respostas, abas internas Respostas · Relatos · Interessados, com o menu "Ações" (exportar respostas e excluir).
  const SUBABAS = ["respostas", "relatos", "interessados"];
  function linhaDeAbas(defs, rotuloAria, abrir, prefixo) {
    const bar = el("div", "pa-abas"); bar.setAttribute("role", "tablist"); bar.setAttribute("aria-label", rotuloAria);
    const botoes = defs.map(([id, t, n]) => {
      const b = el("button"); b.type = "button"; b.setAttribute("role", "tab"); b.id = prefixo + id; b.append(t);
      if (n != null) b.appendChild(el("span", "n", String(n)));
      b.addEventListener("click", () => abrir(id));
      bar.appendChild(b); return b;
    });
    // abas sublinhadas (seções da pesquisa): a linha vermelha desliza até a aba escolhida
    const ind = el("span", "pa-abas-ind"); ind.setAttribute("aria-hidden", "true"); bar.appendChild(ind);
    const moverInd = () => { const b = botoes.find((x) => x.getAttribute("aria-selected") === "true"); if (!b || !b.offsetWidth) return; ind.style.width = b.offsetWidth + "px"; ind.style.transform = "translateX(" + b.offsetLeft + "px)"; };
    new ResizeObserver(moverInd).observe(bar);
    return { bar, marcar: (id) => { botoes.forEach((b) => b.setAttribute("aria-selected", String(b.id === prefixo + id))); requestAnimationFrame(moverInd); } };
  }
  function abas() {
    const box = el("div");
    const corpo = el("div"); corpo.setAttribute("role", "tabpanel");
    const { bar, marcar } = linhaDeAbas([["resultados", "Resultado", null], ["inteligencia", "Inteligência", null], ["respostas", "Dados", null]], "Seções da pesquisa", (id) => abrir(id), "aba-");
    bar.classList.add("pa-abas-sub"); // abas principais: modelo sublinhado do DS (as internas de Respostas são segmentadas)
    const abrir = (id, sub) => {
      SELECAO = null; marcar(id);
      corpo.setAttribute("aria-labelledby", "aba-" + id);
      corpo.replaceChildren(id === "resultados" ? resultados() : id === "inteligencia" ? inteligencia() : areaRespostas(sub || "respostas"));
      if (id === "respostas") marcarVistas();
      requestAnimationFrame(() => requestAnimationFrame(animarGraficos));
    };
    const linha = el("div", "pa-abas-linha pa-abas-linha-sec"); linha.append(bar);
    box.append(linha, corpo);
    const ini = ABA_INICIAL; ABA_INICIAL = null;
    if (SUBABAS.includes(ini)) abrir("respostas", ini); else abrir(ini || "resultados");
    return box;
  }
  function areaRespostas(sub) {
    const box = el("div", "pa-area-resp");
    const corpo = el("div"); corpo.setAttribute("role", "tabpanel");
    const relatos = relatosR();
    // sem números nas abas (números grandes quebrariam a linha); a quantidade aparece no card de cada aba
    const { bar, marcar } = linhaDeAbas([["respostas", "Respostas", null], ["relatos", "Relatos", null], ["interessados", "Interessados", null]], "Respostas, relatos e interessados", (id) => abrirSub(id), "aba-sub-");
    bar.classList.add("pa-abas-int");
    const abrirSub = (id) => {
      SELECAO = null; marcar(id);
      corpo.setAttribute("aria-labelledby", "aba-sub-" + id);
      corpo.replaceChildren(id === "respostas" ? listaRespostas() : id === "relatos" ? listaRelatos(relatos) : listaInteressados());
      requestAnimationFrame(() => requestAnimationFrame(animarGraficos));
    };
    const acoes = el("div", "pa-abas-acoes");
    acoes.appendChild(menuAcoes("pa-acoes-btn", "Ações", (item, btn) => {
      const l = [item(IC_BAIXAR, "Exportar respostas", "", { fn: () => exportarRespostas(btn) })];
      if (SELECAO) {
        const ex = item(IC.lixo, "Excluir", "", { fn: SELECAO.fn }, " perigo");
        if (!SELECAO.n()) { ex.disabled = true; ex.setAttribute("aria-disabled", "true"); }
        l.push(el("div", "pa-menu-sep"), ex);
      }
      const tudo = item(IC.lixo, "Apagar tudo", "", { fn: apagarTudo }, " perigo");
      if (!R.length && !RP.length && !I.length) { tudo.disabled = true; tudo.setAttribute("aria-disabled", "true"); }
      if (!SELECAO) l.push(el("div", "pa-menu-sep"));
      l.push(tudo);

  }
  function resumoDe(x) {
    if (x.situacao === "parcial") return `Parou ${ondeParou(x)} · última atividade em ${fmtDate(x.atualizado_em || x.created_at)}`;
    const q2 = Q.perguntas.find((p) => p.id === "q2");
    const prim = q2 && valores(x.respostas.q2)[0];
    const pf = perfilDe(x).map(([, v]) => v).filter((t) => t !== "Prefiro não informar").join(" · ");
    return [pf, prim && x.situacao === "completa" ? "Mais comprou: " + textoResposta({ ...q2, tipo: "unica" }, prim) : ""].filter(Boolean).join(" · ");
  }
  async function excluirUma(x, bt) {
    const ok = await confirmDialog({ title: `Excluir a resposta de ${nomeDe(x)}?`, message: `A participação #${numResp(x)}, de ${fmtDate(x.created_at)}, será apagada de vez e sai dos gráficos. Essa ação não pode ser desfeita.`, ok: "Excluir" });
    if (!ok) return false;
    if (bt) bt.disabled = true;
    return excluirRespostas([x.id], false);
  }
  function listaRespostas() {
    const card = el("section", "card pa-entra");
    if (!R.length && !RP.length) { card.appendChild(vazio("Nenhuma resposta", "As participações aparecem aqui assim que alguém começa a responder a pesquisa.")); return card; }
    const filtros = el("div", "pa-filtros"); filtros.setAttribute("role", "group"); filtros.setAttribute("aria-label", "Filtrar por situação");
    const lista = el("ul", "pa-rl");
    const cont = el("p", "pa-rl-cont"); cont.setAttribute("aria-live", "polite");
    // seleção para excluir uma ou mais respostas de uma vez
    const sel = new Set();
    const barra = el("div", "pa-sel");
    const todasLab = el("label", "pa-sel-todas");
    const todasCb = el("input"); todasCb.type = "checkbox";
    todasLab.append(todasCb, el("span", null, "Selecionar todas"));
    const nSel = el("span", "pa-sel-n"); nSel.setAttribute("aria-live", "polite");
    const dicaSel = el("span", "pa-sel-dica", "Para excluir, use o menu Ações");
    barra.append(todasLab, nSel, dicaSel);
    const visiveis = () => todasR().filter((x) => FILTRO === "todas" || x.situacao === FILTRO);
    const sincSel = () => {
      const vs = visiveis(), marcadas = vs.filter((x) => sel.has(x.id)).length;
      todasCb.checked = marcadas > 0 && marcadas === vs.length; todasCb.indeterminate = marcadas > 0 && marcadas < vs.length;
      nSel.textContent = marcadas ? `${plural(marcadas, "selecionada", "selecionadas")}` : "";
      avisarSelecao(barra, marcadas);
      lista.querySelectorAll(".pa-rl-it").forEach((li) => li.classList.toggle("marcada", sel.has(li.dataset.id)));
    };
    todasCb.addEventListener("change", () => { visiveis().forEach((x) => (todasCb.checked ? sel.add(x.id) : sel.delete(x.id))); lista.querySelectorAll(".pa-rl-cb input").forEach((c) => { c.checked = sel.has(c.value); }); sincSel(); });
    const excluirSelecionadas = async () => {
      const alvo = todasR().filter((x) => sel.has(x.id));
      if (!alvo.length) return;
      if (alvo.length === 1) return excluirUma(alvo[0], null);
      const ok = await confirmDialog({ title: `Excluir ${plural(alvo.length, "resposta", "respostas")}?`, message: `${alvo.length === R.length + RP.length ? "Todas as participações" : `As ${plural(alvo.length, "participação selecionada", "participações selecionadas")}`} serão apagadas de vez e saem dos gráficos. Essa ação não pode ser desfeita.`, ok: "Excluir" });
      if (!ok) return;
      await excluirRespostas(alvo.map((x) => x.id), false);
    };
    SELECAO = { n: () => visiveis().filter((x) => sel.has(x.id)).length, fn: excluirSelecionadas };
    const pintar = () => {
      filtros.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.f === FILTRO)));
      lista.classList.toggle("pa-rl-sem-sit", FILTRO !== "todas");
      const vs = visiveis();
      cont.textContent = `${plural(vs.length, "participação", "participações")}, da mais recente para a mais antiga.`;
      lista.replaceChildren(...vs.map((x, k) => {
        const li = el("li", "pa-rl-it"); li.style.setProperty("--i", Math.min(k, 12)); li.dataset.id = x.id;
        const cbl = el("label", "pa-rl-cb");
        const cb = el("input"); cb.type = "checkbox"; cb.value = x.id; cb.checked = sel.has(x.id);
        cb.setAttribute("aria-label", `Selecionar a resposta de ${nomeDe(x)}, #${numResp(x)}`);
        cb.addEventListener("change", () => { cb.checked ? sel.add(x.id) : sel.delete(x.id); sincSel(); });
        cbl.appendChild(cb);
        const ab = el("button", "pa-rl-abrir"); ab.type = "button"; ab.setAttribute("aria-haspopup", "dialog");
        const linha1 = el("span", "pa-rl-l1");
        linha1.append(el("b", "pa-rl-nome" + (x.nome ? "" : " sem"), nomeDe(x)), el("span", "pa-rl-data", `#${numResp(x)} · ${fmtDate(x.created_at)}`));
        // a etiqueta da situação só aparece em "Todas" (respostas misturadas); num filtro, todas são iguais
        ab.appendChild(linha1); if (FILTRO === "todas") ab.appendChild(el("span", "pa-resp-sit " + x.situacao, SIT_CURTA[x.situacao] || x.situacao));
        const res = resumoDe(x); if (res) ab.appendChild(el("span", "pa-rl-res", res));
        ab.setAttribute("aria-label", `Abrir a resposta de ${nomeDe(x)}, #${numResp(x)}, ${fmtDate(x.created_at)}, ${SIT_CURTA[x.situacao] || x.situacao}`);
        ab.addEventListener("click", () => abrirFicha(vs, k, ab));
        const del = el("button", "pa-rl-del"); del.type = "button"; del.innerHTML = IC.lixo; del.setAttribute("aria-label", `Excluir a resposta de ${nomeDe(x)}`); del.title = "Excluir resposta";
        del.addEventListener("click", () => excluirUma(x, del));
        li.append(cbl, ab, del);
        return li;
      }));
      if (!vs.length) lista.appendChild(el("li", "pa-rl-vazio", "Nenhuma participação com essa situação."));
      barra.hidden = !vs.length;
      sincSel();
    };
    FILTROS.forEach(([id, t]) => {
      const n = id === "todas" ? R.length + RP.length : todasR().filter((x) => x.situacao === id).length;
      const b = el("button", "pa-filtro"); b.type = "button"; b.dataset.f = id;
      b.append(t, el("span", "n", String(n)));
      b.addEventListener("click", () => { FILTRO = id; sel.clear(); pintar(); });
      filtros.appendChild(b);
    });
    pintar();
    card.append(filtros, cont, barra, lista);
    return card;
  }

  // valor de cada pergunta na ficha: texto, lista em ordem (1º, 2º, 3º), etiquetas ou barras de nota
  function valorFicha(p, v) {
    const op = (id) => ((p.opcoes || []).find((o) => o.id === id) || {});
    const nome = (id) => (op(id).texto || id).replace(/ \(especifique\)$/, "");
    if (p.tipo === "unica") return el("p", "pa-fv-tx", nome(v));
    if (p.tipo === "ranking") {
      const ol = el("ol", "pa-fv-rank");
      valores(v).forEach((id, k) => { const li = el("li"); li.append(el("span", "pos", `${k + 1}º`), el("span", null, nome(id))); ol.appendChild(li); });
      return ol;
    }
    if (p.tipo === "escalas" || p.tipo === "escala") {
      const max = p.max || 10, wrap = el("div", "pa-fv-notas");
      const linhas = typeof v === "number" ? [["Nota", v]] : (p.linhas || []).map((l) => [l.texto, v[l.id]]);
      linhas.forEach(([t, n]) => {
        const r = el("div", "pa-fv-nota");
        const barra = el("span", "barra"); const enc = el("span"); enc.style.setProperty("--w", typeof n === "number" ? Math.max(0, n) / max : 0); barra.appendChild(enc);
        r.append(el("span", "t", t), barra, el("b", null, typeof n === "number" ? String(n) : "—"));
        wrap.appendChild(r);
      });
      return wrap;
    }
    if (p.tipo === "matriz") {
      const ul = el("ul", "pa-fv-mat");
      p.linhas.forEach((l) => {
        const c = p.colunas.find((c) => c.id === v[l.id]); const li = el("li");
        const tag = el("span", "pa-tg n-" + (c ? c.id : "x"), c ? c.texto : "—");
        li.append(el("span", null, l.texto), tag); ul.appendChild(li);
      });
      return ul;
    }
    // múltipla escolha: lista simples com check, no mesmo padrão da lista em ordem (1º, 2º, 3º)
    const ul = el("ul", "pa-fv-lista");
    valores(v).forEach((id) => { const li = el("li"); const ic = el("span", "ic"); ic.innerHTML = IC.ok; li.append(ic, el("span", null, nome(id) + (op(id).outro && v.outro ? `: ${v.outro}` : ""))); ul.appendChild(li); });
    return ul;
  }
  function fichaConteudo(x) {
    const corpo = el("div", "pa-ficha-corpo");
    const bloco = (t, filhos) => { const s = el("section", "pa-fb"); s.appendChild(el("h3", null, t)); s.append(...filhos); corpo.appendChild(s); };
    // contato informado na identificação (WhatsApp abre a conversa; e-mail abre o aplicativo de e-mail)
    const fone = (w) => { const d = String(w || "").replace(/\D/g, ""); return d.length === 11 ? `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}` : d.length === 10 ? `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}` : d; };
    const ct = el("dl", "pa-fb-perfil pa-fb-contato");
    const linha = (rot, conteudo) => { const d = el("div"); const dd = el("dd"); dd.append(conteudo); d.append(el("dt", null, rot), dd); ct.appendChild(d); };
    if (x.whatsapp) { const a = el("a", null, fone(x.whatsapp)); a.href = "https://wa.me/55" + String(x.whatsapp).replace(/\D/g, ""); a.target = "_blank"; a.rel = "noopener"; a.setAttribute("aria-label", "Conversar no WhatsApp: " + fone(x.whatsapp)); linha("WhatsApp", a); } else linha("WhatsApp", el("span", "sem", "Não informado"));
    if (x.email) { const a = el("a", null, x.email); a.href = "mailto:" + x.email; linha("E-mail", a); } else linha("E-mail", el("span", "sem", "Não informado"));
    bloco("Contato", [ct]);
    const pf = perfilDe(x);
    if (pf.length) { const dl = el("dl", "pa-fb-perfil"); pf.forEach(([c, v]) => { const d = el("div"); d.append(el("dt", null, ROTULO_PF[c.id] || c.texto), el("dd", null, v)); dl.appendChild(d); }); bloco("Perfil", [dl]); }
    let num = 0; const nums = {};
    Q.perguntas.forEach((p) => { if (!p.condicao) num++; nums[p.id] = p.rotulo || String(num); });
    BLOCOS.forEach(([t, ids]) => {
      const itens = ids.map((id) => Q.perguntas.find((p) => p.id === id)).filter((p) => p && x.respostas[p.id] != null);
      if (!itens.length) return;
      bloco(t, itens.map((p) => {
        const it = el("div", "pa-fq");
        const cab = el("p", "pa-fq-t"); cab.title = p.texto;
        cab.append(el("span", "num", nums[p.id]), ROTULO[p.id] || p.texto);
        it.append(cab, valorFicha(p, x.respostas[p.id]));
        return it;
      }));
    });
    if (x.relato && x.relato.trim()) { const q = el("blockquote", "pa-fb-relato", x.relato); bloco("Relato", [q]); }
    if (x.situacao === "completa") {
      bloco("Avisos do lançamento", [el("p", "pa-fv-tx", x.quer_novidades ? "Sim, quer receber os avisos do lançamento." : "Não quer receber.")]);
    }
    if (x.situacao === "parcial") corpo.prepend(el("p", "pa-ficha-nota pa-ficha-parcial", `Não terminou a pesquisa: parou ${ondeParou(x)}. Última atividade em ${fmtDate(x.atualizado_em || x.created_at)}. Abaixo, o que respondeu até ali.`));
    else if (x.situacao !== "completa") corpo.appendChild(el("p", "pa-ficha-nota", x.situacao === "fora_de_curitiba" ? "A pesquisa terminou na pergunta 1: a pessoa não mora em Curitiba nem na Região Metropolitana." : "A pesquisa terminou na pergunta 2: a pessoa não comprou roupas, calçados ou acessórios este ano."));
    return corpo;
  }
  const ROTULO_PF = { cidade: "Cidade", bairro: "Bairro", genero: "Gênero", faixa_etaria: "Faixa etária", estado_civil: "Estado civil" };
  function abrirFicha(lista, k, origem) {
    const dlg = el("dialog", "pa-ficha"); dlg.setAttribute("aria-labelledby", "pa-ficha-tit");
    const cab = el("header", "pa-ficha-cab");
    const tit = el("div", "pa-ficha-tit"); tit.id = "pa-ficha-tit";
    const del = el("button", "pa-rl-del"); del.type = "button"; del.innerHTML = IC.lixo; del.title = "Excluir resposta";
    const fechar = el("button", "pa-ficha-x"); fechar.type = "button"; fechar.innerHTML = ICR.x; fechar.setAttribute("aria-label", "Fechar");
    cab.append(tit, del, fechar);
    const rolagem = el("div", "pa-ficha-rola");
    const nav = el("footer", "pa-ficha-nav");
    const ant = el("button", "pa-btn"); ant.type = "button"; ant.innerHTML = ICR.esq + "<span>Anterior</span>";
    const pos = el("span", "pa-ficha-pos"); pos.setAttribute("aria-live", "polite");
    const prox = el("button", "pa-btn"); prox.type = "button"; prox.innerHTML = "<span>Próxima</span>" + ICR.dir;
    nav.append(ant, pos, prox);
    dlg.append(cab, rolagem, nav);
    const mostrar = (n, dir) => {
      k = n; const x = lista[k];
      tit.replaceChildren(el("b", x.nome ? null : "sem", nomeDe(x)), el("span", null, `#${numResp(x)} · ${fmtDate(x.created_at)}`), ...(FILTRO === "todas" ? [el("span", "pa-resp-sit " + x.situacao, SIT_CURTA[x.situacao] || x.situacao)] : []));
      del.setAttribute("aria-label", `Excluir a resposta de ${nomeDe(x)}`);
      const corpo = fichaConteudo(x);
      if (dir && !matchMedia("(prefers-reduced-motion: reduce)").matches) corpo.classList.add(dir > 0 ? "vem-dir" : "vem-esq");
      rolagem.replaceChildren(corpo); rolagem.scrollTop = 0;
      pos.textContent = `${k + 1} de ${lista.length}`;
      ant.disabled = k === 0; prox.disabled = k === lista.length - 1;
    };
    ant.addEventListener("click", () => k > 0 && mostrar(k - 1, -1));
    prox.addEventListener("click", () => k < lista.length - 1 && mostrar(k + 1, 1));
    dlg.addEventListener("keydown", (e) => {
      if (e.target.closest && e.target.closest("input, textarea")) return;
      if (e.key === "ArrowLeft" && k > 0) { e.preventDefault(); mostrar(k - 1, -1); }
      if (e.key === "ArrowRight" && k < lista.length - 1) { e.preventDefault(); mostrar(k + 1, 1); }
    });
    del.addEventListener("click", async () => { const x = lista[k]; dlg.close(); await excluirUma(x, null); });
    fechar.addEventListener("click", () => dlg.close());
    dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });
    dlg.addEventListener("close", () => { dlg.remove(); document.documentElement.classList.remove("pa-trava"); if (origem && origem.isConnected) origem.focus({ preventScroll: true }); });
    document.body.appendChild(dlg);
    mostrar(k, 0);
    document.documentElement.classList.add("pa-trava");
    dlg.showModal(); fechar.focus();
  }

  /* ---------- QR Code do link da pesquisa (janela) ----------
     O código é gerado no próprio navegador (biblioteca qrcode-generator, carregada só quando a janela abre). */
  let qrLib = null;
  const carregarQr = () => qrLib || (qrLib = new Promise((ok, falhou) => {
    if (window.qrcode) return ok(window.qrcode);
    const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";
    sc.onload = () => (window.qrcode ? ok(window.qrcode) : falhou(new Error("qr"))); sc.onerror = () => { qrLib = null; falhou(new Error("qr")); };
    document.head.appendChild(sc);
  }));
  function abrirQr(url, origem) {
    const dlg = el("dialog", "pa-qr"); dlg.setAttribute("aria-labelledby", "pa-qr-tit");
    const cab = el("header", "pa-qr-cab");
    const tit = el("h2", null, "QR Code da pesquisa"); tit.id = "pa-qr-tit";
    const fechar = el("button", "pa-ficha-x"); fechar.type = "button"; fechar.innerHTML = ICR.x; fechar.setAttribute("aria-label", "Fechar");
    cab.append(tit, fechar);
    const quadro = el("div", "pa-qr-quadro carregando"); quadro.setAttribute("role", "img"); quadro.setAttribute("aria-label", "QR Code que abre a pesquisa");
    quadro.appendChild(el("span", "pa-qr-msg", "Gerando o QR Code…"));
    const dica = el("p", "pa-qr-dica", "Aponte a câmera do celular para o código para abrir a pesquisa.");
    const end = el("p", "pa-qr-url", url.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, ""));
    dlg.append(cab, quadro, dica, end);
    fechar.addEventListener("click", () => dlg.close());
    dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });
    dlg.addEventListener("close", () => { dlg.remove(); if (origem && origem.isConnected) origem.focus({ preventScroll: true }); });
    document.body.appendChild(dlg);
    dlg.showModal(); fechar.focus();
    carregarQr().then((qrcode) => {
      const qr = qrcode(0, "M"); qr.addData(url); qr.make();
      quadro.innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
      quadro.classList.remove("carregando");
    }).catch(() => {
      quadro.classList.remove("carregando"); quadro.classList.add("erro");
      quadro.replaceChildren(el("span", "pa-qr-msg", "Não foi possível gerar o QR Code. Confira sua conexão e tente de novo."));
    });
  }

  /* ---------- Relatos ---------- */
  function listaRelatos(lista) {
    const card = el("section", "card pa-entra");
    if (!lista.length) { card.appendChild(vazio("Nenhum relato ainda", "A pergunta aberta é opcional; os relatos aparecem aqui quando alguém escrever.")); return card; }
    card.appendChild(el("p", "pa-rl-cont", `${plural(lista.length, "relato", "relatos")}, do mais recente para o mais antigo.`));
    lista.forEach((x) => { const d = el("div", "pa-relato"); d.append(el("p", null, x.relato), el("small", null, fmtDate(x.created_at))); card.appendChild(d); });
    return card;
  }

  /* ---------- Interessados ---------- */
  // barra de seleção: destaque quando há itens marcados; na primeira marcação, o botão "Ações" pulsa para indicar onde excluir
  function avisarSelecao(barra, n) {
    const antes = barra.classList.contains("ativa");
    barra.classList.toggle("ativa", n > 0);
    const bt = document.getElementById("pa-acoes-btn");
    if (bt && n > 0 && !antes && !matchMedia("(prefers-reduced-motion: reduce)").matches) { bt.classList.remove("pa-pulsa"); void bt.offsetWidth; bt.classList.add("pa-pulsa"); }
  }
  // Aba Interessados: mesma estrutura da aba Respostas (seleção, lista em linhas, etiqueta em coluna fixa, lixeira)
  // quem quer os avisos e tem o contato guardado (base da aba Interessados)
  const interessadosR = () => completasR().filter((x) => x.quer_novidades && (!x.envio_id || I.some((y) => y.envio_id === x.envio_id)));
  // Aba Interessados: quantas pessoas querem os avisos do lançamento e o perfil delas, sem nomes.
  // (Quem quer os avisos aparece na ficha de cada resposta; os contatos saem em "Exportar respostas".)
  function listaInteressados() {
    const box = el("div", "pa-entra");
    const comp = completasR();
    const quer = interessadosR();
    if (!I.length && !quer.length) { const c = el("section", "card"); c.appendChild(vazio("Ninguém pediu os avisos ainda", "Quem marcar “Sim, quero receber os avisos” no fim da pesquisa aparece aqui.")); box.appendChild(c); return box; }
    const kp = el("div", "pa-kpis pa-int-kpis");
    const k = (n, t, sub) => { const d = el("div", "pa-kpi"); d.append(el("b", null, n), el("span", null, t)); if (sub) d.append(el("small", null, sub)); return d; };
    kp.append(
      k(quer.length.toLocaleString("pt-BR"), quer.length === 1 ? "pessoa quer os avisos" : "pessoas querem os avisos", "do lançamento e das vantagens"),
      k(pct(quer.length, comp.length) + "%", "das respostas completas", `${quer.length} de ${comp.length}`),
    );
    box.appendChild(kp);
    const g = el("div", "pa-graficos");
    cardsDePerfil(quer).forEach((c) => g.appendChild(c));
    if (g.children.length) box.appendChild(g);
    else box.appendChild(el("p", "pa-nota", "Ainda não há perfil para mostrar."));
    // contatos guardados cuja resposta já não existe (ex.: respostas apagadas antes de o contato ser apagado junto)
    const soltos = I.filter((y) => !R.some((x) => x.envio_id === y.envio_id)).length;
    if (soltos) box.appendChild(el("p", "pa-nota", `${plural(soltos, "contato guardado não tem", "contatos guardados não têm")} resposta na pesquisa e não ${soltos === 1 ? "entra" : "entram"} nos gráficos. ${soltos === 1 ? "Ele sai" : "Eles saem"} em "Exportar respostas".`));
    return box;
  }

  function vazio(t, s) { const d = el("div", "pa-vazio"); d.append(el("b", null, t), s); return d; }
  function erro(m) { $("conteudo").replaceChildren(); const e = $("load-err"); e.textContent = m; e.classList.remove("hidden"); }
})();
</script>
</body>
