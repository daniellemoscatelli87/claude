<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/admin/admin.js?v=20261123b"></script>
<script>
(() => {
  const { sb, el, icon, fmtDate, fmtDay, log, confirmDialog, toast } = Admin;
  const SITE = "https://www.danimoscatelli.com.br";
  const API = "https://lipfvnerohkaajegqvwr.supabase.co/functions/v1/pesquisa";
  // Pesquisas conhecidas pelo site: endereço público de cada uma
  const PAGINAS = { "moda-curitiba": "/pesquisa/moda-curitiba/" };
  const $ = (id) => document.getElementById(id);
  const svg = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const IC = {
    copiar: svg('<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>'),
    ok: svg('<path d="M20 6 9 17l-5-5"/>'),
    abrir: svg('<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>'),
    pausa: svg('<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>'),
    play: svg('<path d="m6 3 14 9-14 9z"/>'),
    pesquisa: svg('<path d="M9 11h6M9 15h4"/><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 3v3h6V3"/>'),
    info: svg('<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>'),
    lixo: svg('<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>'),
  };
  const pct = (n, d) => (d ? Math.round((n / d) * 100) : 0);
  const plural = (n, um, varios) => `${n.toLocaleString("pt-BR")} ${n === 1 ? um : varios}`;
  const SITUACAO = { completa: "Completas", fora_de_curitiba: "Não moram em Curitiba", sem_compras: "Não compraram este ano" };
  const slug = new URLSearchParams(location.search).get("p");

  Admin.init({ page: "pesquisas", onReady: () => (slug ? painel(slug) : lista()) });

  /* ---------- Lista de pesquisas ---------- */
  async function lista() {
    const [{ data: ps, error }, { data: novas }] = await Promise.all([
      sb.from("pesquisas").select("slug, titulo, ativa, criada_em").order("criada_em", { ascending: false }),
      sb.from("pesquisa_respostas").select("pesquisa").is("visualizado_em", null).limit(5000),
    ]);
    if (error) return erro("Não foi possível carregar as pesquisas: " + error.message);
    const contagem = {}; (novas || []).forEach((r) => { contagem[r.pesquisa] = (contagem[r.pesquisa] || 0) + 1; });
    const c = $("conteudo"); c.replaceChildren();
    if (!ps.length) { c.appendChild(vazio("Nenhuma pesquisa ainda", "Quando houver uma pesquisa, ela aparece aqui.")); return; }
    const wrap = el("div", "pa-lista pa-entra");
    ps.forEach((p) => {
      const a = el("a", "pa-item"); a.href = "?p=" + encodeURIComponent(p.slug);
      const ic = el("span", "ic"); ic.innerHTML = IC.pesquisa;
      const tx = el("span", "tx"); tx.append(el("b", null, p.titulo), el("span", null, (p.ativa ? "No ar" : "Fora do ar") + " · criada em " + new Date(p.criada_em).toLocaleDateString("pt-BR")));
      a.append(ic, tx);
      if (contagem[p.slug]) a.appendChild(el("span", "pa-novas", plural(contagem[p.slug], "nova", "novas")));
      else a.appendChild(el("span"));
      wrap.appendChild(a);
    });
    c.appendChild(wrap);
  }

  /* ---------- Painel de uma pesquisa ---------- */
  let P = null, Q = null, R = [], I = [];
  async function painel(s) {
    $("voltar").classList.remove("hidden");
    const [p, r, i, q] = await Promise.all([
      sb.from("pesquisas").select("slug, titulo, ativa, criada_em, atualizado_em").eq("slug", s).maybeSingle(),
      sb.from("pesquisa_respostas").select("id, created_at, situacao, respostas, relato, quer_novidades, visualizado_em").eq("pesquisa", s).order("created_at", { ascending: false }).limit(10000),
      sb.from("pesquisa_interessados").select("id, created_at, nome, email, whatsapp, consentimento_em, consentimento_versao").eq("pesquisa", s).order("created_at", { ascending: false }).limit(10000),
      fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ acao: "status", pesquisa: s }) }).then((x) => x.json()).catch(() => null),
    ]);
    if (p.error || !p.data) return erro(p.error ? "Não foi possível carregar a pesquisa: " + p.error.message : "Pesquisa não encontrada.");
    if (r.error) return erro("Não foi possível carregar as respostas: " + r.error.message);
    if (!q || !q.questionario) return erro("Não foi possível carregar as perguntas da pesquisa. Atualize a página para tentar de novo.");
    P = p.data; Q = q.questionario; R = r.data || []; I = i.data || [];
    document.title = P.titulo + " | Área restrita";
    $("titulo").textContent = P.titulo;
    $("sub").textContent = "Projeto do Dani Moscatelli Studio. Respostas analisadas em conjunto, sem identificar quem respondeu.";
    desenhar();
    // ao abrir, as respostas novas deixam de aparecer como notificação
    const novas = R.filter((x) => !x.visualizado_em).map((x) => x.id);
    if (novas.length) {
      for (let k = 0; k < novas.length; k += 200) await sb.from("pesquisa_respostas").update({ visualizado_em: new Date().toISOString() }).in("id", novas.slice(k, k + 200));
      Admin.refreshNotifications();
    }
  }

  function desenhar() {
    const c = $("conteudo"); c.replaceChildren();
    c.append(topo(), kpis(), abas());
  }

  function topo() {
    const card = el("section", "card pa-topo pa-entra");
    const cab = el("div", "pa-cab");
    const esq = el("div");
    const st = el("span", "pa-status" + (P.ativa ? "" : " off"), P.ativa ? "No ar, recebendo respostas" : "Fora do ar");
    esq.append(st);
    const ult = R[0] ? "Última resposta: " + fmtDate(R[0].created_at) : "Ainda sem respostas";
    const m = el("p", "muted", ult); m.style.marginTop = "8px"; esq.appendChild(m);
    cab.appendChild(esq);
    const url = SITE + (PAGINAS[P.slug] || "/pesquisa/" + P.slug + "/");
    const link = el("div", "pa-link");
    const inp = el("input"); inp.type = "text"; inp.readOnly = true; inp.value = url; inp.setAttribute("aria-label", "Link da pesquisa");
    inp.addEventListener("focus", () => inp.select());
    const copiar = el("button", "pa-btn"); copiar.type = "button"; copiar.innerHTML = IC.copiar + "<span>Copiar link</span>";
    copiar.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(url); } catch { inp.select(); document.execCommand && document.execCommand("copy"); }
      copiar.classList.add("ok"); copiar.innerHTML = IC.ok + "<span>Link copiado</span>";
      setTimeout(() => { copiar.classList.remove("ok"); copiar.innerHTML = IC.copiar + "<span>Copiar link</span>"; }, 2200);
    });
    link.append(inp, copiar);
    const acoes = el("div", "pa-acoes");
    const ver = el("a", "pa-btn"); ver.href = url; ver.target = "_blank"; ver.rel = "noopener"; ver.innerHTML = IC.abrir + "<span>Ver a pesquisa</span>";
    const tog = el("button", "pa-btn " + (P.ativa ? "perigo" : "liga")); tog.type = "button";
    tog.innerHTML = P.ativa ? IC.pausa + "<span>Tirar do ar</span>" : IC.play + "<span>Colocar no ar</span>";
    tog.addEventListener("click", () => alternar(tog));
    acoes.append(ver, tog);
    card.append(cab, link, acoes);
    return card;
  }

  async function alternar(btn) {
    const ligar = !P.ativa;
    const ok = await confirmDialog(ligar
      ? { title: "Colocar a pesquisa no ar?", message: "O link volta a aceitar respostas na hora.", ok: "Colocar no ar", danger: false }
      : { title: "Tirar a pesquisa do ar?", message: "Quem abrir o link verá que a pesquisa não está recebendo respostas. As respostas já recebidas continuam aqui, e você pode colocar no ar de novo quando quiser.", ok: "Tirar do ar" });
    if (!ok) return;
    btn.disabled = true;
    const { error } = await sb.from("pesquisas").update({ ativa: ligar, atualizado_em: new Date().toISOString() }).eq("slug", P.slug);
    btn.disabled = false;
    if (error) return toast("Não foi possível alterar: " + error.message);
    P.ativa = ligar;
    log(ligar ? "Colocou a pesquisa no ar" : "Tirou a pesquisa do ar", P.titulo);
    toast(ligar ? "Pesquisa no ar" : "Pesquisa fora do ar");
    desenhar();
  }

  function kpis() {
    const completas = R.filter((x) => x.situacao === "completa").length;
    const encerradas = R.length - completas;
    const wrap = el("div", "pa-kpis pa-entra");
    const k = (n, t, s) => { const d = el("div", "pa-kpi"); d.append(el("b", null, n), el("span", null, t)); if (s) d.append(el("small", null, s)); return d; };
    wrap.append(
      k(R.length.toLocaleString("pt-BR"), "participações", R.length ? "todas as pessoas que enviaram" : ""),
      k(completas.toLocaleString("pt-BR"), "respostas completas", R.length ? pct(completas, R.length) + "% das participações" : ""),
      k(encerradas.toLocaleString("pt-BR"), "fora do público", encerradas ? `${R.filter((x) => x.situacao === "fora_de_curitiba").length} fora de Curitiba · ${R.filter((x) => x.situacao === "sem_compras").length} sem compras` : ""),
      (() => { const q = R.filter((x) => x.quer_novidades).length; return k(q.toLocaleString("pt-BR"), "querem novidades", completas ? `${pct(q, completas)}% das completas · ${plural(I.length, "contato guardado", "contatos guardados")}` : ""); })(),
    );
    return wrap;
  }

  let ABA_INICIAL = null; // depois de excluir, o painel é redesenhado e volta para a mesma aba
  function abas() {
    const relatos = R.filter((x) => x.relato && x.relato.trim());
    const box = el("div");
    const bar = el("div", "pa-abas"); bar.setAttribute("role", "tablist"); bar.setAttribute("aria-label", "Seções da pesquisa");
    const corpo = el("div"); corpo.setAttribute("role", "tabpanel");
    const defs = [["resultados", "Resultados", null], ["inteligencia", "Inteligência", null], ["respostas", "Respostas", R.length], ["relatos", "Relatos", relatos.length], ["interessados", "Interessados", I.length]];
    const botoes = defs.map(([id, t, n]) => {
      const b = el("button"); b.type = "button"; b.setAttribute("role", "tab"); b.id = "aba-" + id; b.append(t);
      if (n != null) b.appendChild(el("span", "n", String(n)));
      b.addEventListener("click", () => abrir(id));
      bar.appendChild(b); return b;
    });
    const abrir = (id) => {
      botoes.forEach((b) => b.setAttribute("aria-selected", String(b.id === "aba-" + id)));
      corpo.setAttribute("aria-labelledby", "aba-" + id);
      corpo.replaceChildren(id === "resultados" ? resultados() : id === "inteligencia" ? inteligencia() : id === "respostas" ? listaRespostas() : id === "relatos" ? listaRelatos(relatos) : listaInteressados());
      requestAnimationFrame(() => requestAnimationFrame(animarGraficos));
    };
    box.append(bar, corpo);
    abrir(ABA_INICIAL || "resultados"); ABA_INICIAL = null;
    return box;
  }

  /* ---------- Resultados ---------- */
  const completasR = () => R.filter((x) => x.situacao === "completa");
  // valores escolhidos numa resposta (escolha única, classificação ou múltipla escolha)
  const valores = (v) => (Array.isArray(v) ? v : v && Array.isArray(v.opcoes) ? v.opcoes : v == null ? [] : [v]);
  const naCondicao = (p, x) => valores(x.respostas[p.condicao.pergunta]).some((v) => p.condicao.opcoes.includes(v));
  const respondeu = (pid) => R.filter((x) => x.respostas && x.respostas[pid] != null);
  function contar(p, base) {
    const n = {}; (p.opcoes || []).forEach((o) => { n[o.id] = 0; });
    base.forEach((x) => {
      const v = x.respostas[p.id];
      if (p.tipo === "unica" && v != null) n[v] = (n[v] || 0) + 1;
      if (p.tipo === "multipla" && v) (v.opcoes || []).forEach((o) => { n[o] = (n[o] || 0) + 1; });
    });
    return n;
  }
  function cardPergunta(p, num, base, conteudo, notas = []) {
    const c = el("section", "card pa-q");
    c.append(el("h3", null, `${num}. ${p.texto}`));
    const meta = [`${plural(base.length, "resposta", "respostas")}`];
    if (p.tipo === "ranking") meta.push(`até ${p.max} escolhas, em ordem de onde mais compraram`);
    if (p.tipo === "multipla") meta.push(p.max ? `até ${p.max} escolhas por pessoa; a soma passa de 100%` : "várias escolhas por pessoa; a soma passa de 100%");
    c.append(el("p", "meta", meta.join(" · ")), conteudo);
    notas.forEach((x) => c.appendChild(x));
    return c;
  }
  function outros(p, base) {
    const lista = base.map((x) => x.respostas[p.id] && x.respostas[p.id].outro).filter(Boolean);
    if (!lista.length) return null;
    const box = el("div", "pa-outros"); box.appendChild(el("b", null, "O que escreveram em “outro”"));
    const ul = el("ul"); lista.slice(0, 50).forEach((t) => ul.appendChild(el("li", null, t))); box.appendChild(ul);
    return box;
  }

  /* ---------- Gráficos (cores do design system; cada um com dica ao passar o mouse ou focar e "Ver números") ----------
     Escolha da forma pelo que o dado precisa mostrar: parte de um todo (barra segmentada), ranking (barras ordenadas
     com destaque na primeira), ordem de preferência (barras empilhadas 1º/2º/3º), escala ordenada (barra segmentada
     em tons), nota de 0 a 10 (colunas por faixa), fácil x difícil (barras divergentes a partir do neutro),
     faixa etária (colunas na ordem natural) e funil de participação. */
  const COR = { red: "#D44D4D", redEsc: "#A83A3A", redClaro: "#EBA0A0", slate: "#5C6986", slateClaro: "#8E9AB3", neutro: "#D7DCE5", cinza: "#C9CFDB", azulEsc: "#3F4A63" };
  const RAMPA = ["#F6D0D0", "#EBA0A0", "#DF7272", "#D44D4D", "#A83A3A"]; // sequencial (mais escuro = mais)
  const fmt1 = (n) => n.toLocaleString("pt-BR", { maximumFractionDigits: 1 });
  const semOutro = (t) => String(t || "").replace(/ \(especifique\)$/, "");
  let DICA = null;
  function dica(alvo, linhas) {
    alvo.tabIndex = 0;
    alvo.setAttribute("aria-label", linhas.map((l) => l.join(" ")).join("; "));
    const mostrar = (x, y) => {
      if (!DICA) { DICA = el("div", "pa-dica"); DICA.setAttribute("role", "tooltip"); document.body.appendChild(DICA); }
      DICA.replaceChildren(...linhas.map(([v, r]) => { const d = el("div"); d.append(el("b", null, v), el("span", null, r)); return d; }));
      DICA.style.left = Math.min(x + 14, innerWidth - DICA.offsetWidth - 12) + "px"; DICA.style.top = (y + 14) + "px"; DICA.classList.add("on");
    };
    const esconder = () => DICA && DICA.classList.remove("on");
    alvo.addEventListener("pointermove", (e) => mostrar(e.clientX, e.clientY));
    alvo.addEventListener("pointerleave", esconder);
    alvo.addEventListener("focus", () => { const r = alvo.getBoundingClientRect(); mostrar(r.left, r.bottom); });
    alvo.addEventListener("blur", esconder);
  }
  function tabela(cab, linhas) {
    const d = el("details", "pa-tabela"); d.appendChild(el("summary", null, "Ver números"));
    const t = el("table"); const th = el("tr"); cab.forEach((c) => th.appendChild(el("th", null, c))); t.appendChild(th);
    linhas.forEach((l) => { const tr = el("tr"); l.forEach((c) => tr.appendChild(el("td", null, String(c)))); t.appendChild(tr); });
    d.appendChild(t); return d;
  }
  function legenda(itens) {
    const leg = el("div", "pa-legenda"); leg.setAttribute("aria-hidden", "true");
    itens.forEach(([cor, t]) => { const s = el("span"); const i = el("i"); i.style.background = cor; s.append(i, t); leg.appendChild(s); });
    return leg;
  }
  // parte de um todo: barra segmentada alta, com o percentual dentro quando cabe
  function segmentado(partes, total) {
    const box = el("div");
    const barra = el("div", "pa-seg");
    partes.filter((p) => p.v).forEach((p) => {
      const s = el("i"); s.style.background = p.cor; s.dataset.g = String(p.v);
      const pc = pct(p.v, total);
      if (pc >= 12) { const t = el("span", "pa-seg-t" + (p.escuro ? " claro" : ""), pc + "%"); s.appendChild(t); }
      dica(s, [[`${pc}%`, `${p.rotulo} · ${plural(p.v, "pessoa", "pessoas")}`]]);
      barra.appendChild(s);
    });
    box.append(barra, legenda(partes.map((p) => [p.cor, `${p.rotulo} · ${pct(p.v, total)}%`])), tabela(["Resposta", "Pessoas", "%"], partes.map((p) => [p.rotulo, p.v, pct(p.v, total) + "%"])));
    return box;
  }
  // ranking: barras ordenadas da maior para a menor; a primeira em vermelho, as demais em cinza-azulado
  function ranking(itens, total, opts = {}) {
    const box = el("div"), lista = el("div", "pa-barras");
    const ord = opts.manterOrdem ? itens : [...itens].sort((a, b) => (a.fixo ? 1 : 0) - (b.fixo ? 1 : 0) || b.v - a.v);
    const max = Math.max(1, ...ord.filter((i) => !i.fixo).map((i) => i.v));
    ord.forEach((it, k) => {
      const topo = !it.fixo && it.v === max && it.v > 0;
      const linha = el("div", "pa-barra" + (topo ? " top" : ""));
      const r = el("div", "r"); r.append(el("span", null, semOutro(it.rotulo)), el("span", null, `${pct(it.v, total)}% · ${it.v}`));
      const t = el("div", "t"); const i = el("i"); i.dataset.w = pct(it.v, total) + "%";
      i.style.background = it.fixo ? COR.cinza : topo ? COR.red : COR.slateClaro;
      t.appendChild(i); linha.append(r, t);
      dica(linha, [[`${pct(it.v, total)}%`, `${semOutro(it.rotulo)} · ${plural(it.v, "pessoa", "pessoas")}`]]);
      lista.appendChild(linha);
    });
    box.append(lista, tabela(["Resposta", "Pessoas", "%"], ord.map((it) => [semOutro(it.rotulo), it.v, pct(it.v, total) + "%"])));
    return box;
  }
  // ordem de preferência: cada opção com 1º, 2º e 3º empilhados (tons do mais escuro ao mais claro)
  function rankingPilha(p, base) {
    const total = base.length, box = el("div"), lista = el("div", "pa-barras");
    const cores = [COR.redEsc, COR.red, COR.redClaro];
    const linhas = p.opcoes.filter((o) => !o.encerra).map((o) => {
      const pos = [0, 1, 2].map((k) => base.filter((x) => valores(x.respostas[p.id])[k] === o.id).length);
      return { o, pos, peso: pos[0] * 3 + pos[1] * 2 + pos[2], entre: pos.reduce((a, b) => a + b, 0) };
    }).sort((a, b) => b.peso - a.peso);
    linhas.forEach((l) => {
      const linha = el("div", "pa-barra pa-pilha-linha");
      const r = el("div", "r"); r.append(el("span", null, l.o.texto), el("span", null, `${pct(l.pos[0], total)}% em 1º · ${pct(l.entre, total)}% entre as 3`));
      const t = el("div", "pa-pilha2");
      l.pos.forEach((v, k) => { if (!v) return; const i = el("i"); i.style.background = cores[k]; i.dataset.w = (v / Math.max(1, total)) * 100 + "%"; dica(i, [[`${pct(v, total)}%`, `${l.o.texto} em ${k + 1}º lugar · ${plural(v, "pessoa", "pessoas")}`]]); t.appendChild(i); });
      linha.append(r, t); lista.appendChild(linha);
    });
    const enc = p.opcoes.find((o) => o.encerra);
    const nEnc = enc ? base.filter((x) => valores(x.respostas[p.id]).includes(enc.id)).length : 0;
    box.append(lista, legenda([[cores[0], "1º lugar (onde mais comprou)"], [cores[1], "2º lugar"], [cores[2], "3º lugar"]]));
    if (enc) box.appendChild(el("p", "pa-nota", `${enc.texto}: ${pct(nEnc, total)}% (${nEnc}), encerraram a pesquisa aqui.`));
    box.appendChild(tabela(["Onde comprou", "1º", "2º", "3º", "Entre as 3"], linhas.map((l) => [l.o.texto, ...l.pos, `${l.entre} (${pct(l.entre, total)}%)`])));
    return box;
  }
  // escala ordenada (frequência): barra segmentada em tons de vermelho e o número que resume o grupo mais intenso
  function escalaOrdenada(p, base, destaque) {
    const total = base.length;
    const partes = p.opcoes.map((o, k) => ({ rotulo: o.texto, v: base.filter((x) => x.respostas[p.id] === o.id).length, cor: RAMPA[Math.round((k / Math.max(1, p.opcoes.length - 1)) * 4)], escuro: k >= p.opcoes.length - 2 }));
    const box = el("div");
    if (destaque) { const n = base.filter((x) => destaque.ids.includes(x.respostas[p.id])).length; box.appendChild(numeroHeroi(`${pct(n, total)}%`, destaque.texto)); }
    box.appendChild(segmentado(partes, total));
    return box;
  }
  function numeroHeroi(valor, texto) { const d = el("div", "pa-heroi"); d.append(el("b", null, valor), el("span", null, texto)); return d; }
  // nota de 0 a 10: colunas coloridas por faixa (0 a 6, 7 e 8, 9 e 10) e a média em destaque
  function histograma(p, base) {
    const notas = base.map((x) => x.respostas[p.id]).filter((v) => typeof v === "number");
    const cont = Array.from({ length: 11 }, (_, n) => notas.filter((v) => v === n).length);
    const max = Math.max(1, ...cont);
    const faixa = (n) => (n <= 6 ? RAMPA[1] : n <= 8 ? RAMPA[3] : RAMPA[4]);
    const box = el("div");

      if (b21.length >= MIN_SEG) {
        const cita = (ids) => b21.filter((x) => valores(x.respostas.q2_1).some((v) => ids.includes(v))).length;

    const viveu = comp.filter((x) => x.respostas.q9 && !valores(x.respostas.q9).includes("nao_passei"));

    const canais = perg.q2.opcoes.filter((o) => !o.encerra).map((o) => {

    const freq = comp.filter((x) => ["frequentemente", "quase_sempre"].includes(x.respostas.q7)), rara = comp.filter((x) => ["nunca", "raramente"].includes(x.respostas.q7));

      const q4 = (g) => media(g.map((x) => x.respostas.q4).filter((v) => typeof v === "number"));
      return { l, dif, fac, gap: dif.length >= MIN_SEG && fac.length >= MIN_SEG ? q4(fac) - q4(dif) : null, q4dif: q4(dif), q4fac: q4(fac) };
    }).filter((a) => a.gap != null).sort((a, b) => b.gap - a.gap);

    }
    const semSaber = comp.filter((x) => valores(x.respostas.q10).includes("onde_encontrar"));
    if (semSaber.length >= MIN_SEG) {
      const n = contar(perg.q6, semSaber);
      const top = perg.q6.opcoes.filter((o) => !o.exclusiva && !o.outro).map((o) => ({ rotulo: semOutro(o.texto), v: n[o.id] || 0 })).sort((a, b) => b.v - a.v);

        ["Entre quem diz não saber onde encontrar determinadas peças, a forma mais comum de conhecer lojas físicas é ", { b: lc(top[0].rotulo) }, ` (${pct(top[0].v, semSaber.length)}%).`],
        semSaber.length, { mini: comparar(top.slice(0, 4).map((x) => ({ rotulo: x.rotulo, v: pct(x.v, semSaber.length), txt: pct(x.v, semSaber.length) + "%" })), 100), baseTexto: "quem marcou “Não saber onde encontrar determinadas peças” na pergunta 10" }));
    }
    if (Q.perfil) {
      const faixas = Q.perfil.find((c) => c.id === "faixa_etaria");
      const linhas = faixas ? faixas.opcoes.filter((o) => o.id !== "nao_informar").map((o) => {
        const g = comp.filter((x) => x.respostas.perfil && x.respostas.perfil.faixa_etaria === o.id);
        if (g.length < MIN_SEG) return null;
        const cont = {}; g.forEach((x) => { const p = prim(x); if (p) cont[p] = (cont[p] || 0) + 1; });
        const [id, v] = Object.entries(cont).sort((a, b) => b[1] - a[1])[0] || [];
        return id ? { faixa: o.texto, canal: txt("q2", id), p: pct(v, g.length), n: g.length, sm: pct(g.filter((x) => x.respostas.q3 && x.respostas.q3 !== "nao").length, g.length) } : null;
      }).filter(Boolean) : [];
      if (linhas.length) {

        linhas.forEach((l) => { const tr = el("tr"); [l.faixa, `${l.canal} (${l.p}%)`, `${l.sm}%`, l.n].forEach((x) => tr.appendChild(el("td", null, String(x)))); t.appendChild(tr); });
        add("Comportamento", cartao("Comportamento", "Hábitos por faixa etária",

    }

    /* ----- Estratégia (hipóteses) ----- */
    const difs = perg.q8.linhas.map((l) => { const v = comp.map((x) => (x.respostas.q8 || {})[l.id]).filter((y) => y && y !== "na"); return { rotulo: l.texto, v: pct(v.filter((y) => y === "4" || y === "5").length, v.length), n: v.length }; }).filter((x) => x.n).sort((a, b) => b.v - a.v);
    if (difs.length) add("Estratégia", cartao("Estratégia", "Onde concentrar a investigação de oferta",
      ["As características com maior dificuldade relatada são ", { b: lc(difs[0].rotulo) }, ` (${difs[0].v}% acham difícil)`, difs[1] ? [" e ", { b: lc(difs[1].rotulo) }, ` (${difs[1].v}%)`] : "", ". Vale aprofundar com quem respondeu, para entender o que falta em cada uma."].flat(),
      comp.length, { hipotese: true, mini: comparar(difs.map((d) => ({ rotulo: d.rotulo, v: d.v, txt: d.v + "%" })), 100) }));
    if (perg.q2_1) {
      const b21 = comp.filter((x) => naCondicao(perg.q2_1, x));
      const dc = b21.filter((x) => valores(x.respostas.q2_1).includes("dificuldade_cwb")).length;
      if (b21.length >= MIN_SEG && dc) add("Estratégia", cartao("Estratégia", "Demanda que poderia ficar em Curitiba",
        [{ b: `${pct(dc, b21.length)}%` }, " de quem compra fora citam a dificuldade de encontrar o que procuram em Curitiba. Se essa dificuldade for de descoberta (não saber onde está) e não de oferta (não existir), tornar a oferta local mais fácil de encontrar pode reter parte dessas compras. Validar com entrevistas."],
        b21.length, { hipotese: true, baseTexto: "quem viu a pergunta 2.1" }));
    }
    const n6 = contar(perg.q6, comp);
    const top6 = perg.q6.opcoes.filter((o) => !o.exclusiva && !o.outro).map((o) => ({ rotulo: semOutro(o.texto), v: n6[o.id] || 0 })).sort((a, b) => b.v - a.v)[0];
    const raro = pct(comp.filter((x) => valores(x.respostas.q6).some((v) => ["raramente", "nao_conheco"].includes(v))).length, comp.length);
    if (top6 && top6.v) add("Estratégia", cartao("Estratégia", "Canal com mais alcance para apresentar lojas",
      ["A forma mais citada de conhecer lojas físicas novas é ", { b: lc(top6.rotulo) }, ` (${pct(top6.v, comp.length)}%).`, ...(raro ? [" Por outro lado, ", { b: `${raro}%` }, " raramente procuram lojas novas ou não conhecem lojas físicas na cidade. Testar ações nesse canal pode mostrar se ele também alcança esse grupo."] : [" Testar ações nesse canal pode mostrar o quanto ele aproxima as pessoas das lojas da cidade."])],
      comp.length, { hipotese: true }));
    const quer = comp.filter((x) => x.quer_novidades);
    if (quer.length) {

      const fQ = pct(quer.filter((x) => ["frequentemente", "quase_sempre"].includes(x.respostas.q7)).length, quer.length), fT = pct(freq.length, comp.length);

  /* ---------- Respostas individuais (ver e excluir) ---------- */
  const SIT_CURTA = { completa: "Completa", fora_de_curitiba: "Não mora em Curitiba", sem_compras: "Não comprou este ano" };
  function textoResposta(p, v) {
    if (v == null) return "—";
    const op = (id) => ((p.opcoes || []).find((o) => o.id === id) || {}).texto?.replace(/ \(especifique\)$/, "") || id;
    if (p.tipo === "unica") return op(v);
    if (p.tipo === "ranking") return v.map((id, k) => `${k + 1}º ${op(id)}`).join(" · ");
    if (p.tipo === "escala") return String(v);
    if (p.tipo === "matriz") return p.linhas.map((l) => `${l.texto}: ${(p.colunas.find((c) => c.id === v[l.id]) || {}).texto || "—"}`).join("\n");
    return (v.opcoes || []).map((id) => op(id) + ((p.opcoes.find((o) => o.id === id) || {}).outro && v.outro ? ` (${v.outro})` : "")).join(" · ");
  }
  async function excluirRespostas(ids, todas) {
    const q = sb.from("pesquisa_respostas").delete();
    const { error } = await (todas ? q.eq("pesquisa", P.slug) : q.in("id", ids));
    if (error) { toast("Não foi possível excluir: " + error.message); return false; }
    R = todas ? [] : R.filter((x) => !ids.includes(x.id));
    log(todas ? "Apagou todas as respostas da pesquisa" : "Excluiu uma resposta da pesquisa", P.titulo);
    toast(todas ? "Todas as respostas foram apagadas" : "Resposta excluída");
    ABA_INICIAL = "respostas"; desenhar(); Admin.refreshNotifications();
    return true;
  }
  function listaRespostas() {
    const card = el("section", "card pa-entra");
    const topo = el("div", "pa-resp-topo");
    topo.appendChild(el("p", "muted", R.length ? `${plural(R.length, "participação", "participações")}, da mais recente para a mais antiga.` : ""));
    if (R.length) {
      const todas = el("button", "pa-btn perigo"); todas.type = "button"; todas.innerHTML = IC.lixo + "<span>Apagar todas as respostas</span>";
      todas.addEventListener("click", async () => {
        const ok = await confirmDialog({ title: "Apagar todas as respostas?", message: `As ${plural(R.length, "participação", "participações")} desta pesquisa serão apagadas de vez, junto com os relatos. Os gráficos voltam a zero. Os contatos da aba Interessados não são apagados por aqui. Essa ação não pode ser desfeita.`, ok: "Apagar todas", word: "APAGAR" });
        if (ok) { todas.disabled = true; await excluirRespostas([], true); }
      });
      topo.appendChild(todas);
    }
    card.appendChild(topo);
    if (!R.length) { card.appendChild(vazio("Nenhuma resposta", "As participações aparecem aqui assim que alguém envia a pesquisa.")); return card; }
    const lista = el("div", "pa-resp-lista");
    R.forEach((x, k) => {
      const d = el("details", "pa-resp");
      const sum = el("summary");
      const pf = x.respostas.perfil || {};
      const perfilTx = Q.perfil ? Q.perfil.map((c) => (c.opcoes.find((o) => o.id === pf[c.id]) || {}).texto).filter((t) => t && t !== "Prefiro não informar").join(" · ") : "";
      const q2 = Q.perguntas.find((p) => p.id === "q2");
      const prim = q2 && valores(x.respostas.q2)[0];
      const resumo = [perfilTx, prim && x.situacao === "completa" ? "Mais comprou: " + textoResposta({ ...q2, tipo: "unica" }, prim) : ""].filter(Boolean).join(" · ");
      const info = el("span", "pa-resp-info");
      info.append(el("b", null, `#${R.length - k} · ${fmtDate(x.created_at)}`), el("span", "pa-resp-sit " + x.situacao, SIT_CURTA[x.situacao] || x.situacao));
      if (resumo) info.appendChild(el("span", "pa-resp-res", resumo));
      sum.appendChild(info);
      const del = el("button", "pa-btn perigo pa-resp-del"); del.type = "button"; del.innerHTML = IC.lixo + "<span>Excluir</span>"; del.setAttribute("aria-label", `Excluir a resposta #${R.length - k}`);
      del.addEventListener("click", async (ev) => {
        ev.preventDefault(); ev.stopPropagation();
        const ok = await confirmDialog({ title: "Excluir esta resposta?", message: `A participação #${R.length - k} (${fmtDate(x.created_at)}) será apagada de vez e sai dos gráficos. Essa ação não pode ser desfeita.`, ok: "Excluir" });
        if (ok) { del.disabled = true; await excluirRespostas([x.id], false); }
      });
      sum.appendChild(del);
      d.appendChild(sum);
      const dl = el("dl", "pa-resp-dl");
      const linha = (t, v) => { const r = el("div", "row"); r.append(el("dt", null, t), el("dd", null, v)); dl.appendChild(r); };
      let num = 0;
      Q.perguntas.forEach((p) => { if (!p.condicao) num++; if (x.respostas[p.id] === undefined) return; linha(`${p.rotulo || num}. ${p.texto}`, textoResposta(p, x.respostas[p.id])); });
      (Q.perfil || []).forEach((c) => { if (pf[c.id]) linha(c.texto, ((c.opcoes.find((o) => o.id === pf[c.id]) || {}).texto || pf[c.id]).replace(/ \(especifique\)$/, "") + (pf[c.id + "_outro"] ? ` (${pf[c.id + "_outro"]})` : "")); });
      if (x.relato) linha("Relato", x.relato);
      if (x.situacao === "completa") linha("Quer novidades", x.quer_novidades ? "Sim (contato na aba Interessados)" : "Não");
      d.appendChild(dl);
      lista.appendChild(d);
    });
    card.appendChild(lista);
    return card;
  }

      });
      d.append(tx, del); card.appendChild(d);
    });
    return card;
  }

  function vazio(t, s) { const d = el("div", "pa-vazio"); d.append(el("b", null, t), s); return d; }
  function erro(m) { $("conteudo").replaceChildren(); const e = $("load-err"); e.textContent = m; e.classList.remove("hidden"); }
})();
</script>
