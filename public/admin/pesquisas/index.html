<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Pesquisas | Área restrita</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css?v=20261115d">
<style>
  .pa-topo { display: grid; gap: 16px; }
  .pa-cab { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px 20px; }
  .pa-cab h2 { margin: 0 0 4px; font-size: 20px; }
  .pa-cab .muted { margin: 0; font-size: 13px; }
  .pa-status { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; padding: 5px 12px; border-radius: 999px; background: rgba(79, 181, 123, 0.14); color: #1f6b3a; white-space: nowrap; }
  .pa-status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #2e9a5a; box-shadow: 0 0 0 0 rgba(46, 154, 90, .5); animation: pa-pulso 2s ease-out infinite; }
  .pa-status.off { background: var(--track); color: var(--muted); }
  .pa-status.off::before { background: #a3a9b5; animation: none; }
  @keyframes pa-pulso { 0% { box-shadow: 0 0 0 0 rgba(46, 154, 90, .45); } 70% { box-shadow: 0 0 0 8px rgba(46, 154, 90, 0); } 100% { box-shadow: 0 0 0 0 rgba(46, 154, 90, 0); } }
  .pa-link { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
  .pa-link input { flex: 1 1 220px; min-width: 0; font: inherit; font-size: 14px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--track); color: var(--dark); }
  .pa-acoes { display: flex; flex-wrap: wrap; gap: 8px; }
  .pa-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: inherit; font-size: 13px; font-weight: 700; padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--dark); cursor: pointer; text-decoration: none; white-space: nowrap; transition: border-color .2s, background .2s, color .2s, transform .2s; }
  .pa-btn:hover { border-color: var(--red); color: var(--red); }
  .pa-btn:active { transform: scale(.97); }
  .pa-btn svg { width: 16px; height: 16px; }
  .pa-btn.ok { border-color: #2e9a5a; color: #1f6b3a; background: rgba(79, 181, 123, 0.1); }
  .pa-btn.perigo { color: var(--red); border-color: rgba(212, 77, 77, .4); }
  .pa-btn.perigo:hover { background: var(--red); color: #fff; border-color: var(--red); }
  .pa-btn.liga { background: var(--red); border-color: var(--red); color: #fff; }
  .pa-btn:disabled { opacity: .6; cursor: wait; }
  .pa-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 20px 0; }
  @media (max-width: 860px) { .pa-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .pa-kpi { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 2px; }
  .pa-kpi b { font-size: 28px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em; }
  .pa-kpi span { font-size: 13px; color: var(--muted); }
  .pa-kpi small { font-size: 12px; color: var(--muted); }
  .pa-abas { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: #fff; border: 1px solid var(--line); width: fit-content; max-width: 100%; overflow-x: auto; margin-bottom: 16px; }
  .pa-abas button { font: inherit; font-size: 13px; font-weight: 700; border: 0; border-radius: 999px; padding: 9px 16px; background: none; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .pa-abas button[aria-selected=true] { background: var(--dark); color: #fff; }
  .pa-abas .n { margin-left: 6px; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--track); color: var(--muted); }
  .pa-abas button[aria-selected=true] .n { background: rgba(255,255,255,.18); color: #fff; }
  .pa-insights { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .pa-insights li { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; line-height: 1.55; }
  .pa-insights li::before { content: ""; flex: none; width: 8px; height: 8px; margin-top: 7px; border-radius: 50%; background: var(--red); }
  .pa-insights strong { font-weight: 700; }
  .pa-nota { font-size: 12.5px; color: var(--muted); margin: 12px 0 0; }
  .pa-graficos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
  @media (max-width: 900px) { .pa-graficos { grid-template-columns: 1fr; } }
  .pa-graficos .card { margin: 0; }
  .pa-graficos .largo { grid-column: 1 / -1; }
  .pa-q h3 { margin: 0 0 2px; font-size: 15px; line-height: 1.4; }
  .pa-q .meta { font-size: 12px; color: var(--muted); margin: 0 0 14px; }
  .pa-barras { display: grid; gap: 10px; }
  .pa-barra { display: grid; gap: 4px; }
  .pa-barra .r { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
  .pa-barra .r span:last-child { font-weight: 700; white-space: nowrap; }
  .pa-barra .t { height: 10px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .pa-barra .t i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--red); transition: width .8s cubic-bezier(.16, 1, .3, 1); }
  .pa-barra.top .r span:first-child { font-weight: 700; }
  .pa-barra.menor .t i { background: #c9cfdb; }
  .pa-escala { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 4px; align-items: end; height: 150px; }
  .pa-escala .c { display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; height: 100%; text-align: center; font-size: 11px; color: var(--muted); }
  .pa-escala .c i { display: block; height: 0; min-height: 2px; border-radius: 6px 6px 2px 2px; background: var(--red); transition: height .8s cubic-bezier(.16, 1, .3, 1); }
  .pa-escala .c b { font-size: 11px; color: var(--dark); }
  .pa-escala-eixo { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 4px; text-align: center; font-size: 12px; font-weight: 700; margin-top: 6px; }
  .pa-resumo { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 14px; font-size: 13px; }
  .pa-resumo b { font-size: 18px; margin-right: 4px; }
  .pa-matriz { display: grid; gap: 14px; }
  .pa-mlinha .r { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; margin-bottom: 6px; }
  .pa-mlinha .r b { white-space: nowrap; }
  .pa-pilha { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: var(--track); }
  .pa-pilha i { display: block; height: 100%; transition: flex-grow .8s cubic-bezier(.16, 1, .3, 1); }
  .pa-legenda { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 14px; font-size: 12px; color: var(--muted); }
  .pa-legenda span { display: inline-flex; align-items: center; gap: 6px; }
  .pa-legenda i { width: 10px; height: 10px; border-radius: 3px; }
  .pa-outros { margin: 14px 0 0; padding: 12px 14px; border-radius: 12px; background: var(--track); font-size: 13px; }
  .pa-outros b { display: block; margin-bottom: 6px; font-size: 12px; color: var(--muted); }
  .pa-outros ul { margin: 0; padding-left: 18px; }
  .pa-relato { padding: 14px 4px; border-top: 1px solid var(--track); }
  .pa-relato:first-child { border-top: 0; }
  .pa-relato p { margin: 0 0 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .pa-relato small { font-size: 12px; color: var(--muted); }
  .pa-int { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; padding: 14px 4px; border-top: 1px solid var(--track); }
  .pa-int:first-child { border-top: 0; }
  .pa-int .n { font-weight: 700; overflow-wrap: anywhere; }
  .pa-int .c { font-size: 13px; color: var(--dark); overflow-wrap: anywhere; }
  .pa-int .c a { color: var(--red); }
  .pa-int small { font-size: 12px; color: var(--muted); }
  .pa-aviso { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--slate-tint); color: var(--slate); font-size: 13px; margin-bottom: 14px; }
  .pa-aviso svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
  .pa-lista { display: grid; gap: 12px; }
  .pa-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 16px; border-radius: 16px; background: #fff; border: 1px solid var(--line); text-decoration: none; transition: border-color .2s, transform .2s, box-shadow .2s; }
  .pa-item:hover { border-color: rgba(212, 77, 77, .5); transform: translateY(-2px); box-shadow: 0 12px 28px -18px rgba(15, 23, 42, .3); }
  .pa-item .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--red-tint); color: var(--red); display: grid; place-items: center; }
  .pa-item .ic svg { width: 22px; height: 22px; }
  .pa-item .tx { display: grid; gap: 2px; min-width: 0; }
  .pa-item .tx b { font-size: 15px; }
  .pa-item .tx span { font-size: 13px; color: var(--muted); }
  .pa-novas { font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: var(--red); color: #fff; white-space: nowrap; }
  .pa-vazio { text-align: center; padding: 28px 12px; color: var(--muted); }
  .pa-vazio b { display: block; color: var(--dark); font-size: 15px; margin-bottom: 4px; }
  .pa-esqueleto { height: 120px; border-radius: 16px; background: linear-gradient(90deg, #eef1f5 0%, #f7f8fa 50%, #eef1f5 100%); background-size: 200% 100%; animation: pa-brilho 1.4s ease-in-out infinite; }
  @keyframes pa-brilho { to { background-position: -200% 0; } }
  .pa-entra { animation: pa-entra .5s cubic-bezier(.16, 1, .3, 1) both; }
  @keyframes pa-entra { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .pa-entra, .pa-esqueleto, .pa-status::before { animation: none; } .pa-barra .t i, .pa-escala .c i, .pa-pilha i { transition: none; } }
</style>
</head>
<body>
<main class="wrap hidden" id="app">
  <a class="back hidden" id="voltar" href="/admin/pesquisas/">← Pesquisas</a>
  <h1 id="titulo">Pesquisas</h1>
  <p class="muted" id="sub">Pesquisas do Studio: acompanhe as respostas, compartilhe o link e tire do ar quando quiser.</p>
  <p class="msg err hidden" id="load-err" role="alert"></p>
  <div id="conteudo"><div class="pa-esqueleto"></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/admin/admin.js?v=20261123a"></script>
<script>
(() => {
  const { sb, el, icon, fmtDate, fmtDay, log, confirmDialog, toast } = Admin;
  const SITE = "https://www.danimoscatelli.com.br";
  const API = "https://lipfvnerohkaajegqvwr.supabase.co/functions/v1/pesquisa";
  // Pesquisas conhecidas pelo site: endereço público de cada uma
  const PAGINAS = { "moda-curitiba": "/pesquisa/moda-curitiba/" };
  const $ = (id) => document.getElementById(id);
  const svg = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const IC = {
    copiar: svg('<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>'),
    ok: svg('<path d="M20 6 9 17l-5-5"/>'),
    abrir: svg('<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>'),
    pausa: svg('<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>'),
    play: svg('<path d="m6 3 14 9-14 9z"/>'),
    pesquisa: svg('<path d="M9 11h6M9 15h4"/><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 3v3h6V3"/>'),
    info: svg('<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>'),
    lixo: svg('<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>'),
  };
  const pct = (n, d) => (d ? Math.round((n / d) * 100) : 0);
  const plural = (n, um, varios) => `${n.toLocaleString("pt-BR")} ${n === 1 ? um : varios}`;
  const SITUACAO = { completa: "Completas", fora_de_curitiba: "Não moram em Curitiba", sem_compras: "Não compraram este ano" };
  const slug = new URLSearchParams(location.search).get("p");

  Admin.init({ page: "pesquisas", onReady: () => (slug ? painel(slug) : lista()) });

  /* ---------- Lista de pesquisas ---------- */
  async function lista() {
    const [{ data: ps, error }, { data: novas }] = await Promise.all([
      sb.from("pesquisas").select("slug, titulo, ativa, criada_em").order("criada_em", { ascending: false }),
      sb.from("pesquisa_respostas").select("pesquisa").is("visualizado_em", null).limit(5000),
    ]);
    if (error) return erro("Não foi possível carregar as pesquisas: " + error.message);
    const contagem = {}; (novas || []).forEach((r) => { contagem[r.pesquisa] = (contagem[r.pesquisa] || 0) + 1; });
    const c = $("conteudo"); c.replaceChildren();
    if (!ps.length) { c.appendChild(vazio("Nenhuma pesquisa ainda", "Quando houver uma pesquisa, ela aparece aqui.")); return; }
    const wrap = el("div", "pa-lista pa-entra");
    ps.forEach((p) => {
      const a = el("a", "pa-item"); a.href = "?p=" + encodeURIComponent(p.slug);
      const ic = el("span", "ic"); ic.innerHTML = IC.pesquisa;
      const tx = el("span", "tx"); tx.append(el("b", null, p.titulo), el("span", null, (p.ativa ? "No ar" : "Fora do ar") + " · criada em " + new Date(p.criada_em).toLocaleDateString("pt-BR")));
      a.append(ic, tx);
      if (contagem[p.slug]) a.appendChild(el("span", "pa-novas", plural(contagem[p.slug], "nova", "novas")));
      else a.appendChild(el("span"));
      wrap.appendChild(a);
    });
    c.appendChild(wrap);
  }

  /* ---------- Painel de uma pesquisa ---------- */
  let P = null, Q = null, R = [], I = [];
  async function painel(s) {
    $("voltar").classList.remove("hidden");
    const [p, r, i, q] = await Promise.all([
      sb.from("pesquisas").select("slug, titulo, ativa, criada_em, atualizado_em").eq("slug", s).maybeSingle(),
      sb.from("pesquisa_respostas").select("id, created_at, situacao, respostas, relato, quer_novidades, visualizado_em").eq("pesquisa", s).order("created_at", { ascending: false }).limit(10000),
      sb.from("pesquisa_interessados").select("id, created_at, nome, email, whatsapp, consentimento_em, consentimento_versao").eq("pesquisa", s).order("created_at", { ascending: false }).limit(10000),
      fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ acao: "status", pesquisa: s }) }).then((x) => x.json()).catch(() => null),
    ]);
    if (p.error || !p.data) return erro(p.error ? "Não foi possível carregar a pesquisa: " + p.error.message : "Pesquisa não encontrada.");
    if (r.error) return erro("Não foi possível carregar as respostas: " + r.error.message);
    if (!q || !q.questionario) return erro("Não foi possível carregar as perguntas da pesquisa. Atualize a página para tentar de novo.");
    P = p.data; Q = q.questionario; R = r.data || []; I = i.data || [];
    document.title = P.titulo + " | Área restrita";
    $("titulo").textContent = P.titulo;
    $("sub").textContent = "Projeto do Dani Moscatelli Studio. Respostas analisadas em conjunto, sem identificar quem respondeu.";
    desenhar();
    // ao abrir, as respostas novas deixam de aparecer como notificação
    const novas = R.filter((x) => !x.visualizado_em).map((x) => x.id);
    if (novas.length) {
      for (let k = 0; k < novas.length; k += 200) await sb.from("pesquisa_respostas").update({ visualizado_em: new Date().toISOString() }).in("id", novas.slice(k, k + 200));
      Admin.refreshNotifications();
    }
  }

  function desenhar() {
    const c = $("conteudo"); c.replaceChildren();
    c.append(topo(), kpis(), abas());
  }

  function topo() {
    const card = el("section", "card pa-topo pa-entra");
    const cab = el("div", "pa-cab");
    const esq = el("div");
    const st = el("span", "pa-status" + (P.ativa ? "" : " off"), P.ativa ? "No ar, recebendo respostas" : "Fora do ar");
    esq.append(st);
    const ult = R[0] ? "Última resposta: " + fmtDate(R[0].created_at) : "Ainda sem respostas";
    const m = el("p", "muted", ult); m.style.marginTop = "8px"; esq.appendChild(m);
    cab.appendChild(esq);
    const url = SITE + (PAGINAS[P.slug] || "/pesquisa/" + P.slug + "/");
    const link = el("div", "pa-link");
    const inp = el("input"); inp.type = "text"; inp.readOnly = true; inp.value = url; inp.setAttribute("aria-label", "Link da pesquisa");
    inp.addEventListener("focus", () => inp.select());
    const copiar = el("button", "pa-btn"); copiar.type = "button"; copiar.innerHTML = IC.copiar + "<span>Copiar link</span>";
    copiar.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(url); } catch { inp.select(); document.execCommand && document.execCommand("copy"); }
      copiar.classList.add("ok"); copiar.innerHTML = IC.ok + "<span>Link copiado</span>";
      setTimeout(() => { copiar.classList.remove("ok"); copiar.innerHTML = IC.copiar + "<span>Copiar link</span>"; }, 2200);
    });
    link.append(inp, copiar);
    const acoes = el("div", "pa-acoes");
    const ver = el("a", "pa-btn"); ver.href = url; ver.target = "_blank"; ver.rel = "noopener"; ver.innerHTML = IC.abrir + "<span>Ver a pesquisa</span>";
    const tog = el("button", "pa-btn " + (P.ativa ? "perigo" : "liga")); tog.type = "button";
    tog.innerHTML = P.ativa ? IC.pausa + "<span>Tirar do ar</span>" : IC.play + "<span>Colocar no ar</span>";
    tog.addEventListener("click", () => alternar(tog));
    acoes.append(ver, tog);
    card.append(cab, link, acoes);
    return card;
  }

  async function alternar(btn) {
    const ligar = !P.ativa;
    const ok = await confirmDialog(ligar
      ? { title: "Colocar a pesquisa no ar?", message: "O link volta a aceitar respostas na hora.", ok: "Colocar no ar", danger: false }
      : { title: "Tirar a pesquisa do ar?", message: "Quem abrir o link verá que a pesquisa não está recebendo respostas. As respostas já recebidas continuam aqui, e você pode colocar no ar de novo quando quiser.", ok: "Tirar do ar" });
    if (!ok) return;
    btn.disabled = true;
    const { error } = await sb.from("pesquisas").update({ ativa: ligar, atualizado_em: new Date().toISOString() }).eq("slug", P.slug);
    btn.disabled = false;
    if (error) return toast("Não foi possível alterar: " + error.message);
    P.ativa = ligar;
    log(ligar ? "Colocou a pesquisa no ar" : "Tirou a pesquisa do ar", P.titulo);
    toast(ligar ? "Pesquisa no ar" : "Pesquisa fora do ar");
    desenhar();
  }

  function kpis() {
    const completas = R.filter((x) => x.situacao === "completa").length;
    const encerradas = R.length - completas;
    const wrap = el("div", "pa-kpis pa-entra");
    const k = (n, t, s) => { const d = el("div", "pa-kpi"); d.append(el("b", null, n), el("span", null, t)); if (s) d.append(el("small", null, s)); return d; };
    wrap.append(
      k(R.length.toLocaleString("pt-BR"), "participações", R.length ? "todas as pessoas que enviaram" : ""),
      k(completas.toLocaleString("pt-BR"), "respostas completas", R.length ? pct(completas, R.length) + "% das participações" : ""),
      k(encerradas.toLocaleString("pt-BR"), "fora do público", encerradas ? `${R.filter((x) => x.situacao === "fora_de_curitiba").length} fora de Curitiba · ${R.filter((x) => x.situacao === "sem_compras").length} sem compras` : ""),
      (() => { const q = R.filter((x) => x.quer_novidades).length; return k(q.toLocaleString("pt-BR"), "querem novidades", completas ? `${pct(q, completas)}% das completas · ${plural(I.length, "contato guardado", "contatos guardados")}` : ""); })(),
    );
    return wrap;
  }

  function abas() {
    const relatos = R.filter((x) => x.relato && x.relato.trim());
    const box = el("div");
    const bar = el("div", "pa-abas"); bar.setAttribute("role", "tablist"); bar.setAttribute("aria-label", "Seções da pesquisa");
    const corpo = el("div"); corpo.setAttribute("role", "tabpanel");
    const defs = [["resultados", "Resultados", null], ["relatos", "Relatos", relatos.length], ["interessados", "Interessados", I.length]];
    const botoes = defs.map(([id, t, n]) => {
      const b = el("button"); b.type = "button"; b.setAttribute("role", "tab"); b.id = "aba-" + id; b.append(t);
      if (n != null) b.appendChild(el("span", "n", String(n)));
      b.addEventListener("click", () => abrir(id));
      bar.appendChild(b); return b;
    });
    const abrir = (id) => {
      botoes.forEach((b) => b.setAttribute("aria-selected", String(b.id === "aba-" + id)));
      corpo.setAttribute("aria-labelledby", "aba-" + id);
      corpo.replaceChildren(id === "resultados" ? resultados() : id === "relatos" ? listaRelatos(relatos) : listaInteressados());
      requestAnimationFrame(() => requestAnimationFrame(animarGraficos));
    };
    box.append(bar, corpo);
    abrir("resultados");
    return box;
  }

  /* ---------- Resultados ---------- */
  const completasR = () => R.filter((x) => x.situacao === "completa");
  const respondeu = (pid) => R.filter((x) => x.respostas && x.respostas[pid] != null);
  function contar(p, base) {
    const n = {}; (p.opcoes || []).forEach((o) => { n[o.id] = 0; });
    base.forEach((x) => {
      const v = x.respostas[p.id];
      if (p.tipo === "unica" && v != null) n[v] = (n[v] || 0) + 1;
      if (p.tipo === "multipla" && v) (v.opcoes || []).forEach((o) => { n[o] = (n[o] || 0) + 1; });
    });
    return n;
  }
  function graficoBarras(p, base, opts = {}) {
    const n = contar(p, base), total = base.length;
    const wrap = el("div", "pa-barras");
    const ordem = [...p.opcoes].map((o) => ({ ...o, v: n[o.id] || 0 }));
    const max = Math.max(...ordem.map((o) => o.v));
    ordem.forEach((o) => {
      const linha = el("div", "pa-barra" + (o.v && o.v === max ? " top" : "") + (opts.menor && opts.menor(o) ? " menor" : ""));
      const r = el("div", "r"); r.append(el("span", null, o.texto.replace(/ \(especifique\)$/, "")), el("span", null, `${pct(o.v, total)}% · ${o.v}`));
      const t = el("div", "t"); const i = el("i"); i.dataset.w = pct(o.v, total) + "%"; t.appendChild(i);
      linha.setAttribute("aria-label", `${o.texto}: ${pct(o.v, total)}%, ${o.v} ${o.v === 1 ? "pessoa" : "pessoas"}`);
      linha.append(r, t); wrap.appendChild(linha);
    });
    return wrap;
  }
  function cardPergunta(p, num, base, conteudo, notas = []) {
    const c = el("section", "card pa-q");
    c.append(el("h3", null, `${num}. ${p.texto}`));
    const meta = [`${plural(base.length, "resposta", "respostas")}`];
    if (p.tipo === "multipla") meta.push(p.max ? `até ${p.max} escolhas por pessoa; a soma passa de 100%` : "várias escolhas por pessoa; a soma passa de 100%");
    c.append(el("p", "meta", meta.join(" · ")), conteudo);
    notas.forEach((x) => c.appendChild(x));
    return c;
  }
  function outros(p, base) {
    const lista = base.map((x) => x.respostas[p.id] && x.respostas[p.id].outro).filter(Boolean);
    if (!lista.length) return null;
    const box = el("div", "pa-outros"); box.appendChild(el("b", null, "O que escreveram em “outro”"));
    const ul = el("ul"); lista.slice(0, 50).forEach((t) => ul.appendChild(el("li", null, t))); box.appendChild(ul);
    return box;
  }

  function resultados() {
    const box = el("div", "pa-entra");
    if (!R.length) { box.appendChild(vazio("Ainda não há respostas", "Compartilhe o link. Cada participação aparece aqui na hora, e o sino avisa quando chegar uma nova.")); return box; }
    const comp = completasR();
    box.appendChild(cardInsights(comp));
    const g = el("div", "pa-graficos");
    const perg = Q.perguntas;
    // Q1 e Q2: todas as pessoas que chegaram até a pergunta
    const b1 = respondeu("q1"), b2 = respondeu("q2");
    g.append(cardPergunta(perg[0], 1, b1, graficoBarras(perg[0], b1)));
    g.append(cardPergunta(perg[1], 2, b2, graficoBarras(perg[1], b2, { menor: (o) => !!o.encerra })));
    let num = 2;
    perg.slice(2).forEach((p) => {
      // perguntas condicionais (ex.: 2.1): só entre quem a pergunta foi mostrada
      const base = p.condicao ? comp.filter((x) => p.condicao.opcoes.includes(x.respostas[p.condicao.pergunta])) : comp;
      if (!p.condicao) num++;
      let conteudo;
      if (p.tipo === "escala") conteudo = graficoEscala(p, base);
      else if (p.tipo === "matriz") conteudo = graficoMatriz(p, base);
      else conteudo = graficoBarras(p, base, { menor: (o) => !!o.exclusiva });
      const notas = [outros(p, base)];
      if (p.condicao) {
        const ops = perg.find((x) => x.id === p.condicao.pergunta).opcoes.filter((o) => p.condicao.opcoes.includes(o.id)).map((o) => "“" + o.texto + "”");
        notas.unshift(el("p", "pa-nota", "Mostrada só para quem respondeu na pergunta 2: " + ops.join(" ou ") + "."));
      }
      const c = cardPergunta(p, p.rotulo || num, base, conteudo, notas.filter(Boolean));
      if (p.tipo === "matriz" || p.tipo === "escala") c.classList.add("largo");
      g.appendChild(c);
    });
    box.appendChild(g);
    const n = el("p", "pa-nota", `As perguntas 2.1 a 10 mostram só as respostas completas (${comp.length}); a 2.1, só de quem ela foi mostrada. Quem não mora em Curitiba ou não comprou este ano encerra na pergunta 1 ou 2 e não vê as seguintes.`);
    box.appendChild(n);
    return box;
  }

  function graficoEscala(p, base) {
    const notas = base.map((x) => x.respostas[p.id]).filter((v) => typeof v === "number");
    const cont = Array.from({ length: 11 }, (_, n) => notas.filter((v) => v === n).length);
    const max = Math.max(1, ...cont);
    const wrap = el("div");
    const g = el("div", "pa-escala"); g.setAttribute("role", "img");
    g.setAttribute("aria-label", "Distribuição das notas: " + cont.map((c, n) => `${n}: ${c}`).join(", "));
    cont.forEach((c) => { const col = el("div", "c"); const i = el("i"); i.dataset.h = Math.max(2, Math.round((c / max) * 120)) + "px"; col.append(el("b", null, c ? String(c) : ""), i); g.appendChild(col); });
    const eixo = el("div", "pa-escala-eixo"); eixo.setAttribute("aria-hidden", "true"); cont.forEach((_, n) => eixo.appendChild(el("span", null, String(n))));
    const ord = [...notas].sort((a, b) => a - b);
    const media = notas.length ? notas.reduce((a, b) => a + b, 0) / notas.length : 0;
    const mediana = notas.length ? (ord.length % 2 ? ord[(ord.length - 1) / 2] : (ord[ord.length / 2 - 1] + ord[ord.length / 2]) / 2) : 0;
    const res = el("div", "pa-resumo");
    const item = (v, t) => { const s = el("span"); s.append(el("b", null, v), t); return s; };
    res.append(item(media.toLocaleString("pt-BR", { maximumFractionDigits: 1 }), "média"), item(mediana.toLocaleString("pt-BR", { maximumFractionDigits: 1 }), "mediana"),
      item(pct(notas.filter((v) => v >= 9).length, notas.length) + "%", "deram 9 ou 10"), item(pct(notas.filter((v) => v <= 6).length, notas.length) + "%", "deram de 0 a 6"));
    wrap.append(g, eixo, res);
    const ext = el("p", "pa-nota", `0 = ${p.rotulo_min} · 10 = ${p.rotulo_max}`); wrap.appendChild(ext);
    return wrap;
  }

  // escala divergente (fácil em cinza-azulado, difícil em vermelho), legível também para daltonismo
  const CORES_MATRIZ = { "1": "#3f4a63", "2": "#8e9ab3", "3": "#d7dce5", "4": "#ec9d9d", "5": "#c43c3c", "na": "#f1f3f7" };
  function graficoMatriz(p, base) {
    const wrap = el("div");
    const m = el("div", "pa-matriz");
    p.linhas.forEach((l) => {
      const vals = base.map((x) => x.respostas[p.id] && x.respostas[p.id][l.id]).filter(Boolean);
      const aplica = vals.filter((v) => v !== "na");
      const dif = aplica.filter((v) => v === "4" || v === "5").length;
      const linha = el("div", "pa-mlinha");
      const r = el("div", "r"); r.append(el("span", null, l.texto), el("b", null, aplica.length ? `${pct(dif, aplica.length)}% acham difícil` : "sem respostas"));
      const pilha = el("div", "pa-pilha"); pilha.setAttribute("role", "img");
      pilha.setAttribute("aria-label", l.texto + ": " + p.colunas.map((c) => `${c.texto} ${pct(vals.filter((v) => v === c.id).length, vals.length)}%`).join(", "));
      p.colunas.forEach((c) => { const n = vals.filter((v) => v === c.id).length; if (!n) return; const i = el("i"); i.style.background = CORES_MATRIZ[c.id]; i.style.flexGrow = "0"; i.dataset.g = String(n); i.title = `${c.texto}: ${pct(n, vals.length)}% (${n})`; pilha.appendChild(i); });
      linha.append(r, pilha); m.appendChild(linha);
    });
    const leg = el("div", "pa-legenda"); leg.setAttribute("aria-hidden", "true");
    p.colunas.forEach((c) => { const s = el("span"); const i = el("i"); i.style.background = CORES_MATRIZ[c.id]; if (c.id === "na") i.style.border = "1px solid #c9cfdb"; s.append(i, c.texto); leg.appendChild(s); });
    wrap.append(m, leg, el("p", "pa-nota", "“Acham difícil” soma Difícil e Muito difícil, sem contar quem marcou Não se aplica."));
    return wrap;
  }

  // Destaques calculados direto dos números (sem IA): a opção mais escolhida e alguns recortes
  function cardInsights(comp) {
    const card = el("section", "card");
    card.appendChild(el("h2", null, "Destaques"));
    const ul = el("ul", "pa-insights");
    const add = (partes) => { const li = el("li"), t = el("span"); partes.forEach((x) => t.append(typeof x === "string" ? x : el("strong", null, x.b))); li.appendChild(t); ul.appendChild(li); };
    const perg = Object.fromEntries(Q.perguntas.map((p) => [p.id, p]));
    const topo = (p, base, filtro = () => true) => {
      const n = contar(p, base); const op = p.opcoes.filter(filtro).map((o) => ({ ...o, v: n[o.id] || 0 })).sort((a, b) => b.v - a.v)[0];
      return op && op.v ? op : null;
    };
    const elegiveis = R.length - R.filter((x) => x.situacao !== "completa").length;
    add([{ b: `${pct(elegiveis, R.length)}%` }, ` das ${plural(R.length, "participação", "participações")} estão no público da pesquisa (moram em Curitiba e compraram este ano).`]);
    if (!comp.length) { ul.appendChild((() => { const li = el("li"); li.appendChild(el("span", null, "Ainda não há respostas completas para os demais destaques.")); return li; })()); card.appendChild(ul); return card; }
    const b2 = respondeu("q2").filter((x) => x.respostas.q2 !== "nao_comprei");
    const t2 = topo(perg.q2, b2, (o) => !o.encerra); if (t2) add(["Onde a maior parte das compras acontece: ", { b: t2.texto }, ` (${pct(t2.v, b2.length)}%).`]);
    if (perg.q2_1) {
      const b21 = comp.filter((x) => perg.q2_1.condicao.opcoes.includes(x.respostas.q2));
      const t21 = topo(perg.q2_1, b21, (o) => !o.outro);
      if (t21) add(["Entre quem compra mais em marketplaces ou lojas online de outras cidades, o motivo mais citado: ", { b: t21.texto }, ` (${pct(t21.v, b21.length)}%).`]);
    }
    const t5 = topo(perg.q5, comp); if (t5) add(["Onde a procura começa: ", { b: t5.texto }, ` (${pct(t5.v, comp.length)}%).`]);
    const sm = comp.filter((x) => x.respostas.q3 && x.respostas.q3 !== "nao").length; add([{ b: `${pct(sm, comp.length)}%` }, " compraram de segunda mão (brechós) este ano."]);
    const notas = comp.map((x) => x.respostas.q4).filter((v) => typeof v === "number");
    if (notas.length) add(["Satisfação com as compras: média ", { b: (notas.reduce((a, b) => a + b, 0) / notas.length).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) }, " de 10."]);
    const freq = comp.filter((x) => ["frequentemente", "quase_sempre"].includes(x.respostas.q7)).length;
    add([{ b: `${pct(freq, comp.length)}%` }, " frequentemente ou quase sempre não encontram a peça com as características que procuram."]);
    const difs = perg.q8.linhas.map((l) => { const v = comp.map((x) => x.respostas.q8 && x.respostas.q8[l.id]).filter((y) => y && y !== "na"); return { t: l.texto, p: pct(v.filter((y) => y === "4" || y === "5").length, v.length), n: v.length }; }).filter((x) => x.n).sort((a, b) => b.p - a.p);
    if (difs[0] && difs[0].p) add(["Característica mais difícil de encontrar: ", { b: difs[0].t }, ` (${difs[0].p}% acham difícil ou muito difícil).`]);
    const viveu = comp.filter((x) => x.respostas.q9 && !x.respostas.q9.opcoes.includes("nao_passei"));
    const des = viveu.filter((x) => x.respostas.q9.opcoes.includes("desisti")).length;
    if (viveu.length) add(["Entre quem não encontrou uma peça este ano, ", { b: `${pct(des, viveu.length)}%` }, " desistiram da compra em algum momento."]);
    const t10 = topo(perg.q10, comp, (o) => !o.exclusiva && !o.outro); if (t10) add(["O que mais atrapalha, além das peças: ", { b: t10.texto }, ` (${pct(t10.v, comp.length)}%).`]);
    card.appendChild(ul);
    if (comp.length < 30) card.appendChild(el("p", "pa-nota", `Com ${plural(comp.length, "resposta completa", "respostas completas")}, os percentuais ainda podem mudar bastante a cada nova participação.`));
    return card;
  }

  function animarGraficos() {
    document.querySelectorAll(".pa-barra .t i[data-w]").forEach((i) => { i.style.width = i.dataset.w; });
    document.querySelectorAll(".pa-escala .c i[data-h]").forEach((i) => { i.style.height = i.dataset.h; });
    document.querySelectorAll(".pa-pilha i[data-g]").forEach((i) => { i.style.flexGrow = i.dataset.g; });
  }

  /* ---------- Relatos ---------- */
  function listaRelatos(lista) {
    const card = el("section", "card pa-entra");
    const aviso = el("div", "pa-aviso"); aviso.innerHTML = IC.info; aviso.appendChild(el("span", null, "Relatos da pergunta aberta, exatamente como foram escritos. Aparecem sem nome, mesmo de quem deixou contato."));
    card.appendChild(aviso);
    if (!lista.length) { card.appendChild(vazio("Nenhum relato ainda", "A pergunta aberta é opcional; os relatos aparecem aqui quando alguém escrever.")); return card; }
    lista.forEach((x) => { const d = el("div", "pa-relato"); d.append(el("p", null, x.relato), el("small", null, fmtDate(x.created_at))); card.appendChild(d); });
    return card;
  }

  /* ---------- Interessados ---------- */
  function listaInteressados() {
    const card = el("section", "card pa-entra");
    const aviso = el("div", "pa-aviso"); aviso.innerHTML = IC.info;
    aviso.appendChild(el("span", null, "Pessoas que pediram para receber novidades sobre o lançamento, com autorização registrada (data, horário e versão do texto). Use estes contatos só para isso. Ficam separados das respostas da pesquisa."));
    card.appendChild(aviso);
    if (!I.length) { card.appendChild(vazio("Ninguém pediu novidades ainda", "Quem marcar “Sim, quero receber novidades” no fim da pesquisa aparece aqui.")); return card; }
    I.forEach((x) => {
      const d = el("div", "pa-int");
      const tx = el("div");
      const ctt = el("div", "c");
      const mail = el("a", null, x.email); mail.href = "mailto:" + x.email;
      const tel = x.whatsapp.replace(/^(\d{2})(\d{4,5})(\d{4})$/, "($1) $2-$3");
      const wa = el("a", null, tel); wa.href = "https://wa.me/55" + x.whatsapp; wa.target = "_blank"; wa.rel = "noopener";
      ctt.append(mail, " · ", wa);
      tx.append(el("div", "n", x.nome), ctt, el("small", null, "Autorizou em " + fmtDate(x.consentimento_em) + " · " + x.consentimento_versao));
      const del = el("button", "pa-btn perigo"); del.type = "button"; del.innerHTML = IC.lixo + "<span>Excluir</span>"; del.setAttribute("aria-label", "Excluir contato de " + x.nome);
      del.addEventListener("click", async () => {
        const ok = await confirmDialog({ title: "Excluir este contato?", message: `Os dados de ${x.nome} (nome, e-mail, WhatsApp e autorização) serão apagados de vez. Use quando a pessoa pedir a exclusão ou cancelar os avisos.`, ok: "Excluir" });
        if (!ok) return;
        const { error } = await sb.from("pesquisa_interessados").delete().eq("id", x.id);
        if (error) return toast("Não foi possível excluir: " + error.message);
        I = I.filter((y) => y.id !== x.id); log("Excluiu contato de interessado na pesquisa", P.titulo); toast("Contato excluído"); desenhar(); document.getElementById("aba-interessados").click();
      });
      d.append(tx, del); card.appendChild(d);
    });
    return card;
  }

  function vazio(t, s) { const d = el("div", "pa-vazio"); d.append(el("b", null, t), s); return d; }
  function erro(m) { $("conteudo").replaceChildren(); const e = $("load-err"); e.textContent = m; e.classList.remove("hidden"); }
})();
</script>
</body>
</html>
