<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Loja | Área restrita</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
<style>
  .lj-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin: 20px 0 12px; }
  .lj-top a { font-size: 14px; font-weight: 600; color: var(--red); }
  .btn-add { display: inline-flex; align-items: center; gap: 8px; font: inherit; font-size: 14px; font-weight: 700; color: #fff; background: var(--red); border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer; }
  .btn-add:hover { background: var(--red-dark); }
  .btn-add svg { width: 18px; height: 18px; }
  .pr-row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 6px; border-radius: 12px; cursor: pointer; }
  .pr-row + .pr-row { border-top: 1px solid var(--track); }
  .pr-row:hover { background: #f8fafc; }
  .pr-row img { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; background: var(--track); }
  .pr-row .tx { min-width: 0; display: grid; gap: 2px; }
  .pr-row .m { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .14em; color: var(--red); }
  .pr-row b { font-size: 15px; overflow-wrap: anywhere; }
  .pr-row .p { font-size: 13px; color: var(--muted); }
  .pill { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
  .pill.on { background: #e7f5ec; color: #1f6b3a; }
  .pill.off { background: var(--track); color: var(--muted); }
  .lj-dlg { width: min(640px, 94vw); max-height: 92vh; border: 0; border-radius: 18px; padding: 0; box-shadow: 0 20px 60px -10px rgb(15 23 42 / .35); }
  .lj-dlg::backdrop { background: rgb(15 23 42 / .45); }
  .lj-in { position: relative; padding: 22px; display: grid; gap: 14px; }
  .lj-in h2 { margin: 0; font-size: 20px; padding-right: 40px; }
  .lj-in label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; }
  .lj-in input[type=text], .lj-in input[type=url] { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--dark); outline: none; }
  .lj-in input:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgb(212 77 77 / .15); }
  .lj-in .hint { font-size: 12px; color: var(--muted); font-weight: 400; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .fotos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .slot { position: relative; aspect-ratio: 1 / 1; border: 2px dashed var(--line); border-radius: 14px; background: #f8fafc; display: grid; place-items: center; cursor: pointer; overflow: hidden; color: var(--muted); font-size: 12px; font-weight: 600; text-align: center; padding: 6px; }
  .slot:hover { border-color: var(--red); color: var(--red); }
  .slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .slot .n { position: absolute; top: 6px; left: 6px; background: rgb(15 23 42 / .7); color: #fff; font-size: 11px; border-radius: 999px; padding: 1px 7px; z-index: 1; }
  .slot.err { border-color: var(--red); }
  .lj-in .tg { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .lj-in .tg input { width: 18px; height: 18px; accent-color: var(--red); margin: 0; }
  .lj-acts { display: flex; flex-wrap: wrap-reverse; gap: 8px; justify-content: space-between; align-items: center; }
  .lj-acts .btn-add { margin-left: auto; }
  .link-danger { background: none; border: 0; padding: 8px 4px; font: inherit; font-size: 14px; font-weight: 600; color: var(--red); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .lj-x { position: absolute; top: 10px; right: 10px; width: 44px; height: 44px; border: 0; background: none; border-radius: 10px; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
  .lj-x svg { width: 22px; height: 22px; }
  @media (max-width: 520px) { .two { grid-template-columns: 1fr; } }
  .mk { margin-top: 16px; padding: 0; overflow: hidden; }
  .mk-h { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--track); background: #fcfcfd; }
  .mk-h .lg { width: 72px; height: 48px; border-radius: 10px; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; padding: 6px; }
  .mk-h .lg img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .mk-h b { font-size: 17px; display: block; }
  .mk-h .s { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 2px; }
  .mk-body { padding: 6px 12px 14px; }
  .mk-body .empty { padding: 18px 12px; }
  .mk-add { display: flex; justify-content: flex-start; padding: 6px 6px 0; }
  .btn-line { background: #fff; border: 1px solid var(--line); color: var(--dark); border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .btn-line:hover { border-color: var(--red); color: var(--red); }
  .btn-line svg { width: 16px; height: 16px; }
  .lj-in textarea { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--dark); outline: none; resize: vertical; min-height: 90px; }
  .lj-in textarea:focus, .lj-in select:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgb(212 77 77 / .15); }
  .lj-in select { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  .logo-slot { width: 100%; max-width: 280px; aspect-ratio: 16 / 10; border: 2px dashed var(--line); border-radius: 14px; background: #fff; display: grid; place-items: center; cursor: pointer; overflow: hidden; color: var(--muted); font-size: 13px; font-weight: 600; padding: 14px; }
  .logo-slot:hover { border-color: var(--red); color: var(--red); }
  .logo-slot img { max-width: 100%; max-height: 100%; object-fit: contain; }
  @media (max-width: 520px) { .mk-h { grid-template-columns: 56px minmax(0, 1fr); } .mk-h .lg { width: 56px; height: 40px; } .mk-h .btn-line { grid-column: 1 / -1; justify-self: start; } }
</style>
</head>
<body>
<main class="wrap hidden" id="app">
  <h1>Loja</h1>
  <p class="muted" id="count"></p>
  <p class="msg err hidden" id="load-err"></p>
  <div class="lj-top">
    <a href="/store/" target="_blank" rel="noopener">Ver a loja →</a>
    <button type="button" class="btn-add" id="nova-marca"><span class="bi" id="ic-novo"></span>Nova marca</button>
  </div>
  <div id="list"></div>
</main>

<dialog class="lj-dlg" id="dlg-marca" aria-labelledby="dm-t">
  <form class="lj-in" id="form-marca" novalidate>
    <button type="button" class="lj-x" data-close aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <h2 id="dm-t">Nova marca</h2>
    <div>
      <div style="font-size:13px;font-weight:600;margin-bottom:6px">Logo</div>
      <button type="button" class="logo-slot" id="logo-slot">Escolher logo</button>
      <span class="hint">PNG com fundo transparente fica melhor. A logo aparece inteira, sem cortes.</span>
    </div>
    <label>Nome da marca<input type="text" id="m-nome" maxlength="80" placeholder="Ex.: Donna Shape"></label>
    <label>Descrição (opcional)<textarea id="m-desc" maxlength="400" placeholder="Uma ou duas frases sobre a marca."></textarea></label>
    <label class="tg"><input type="checkbox" id="m-ativo" checked>Mostrar na loja</label>
    <p class="msg err hidden" id="dm-err"></p>
    <div class="lj-acts">
      <button type="button" class="link-danger hidden" id="m-excluir">Excluir marca</button>
      <button type="submit" class="btn-add" id="m-salvar">Salvar</button>
    </div>
  </form>
</dialog>

<dialog class="lj-dlg" id="dlg" aria-labelledby="dlg-t">
  <form class="lj-in" id="form" novalidate>
    <button type="button" class="lj-x" data-close aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <h2 id="dlg-t">Novo produto</h2>
    <div>
      <div style="font-size:13px;font-weight:600;margin-bottom:6px">Fotos (3)</div>
      <div class="fotos" id="fotos"></div>
      <span class="hint">Toque em cada quadro para escolher a foto. Elas aparecem quadradas na loja.</span>
    </div>
    <label>Marca<select id="marca"></select></label>
    <label>Nome do produto<input type="text" id="nome" maxlength="160"></label>
    <div class="two">
      <label>Preço (R$)<input type="text" id="preco" inputmode="decimal" placeholder="Ex.: 149,90"></label>
      <label>Desconto (%)<input type="text" id="desconto" inputmode="numeric" maxlength="2" placeholder="Ex.: 15"></label>
    </div>
    <label>Link de compra (afiliado ou cupom)<input type="url" id="link" placeholder="https://"></label>
    <label class="tg"><input type="checkbox" id="ativo" checked>Mostrar na loja</label>
    <p class="msg err hidden" id="dlg-err"></p>
    <div class="lj-acts">
      <button type="button" class="link-danger hidden" id="excluir">Excluir produto</button>
      <button type="submit" class="btn-add" id="salvar">Salvar</button>
    </div>
  </form>
</dialog>
<input type="file" id="file" accept="image/png,image/jpeg,image/webp" class="hidden">
<input type="file" id="file-logo" accept="image/png,image/jpeg,image/webp" class="hidden">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/admin/admin.js"></script>
<script>
// Loja em níveis: marcas (logo, nome, descrição) e, dentro de cada marca, os produtos
// (três fotos, preço, desconto e link de compra). A vitrine pública fica em /store/.
const el = Admin.el, sb = Admin.sb, $ = (id) => document.getElementById(id);
const BUCKET = "/storage/v1/object/public/loja/";
const brl = (v) => Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const plural = (n, um, varios) => n + " " + (n === 1 ? um : varios);
const caminho = (url) => (url || "").includes(BUCKET) ? decodeURIComponent(url.split(BUCKET)[1].split("?")[0]) : null;
let MARCAS = [], PRODS = [];
document.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", () => b.closest("dialog").close()));

/* ---------- Lista ---------- */
function linhaProduto(p) {
  const row = el("div", "pr-row"); row.tabIndex = 0; row.setAttribute("role", "button");
  const img = el("img"); img.src = p.fotos[0]; img.alt = "";
  const tx = el("div", "tx"); tx.append(el("b", null, p.nome), el("span", "p", brl(p.preco) + (p.desconto ? " · " + p.desconto + "% de desconto" : "")));
  row.append(img, tx, el("span", "pill " + (p.ativo ? "on" : "off"), p.ativo ? "Visível" : "Oculto"));
  const abrir = () => abrirProduto(p, p.marca_id);
  row.addEventListener("click", abrir);
  row.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); abrir(); } });
  return row;
}
function render() {
  const list = $("list"); list.replaceChildren();
  $("count").textContent = MARCAS.length ? plural(MARCAS.length, "marca", "marcas") + " · " + plural(PRODS.length, "produto", "produtos") : "";
  if (!MARCAS.length) return list.appendChild(el("section", "card empty", "Nenhuma marca cadastrada ainda. Toque em “Nova marca” para começar."));
  for (const m of MARCAS) {
    const prods = PRODS.filter((p) => p.marca_id === m.id);
    const sec = el("section", "card mk");
    const h = el("div", "mk-h");
    const lg = el("span", "lg"); const li = el("img"); li.src = m.logo; li.alt = ""; lg.appendChild(li);
    const tx = el("div"); const s = el("span", "s");
    s.append(plural(prods.length, "produto", "produtos"), el("span", "pill " + (m.ativo ? "on" : "off"), m.ativo ? "Visível" : "Oculta"));
    tx.append(el("b", null, m.nome), s);
    const ed = el("button", "btn-line", "Editar marca"); ed.type = "button"; ed.addEventListener("click", () => abrirMarca(m));
    h.append(lg, tx, ed);
    const body = el("div", "mk-body");
    if (prods.length) prods.forEach((p) => body.appendChild(linhaProduto(p)));
    else body.appendChild(el("div", "empty", "Nenhum produto nesta marca ainda."));
    const add = el("div", "mk-add"); const b = el("button", "btn-line"); b.type = "button";
    b.innerHTML = Admin.icon("bag"); b.append("Adicionar produto"); b.addEventListener("click", () => abrirProduto(null, m.id));
    add.appendChild(b); body.appendChild(add);
    sec.append(h, body); list.appendChild(sec);
  }
}
async function carregar() {
  const [m, p] = await Promise.all([
    sb.from("marcas").select("*").order("ordem").order("nome"),
    sb.from("produtos").select("*").order("ordem").order("created_at", { ascending: false }),
  ]);
  const error = m.error || p.error;
  $("load-err").classList.toggle("hidden", !error);
  if (error) { $("load-err").textContent = "Não foi possível carregar a loja: " + error.message; return; }
  MARCAS = m.data; PRODS = p.data;
  render();
}

/* ---------- Imagens ---------- */
// Produto: recorta no centro e reduz para 1200x1200. Logo: mantém a proporção (até 800 px), sem cortes.
function prepararImagem(file, quadrada) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const W = img.naturalWidth, H = img.naturalHeight, c = document.createElement("canvas");
      if (quadrada) {
        const lado = Math.min(W, H), alvo = Math.min(1200, lado);
        c.width = c.height = alvo;
        c.getContext("2d").drawImage(img, (W - lado) / 2, (H - lado) / 2, lado, lado, 0, 0, alvo, alvo);
      } else {
        const k = Math.min(1, 800 / Math.max(W, H));
        c.width = Math.round(W * k); c.height = Math.round(H * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      }
      URL.revokeObjectURL(url);
      c.toBlob((b) => (b ? resolve(b) : reject()), "image/webp", 0.88);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(); };
    img.src = url;
  });
}
async function enviar(blob) {
  const path = Date.now() + "-" + Math.random().toString(36).slice(2, 8) + ".webp";
  const { error } = await sb.storage.from("loja").upload(path, blob, { contentType: "image/webp", upsert: false });
  return error ? { error } : { path, url: sb.storage.from("loja").getPublicUrl(path).data.publicUrl };
}
const remover = (paths) => paths.length ? sb.storage.from("loja").remove(paths) : null;
const mostrarErro = (id, t) => { $(id).textContent = t; $(id).classList.toggle("hidden", !t); };

/* ---------- Marca ---------- */
let MARCA = null, LOGO = null;
const slugify = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "marca";
function desenharLogo() {
  const b = $("logo-slot"); b.replaceChildren();
  if (LOGO) { const i = el("img"); i.src = LOGO.preview || LOGO.url; i.alt = "Logo"; b.appendChild(i); } else b.append("Escolher logo");
}
function abrirMarca(m) {
  MARCA = m || null;
  $("dm-t").textContent = m ? "Editar marca" : "Nova marca";
  $("m-nome").value = m?.nome ?? ""; $("m-desc").value = m?.descricao ?? ""; $("m-ativo").checked = m ? m.ativo : true;
  $("m-excluir").classList.toggle("hidden", !m);
  LOGO = m ? { url: m.logo } : null;
  desenharLogo(); mostrarErro("dm-err", "");
  $("dlg-marca").showModal();
}
$("logo-slot").addEventListener("click", () => $("file-logo").click());
$("file-logo").addEventListener("change", async (e) => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  if (!/^image\/(png|jpeg|webp)$/.test(f.type)) return mostrarErro("dm-err", "Use uma imagem PNG, JPG ou WebP.");
  try {
    const blob = await prepararImagem(f, false);
    if (LOGO?.preview) URL.revokeObjectURL(LOGO.preview);
    LOGO = { blob, preview: URL.createObjectURL(blob), substitui: LOGO?.url || LOGO?.substitui || null };
    mostrarErro("dm-err", ""); desenharLogo();
  } catch { mostrarErro("dm-err", "Não foi possível ler a imagem. Tente outra."); }
});
$("form-marca").addEventListener("submit", async (e) => {
  e.preventDefault();
  const nome = $("m-nome").value.trim().replace(/\s+/g, " "), descricao = $("m-desc").value.trim();
  if (!LOGO) return mostrarErro("dm-err", "Escolha a logo da marca.");
  if (!nome) return mostrarErro("dm-err", "Informe o nome da marca."), $("m-nome").focus();
  const btn = $("m-salvar"); btn.disabled = true; btn.textContent = "Salvando…"; mostrarErro("dm-err", "");
  const fim = () => { btn.disabled = false; btn.textContent = "Salvar"; };
  let logo = LOGO.url, nova = null;
  if (LOGO.blob) {
    const up = await enviar(LOGO.blob);
    if (up.error) { fim(); return mostrarErro("dm-err", "Não foi possível enviar a logo: " + up.error.message); }
    logo = up.url; nova = up.path;
  }
  // Endereço da marca na loja (/store/?marca=...), único entre as marcas.
  let slug = MARCA?.slug || slugify(nome);
  if (!MARCA) { const base = slug; let i = 2; while (MARCAS.some((x) => x.slug === slug)) slug = base + "-" + i++; }
  const linha = { nome, descricao: descricao || null, logo, slug, ativo: $("m-ativo").checked, updated_at: new Date().toISOString() };
  const { error } = MARCA ? await sb.from("marcas").update(linha).eq("id", MARCA.id) : await sb.from("marcas").insert(linha);
  fim();
  if (error) { if (nova) await remover([nova]); return mostrarErro("dm-err", "Não foi possível salvar: " + error.message); }
  if (nova && caminho(LOGO.substitui)) await remover([caminho(LOGO.substitui)]);
  Admin.log((MARCA ? "Editou a marca " : "Cadastrou a marca ") + nome + " na loja", linha.ativo ? "" : "Oculta");
  $("dlg-marca").close(); await carregar();
  Admin.toast(MARCA ? "Marca atualizada." : "Marca cadastrada.");
});
$("m-excluir").addEventListener("click", async () => {
  const m = MARCA; if (!m) return;
  if (PRODS.some((p) => p.marca_id === m.id)) return mostrarErro("dm-err", "Esta marca tem produtos. Exclua ou mova os produtos antes de excluir a marca.");
  if (!(await Admin.confirmDialog({ title: "Excluir marca?", message: "A marca “" + m.nome + "” e a logo serão apagadas definitivamente e a marca sai da loja. Essa ação não pode ser desfeita.", ok: "Excluir marca" }))) return;
  const { error } = await sb.from("marcas").delete().eq("id", m.id);
  if (error) return mostrarErro("dm-err", "Não foi possível excluir: " + error.message);
  if (caminho(m.logo)) await remover([caminho(m.logo)]);
  Admin.log("Excluiu a marca " + m.nome + " da loja");
  $("dlg-marca").close(); await carregar();
  Admin.toast("Marca excluída.");
});

/* ---------- Produto ---------- */
let EDIT = null, SLOTS = [], slotAtual = 0;
function desenharFotos() {
  const box = $("fotos"); box.replaceChildren();
  SLOTS.forEach((s, i) => {
    const b = el("button", "slot"); b.type = "button";
    b.setAttribute("aria-label", (s ? "Trocar" : "Escolher") + " a foto " + (i + 1));
    b.append(el("span", "n", String(i + 1)));
    if (s) { const img = el("img"); img.src = s.preview || s.url; img.alt = ""; b.appendChild(img); }
    else b.append("Escolher foto " + (i + 1));
    b.addEventListener("click", () => { slotAtual = i; $("file").click(); });
    box.appendChild(b);
  });
}
$("file").addEventListener("change", async (e) => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  if (!/^image\/(png|jpeg|webp)$/.test(f.type)) return mostrarErro("dlg-err", "Use imagens PNG, JPG ou WebP.");
  try {
    const blob = await prepararImagem(f, true);
    const antigo = SLOTS[slotAtual];
    if (antigo?.preview) URL.revokeObjectURL(antigo.preview);
    SLOTS[slotAtual] = { blob, preview: URL.createObjectURL(blob), substitui: antigo?.url || antigo?.substitui || null };
    mostrarErro("dlg-err", ""); desenharFotos();
  } catch { mostrarErro("dlg-err", "Não foi possível ler a imagem. Tente outra."); }
});
function abrirProduto(p, marcaId) {
  EDIT = p || null;
  $("dlg-t").textContent = p ? "Editar produto" : "Novo produto";
  $("marca").replaceChildren(...MARCAS.map((m) => { const o = el("option", null, m.nome); o.value = m.id; return o; }));
  $("marca").value = marcaId;
  $("nome").value = p?.nome ?? "";
  $("preco").value = p ? Number(p.preco).toFixed(2).replace(".", ",") : "";
  $("desconto").value = p?.desconto ? String(p.desconto) : "";
  $("link").value = p?.link ?? "";
  $("ativo").checked = p ? p.ativo : true;
  $("excluir").classList.toggle("hidden", !p);
  SLOTS = p ? p.fotos.map((url) => ({ url })) : [null, null, null];
  desenharFotos(); mostrarErro("dlg-err", "");
  $("dlg").showModal();
}
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const erro = (t) => mostrarErro("dlg-err", t);
  const marca_id = $("marca").value, nome = $("nome").value.trim(), link = $("link").value.trim();
  const preco = Number($("preco").value.trim().replace(/[^\d,.-]/g, "").replace(/\.(?=\d{3}(\D|$))/g, "").replace(",", "."));
  const desconto = $("desconto").value.trim() ? Number($("desconto").value.trim()) : 0;
  if (SLOTS.some((s) => !s)) return erro("Escolha as 3 fotos do produto.");
  if (!nome) return erro("Informe o nome do produto."), $("nome").focus();
  if (!$("preco").value.trim() || !isFinite(preco) || preco < 0) return erro("Informe um preço válido, por exemplo 149,90."), $("preco").focus();
  if (!Number.isInteger(desconto) || desconto < 0 || desconto > 99) return erro("O desconto deve ser um número de 0 a 99."), $("desconto").focus();
  if (!/^https?:\/\/\S+\.\S+/.test(link)) return erro("Informe o link de compra, começando com https://."), $("link").focus();
  const btn = $("salvar"); btn.disabled = true; btn.textContent = "Salvando…"; erro("");
  const fim = () => { btn.disabled = false; btn.textContent = "Salvar"; };
  // Envia as fotos novas; as substituídas são apagadas só depois de salvar.
  const fotos = [], enviadas = [], antigas = [];
  for (const [i, s] of SLOTS.entries()) {
    if (!s.blob) { fotos.push(s.url); continue; }
    const up = await enviar(s.blob);
    if (up.error) { await remover(enviadas); fim(); return erro("Não foi possível enviar a foto " + (i + 1) + ": " + up.error.message); }
    enviadas.push(up.path); fotos.push(up.url);
    if (caminho(s.substitui)) antigas.push(caminho(s.substitui));
  }
  const linha = { marca_id, nome, preco, desconto, link, fotos, ativo: $("ativo").checked, updated_at: new Date().toISOString() };
  const { error } = EDIT ? await sb.from("produtos").update(linha).eq("id", EDIT.id) : await sb.from("produtos").insert(linha);
  fim();
  if (error) { await remover(enviadas); return erro("Não foi possível salvar: " + error.message); }
  await remover(antigas);
  const marca = MARCAS.find((m) => m.id === marca_id)?.nome || "";
  Admin.log((EDIT ? "Editou o produto " : "Cadastrou o produto ") + nome + " na loja", marca + " · " + brl(preco) + (desconto ? " · " + desconto + "% de desconto" : "") + (linha.ativo ? "" : " · oculto"));
  $("dlg").close(); await carregar();
  Admin.toast(EDIT ? "Produto atualizado." : "Produto cadastrado.");
});
$("excluir").addEventListener("click", async () => {
  const p = EDIT; if (!p) return;
  if (!(await Admin.confirmDialog({ title: "Excluir produto?", message: "“" + p.nome + "” e as 3 fotos serão apagados definitivamente e o produto sai da loja. Essa ação não pode ser desfeita.", ok: "Excluir produto" }))) return;
  const { error } = await sb.from("produtos").delete().eq("id", p.id);
  if (error) return mostrarErro("dlg-err", "Não foi possível excluir: " + error.message);
  await remover(p.fotos.map(caminho).filter(Boolean));
  Admin.log("Excluiu o produto " + p.nome + " da loja", MARCAS.find((m) => m.id === p.marca_id)?.nome || "");
  $("dlg").close(); await carregar();
  Admin.toast("Produto excluído.");
});

Admin.init({ page: "loja", onReady: async () => {
  $("ic-novo").innerHTML = Admin.icon("bag");
  $("ic-novo").style.display = "inline-flex";
  $("nova-marca").addEventListener("click", () => abrirMarca(null));
  await carregar();
} });
</script>
</body>
