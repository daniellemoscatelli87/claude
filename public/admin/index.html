<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mensagens de contato | Área restrita</title>
<link rel="icon" type="image/png" href="/favicon-dm.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div class="wrap">
  <header>
    <a href="/"><img src="/logo-dm.png" alt="Dani Moscatelli | Experience Design Studio"></a>
    <button type="button" class="btn-ghost hidden" id="logout">Sair</button>
  </header>

  <section class="card login hidden" id="login">
    <span class="tag">Área restrita</span>
    <h1>Entrar</h1>
    <p class="muted">Digite o e-mail de administrador para receber um link de acesso.</p>
    <form id="login-form" novalidate>
      <label class="l" for="login-email">E-mail</label>
      <input type="email" id="login-email" autocomplete="email" required placeholder="seu@email.com">
      <button type="submit" class="btn-primary" id="login-btn">Enviar link de acesso</button>
      <p class="msg" id="login-msg" aria-live="polite"></p>
    </form>
  </section>

  <section class="card login hidden" id="denied">
    <span class="tag">Área restrita</span>
    <h1>Sem acesso</h1>
    <p class="muted">O e-mail <strong id="denied-email"></strong> não tem permissão para ver esta área.</p>
  </section>

  <main class="hidden" id="app">
    <nav class="menu" aria-label="Área restrita">
      <a href="/admin/" aria-current="page">Mensagens de contato</a>
      <a href="/admin/parceiros/">Rede de parceiros</a>
    </nav>
    <span class="tag">Área restrita</span>
    <h1>Mensagens de contato</h1>
    <p class="muted" id="count"></p>
    <p class="msg err hidden" id="load-err"></p>
    <div class="list" id="list"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/admin/admin.js"></script>
<script>
const SECOES = [{ title: "Contato", fields: [
  ["nome", "Nome completo"], ["email", "E-mail corporativo"], ["telefone", "Telefone / WhatsApp"],
  ["empresa", "Empresa"], ["cargo", "Cargo / Função"], ["tipo_negocio", "Meu negócio é..."],
  ["tipo_negocio_outro", "Outro (descrição)"], ["assunto", "Assunto"], ["mensagem", "Mensagem"],
  ["dias_preferidos", "Melhor dia da semana"], ["periodo", "Período de preferência"],
]}];

Admin.initAdmin(async () => {
  const { data, error } = await Admin.sb.from("contatos").select("*").order("created_at", { ascending: false });
  const err = document.getElementById("load-err");
  err.classList.toggle("hidden", !error);
  if (error) { err.textContent = "Não foi possível carregar as mensagens: " + error.message; return; }
  document.getElementById("count").textContent = data.length === 1 ? "1 mensagem recebida" : data.length + " mensagens recebidas";
  Admin.renderList(data, document.getElementById("list"), SECOES, (r) => [r.email, r.assunto].filter(Boolean).join(" · "));
});
</script>
</body>
</html>
