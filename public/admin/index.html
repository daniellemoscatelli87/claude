<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Início | Área restrita</title>
<link rel="icon" type="image/png" href="/favicon-dm.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
<style>
  .home { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 20px; align-items: start; }
  @media (max-width: 800px) { .home { grid-template-columns: 1fr; } }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .panel-head .ttl { display: flex; align-items: center; gap: 10px; }
  .panel-head .ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--red-tint); color: var(--red); }
  .panel-head .ic svg { width: 20px; height: 20px; }
  .panel-head .cnt { font-size: 12px; color: var(--muted); font-weight: 600; }
  .seeall { font-size: 13px; font-weight: 700; color: var(--red); text-decoration: none; white-space: nowrap; }
  .seeall:hover { text-decoration: underline; }
</style>
</head>
<body>
<main class="wrap hidden" id="app">
  <span class="tag">Área restrita</span>
  <h1 id="hello">Olá!</h1>
  <p class="muted">Veja as últimas mensagens de contato e candidaturas à Rede de Parceiros.</p>
  <p class="msg err hidden" id="load-err"></p>
  <div class="home">
    <section class="card" aria-labelledby="h-contato">
      <div class="panel-head">
        <div class="ttl"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>
          <div><h2 id="h-contato">Contato</h2><div class="cnt" id="cnt-contatos"></div></div></div>
        <a class="seeall" href="/admin/contatos/">Ver todos →</a>
      </div>
      <div class="rows" id="last-contatos"></div>
    </section>
    <section class="card" aria-labelledby="h-parceiros">
      <div class="panel-head">
        <div class="ttl"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2a5 5 0 0 1 5.5 5.8"/></svg></span>
          <div><h2 id="h-parceiros">Parceiros</h2><div class="cnt" id="cnt-parceiros"></div></div></div>
        <a class="seeall" href="/admin/parceiros/?aba=candidaturas">Ver todos →</a>
      </div>
      <div class="rows" id="last-parceiros"></div>
    </section>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/admin/admin.js"></script>
<script>
const LIMIT = 6;
const plural = (n, s, p) => n + " " + (n === 1 ? s : p);
Admin.init({ page: "inicio", onReady: async () => {
  const h = new Date().getHours();
  document.getElementById("hello").textContent = (h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite") + ", Dani!";
  const [c, p] = await Promise.all([
    Admin.sb.from("contatos").select("id, created_at, nome, assunto, empresa", { count: "exact" }).order("created_at", { ascending: false }).limit(LIMIT),
    Admin.sb.from("cadastros").select("id, created_at, nome, principal_especializacao, cidade_estado", { count: "exact" }).order("created_at", { ascending: false }).limit(LIMIT),
  ]);
  const err = c.error || p.error, box = document.getElementById("load-err");
  box.classList.toggle("hidden", !err);
  if (err) { box.textContent = "Não foi possível carregar os dados: " + err.message; return; }
  document.getElementById("cnt-contatos").textContent = plural(c.count, "mensagem recebida", "mensagens recebidas");
  document.getElementById("cnt-parceiros").textContent = plural(p.count, "candidatura", "candidaturas");
  const fill = (id, rows, href, sub, empty) => {
    const box = document.getElementById(id); box.replaceChildren();
    if (!rows.length) return box.appendChild(Admin.el("div", "empty", empty));
    rows.forEach((r) => box.appendChild(Admin.rowLink(href(r), r.nome, sub(r), r.created_at)));
  };
  fill("last-contatos", c.data, (r) => "/admin/contatos/?id=" + r.id, (r) => [r.assunto, r.empresa].filter(Boolean).join(" · "), "Nenhuma mensagem ainda.");
  fill("last-parceiros", p.data, (r) => "/admin/parceiros/?id=" + r.id, (r) => [r.principal_especializacao, r.cidade_estado].filter(Boolean).join(" · "), "Nenhuma candidatura ainda.");
}});
</script>
</body>
</html>
