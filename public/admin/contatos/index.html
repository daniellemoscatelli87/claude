<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Contato | Área restrita</title>
<link rel="icon" type="image/png" href="/favicon-dm.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
<style>
  .toolbar { display: flex; gap: 12px; align-items: center; margin: 20px 0 12px; flex-wrap: wrap; }
  .toolbar input { max-width: 420px; }
  #status { display: grid; gap: 12px; }
  .status-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .status-info, .status-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .status-meet { border-top: 1px solid var(--track); padding-top: 12px; }
  .status-meet .l { margin-top: 0; }
  #historico { margin-bottom: 12px; }
  .thread { display: grid; gap: 10px; margin: 12px 0 16px; }
  .bubble { border-radius: 14px; padding: 12px 14px; max-width: 92%; }
  .bubble.in { background: var(--track); justify-self: start; }
  .bubble.out { background: var(--red-tint); justify-self: end; }
  .bubble .who { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .bubble .txt { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
  .reply textarea { width: 100%; min-height: 140px; font: inherit; font-size: 14px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: #f8fafc; color: var(--dark); resize: vertical; outline: none; }
  .reply textarea:focus { border-color: var(--red); background: #fff; box-shadow: 0 0 0 3px rgb(212 77 77 / .15); }
  .reply .row-end { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
  .reply .to { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .meet-form { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .meet-form input { width: auto; flex: 1 1 200px; font: inherit; font-size: 14px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 12px; background: #f8fafc; color: var(--dark); }
</style>
</head>
<body>
<main class="wrap hidden" id="app">
  <div id="view-list">
    <h1>Contato</h1>
    <p class="muted" id="count"></p>
    <div class="toolbar"><input type="search" id="busca" placeholder="Buscar por nome, e-mail, empresa, assunto ou mensagem…" aria-label="Buscar mensagens">
      <select id="situacao" aria-label="Situação" style="max-width:220px"><option value="">Todas as mensagens</option><option value="pendentes">Não respondidas</option><option value="respondidas">Respondidas</option><option value="reunioes">Reuniões agendadas</option></select></div>
    <p class="msg err hidden" id="load-err"></p>
    <div class="card"><div class="rows" id="list"></div></div>
  </div>
  <div id="view-detail" class="hidden">
    <a class="back" href="/admin/contatos/">← Todas as mensagens</a>
    <div class="card status-bar" id="status"></div>
    <section class="card" id="historico"></section>
    <div id="detail"></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/admin/admin.js"></script>
<script>
const norm = (s) => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const badge = (r) => r.respondido_em ? Admin.el("span", "badge ok", "Respondida") : Admin.el("span", "badge pend", "Não respondida");
const pad = (n) => String(n).padStart(2, "0");
const toLocalInput = (iso) => { const d = new Date(iso); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };

async function save(r, fields) {
  const { data, error } = await Admin.sb.from("contatos").update(fields).eq("id", r.id).select("id, respondido_em, reuniao_em").maybeSingle();
  if (error || !data) { alert("Não foi possível atualizar a mensagem. Tente novamente."); return false; }
  r.respondido_em = data.respondido_em; r.reuniao_em = data.reuniao_em;
  return true;
}

// Barra de situação no detalhe: respondida / não respondida e reunião agendada (com data e hora).
function statusBar(r) {
  const bar = document.getElementById("status"); bar.replaceChildren();
  const line = (...kids) => { const d = Admin.el("div", "status-line"); d.append(...kids); return d; };
  const button = (cls, text, onClick) => {
    const b = Admin.el("button", cls, text); b.type = "button";
    b.addEventListener("click", async () => { b.disabled = true; if (await onClick()) statusBar(r); else b.disabled = false; });
    return b;
  };

  const info = Admin.el("div", "status-info"); info.appendChild(badge(r));
  if (r.respondido_em) info.appendChild(Admin.el("span", "when", "em " + Admin.fmtDate(r.respondido_em)));
  const respBtn = r.respondido_em
    ? (r.reuniao_em ? null : button("btn-ghost", "Marcar como não respondida", () => save(r, { respondido_em: null })))
    : button("btn-ok", "Marcar como respondida", () => save(r, { respondido_em: new Date().toISOString() }));
  bar.appendChild(line(info, ...(respBtn ? [respBtn] : [])));

  const meet = Admin.el("div", "status-info");
  if (r.reuniao_em) {
    meet.append(Admin.el("span", "badge meet", "Reunião agendada"), Admin.el("span", "when", "para " + Admin.fmtDate(r.reuniao_em)));
    const edit = button("btn-ghost", "Alterar data", async () => { r._editMeeting = true; return true; });
    const cancel = button("btn-ghost", "Cancelar reunião", () => save(r, { reuniao_em: null }));
    if (!r._editMeeting) {
      const actions = Admin.el("div", "status-actions"); actions.append(edit, cancel);
      bar.appendChild(line(meet, actions));
      return;
    }
  }
  const label = Admin.el("label", "l", r.reuniao_em ? "Nova data e hora da reunião" : "Agendar reunião");
  const input = Admin.el("input"); input.type = "datetime-local"; input.id = "reuniao"; label.htmlFor = "reuniao";
  if (r.reuniao_em) input.value = toLocalInput(r.reuniao_em);
  const ok = button("btn-ok", r.reuniao_em ? "Salvar nova data" : "Agendar reunião", async () => {
    if (!input.value) { alert("Informe a data e a hora da reunião."); return false; }
    const when = new Date(input.value).toISOString();
    const done = await save(r, { reuniao_em: when, respondido_em: r.respondido_em || new Date().toISOString() });
    if (done) r._editMeeting = false;
    return done;
  });
  const form = Admin.el("div", "meet-form"); form.append(input, ok);
  if (r._editMeeting) form.appendChild(button("btn-ghost", "Cancelar", async () => { r._editMeeting = false; return true; }));
  const box = Admin.el("div", "status-meet"); box.append(label, form);
  bar.appendChild(box);
}

// Histórico: a mensagem recebida e as respostas enviadas pela plataforma, com campo para responder.
async function historico(r) {
  const box = document.getElementById("historico");
  box.replaceChildren(Admin.el("h2", null, "Histórico"), Admin.el("p", "muted", "Carregando…"));
  const { data: respostas, error } = await Admin.sb.from("respostas").select("id, created_at, mensagem").eq("contato_id", r.id).order("created_at", { ascending: true });
  const thread = Admin.el("div", "thread");
  const bubble = (cls, who, text) => { const b = Admin.el("div", "bubble " + cls); b.append(Admin.el("div", "who", who), Admin.el("div", "txt", text || "")); return b; };
  thread.appendChild(bubble("in", (r.nome || "Contato") + " · " + Admin.fmtDate(r.created_at), r.mensagem));
  (respostas || []).forEach((x) => thread.appendChild(bubble("out", "Você · " + Admin.fmtDate(x.created_at), x.mensagem)));

  const form = Admin.el("form", "reply");
  const label = Admin.el("label", "l", "Responder"); label.htmlFor = "resposta";
  const ta = Admin.el("textarea"); ta.id = "resposta"; ta.placeholder = "Escreva sua resposta…";
  const to = Admin.el("span", "to", r.email ? "Para: " + r.email : "Este contato não informou e-mail.");
  const btn = Admin.el("button", "btn-ok", "Enviar resposta"); btn.type = "submit"; btn.disabled = !r.email;
  const msg = Admin.el("p", "msg"); msg.setAttribute("aria-live", "polite");
  const end = Admin.el("div", "row-end"); end.append(to, btn);
  form.append(label, ta, end, msg);
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const texto = ta.value.trim();
    msg.className = "msg";
    if (!texto) { msg.className = "msg err"; msg.textContent = "Escreva a resposta antes de enviar."; return; }
    btn.disabled = true; btn.textContent = "Enviando…";
    const { data, error } = await Admin.sb.functions.invoke("responder-contato", { body: { contato_id: r.id, mensagem: texto } });
    btn.disabled = false; btn.textContent = "Enviar resposta";
    if (error || !data?.resposta) {
      let detail = "";
      try { detail = (await error?.context?.json())?.error || ""; } catch {}
      msg.className = "msg err"; msg.textContent = "Não foi possível enviar a resposta." + (detail ? " " + detail : " Tente novamente.");
      return;
    }
    ta.value = "";
    thread.appendChild(bubble("out", "Você · " + Admin.fmtDate(data.resposta.created_at), data.resposta.mensagem));
    msg.textContent = "Resposta enviada para " + r.email + ".";
    if (!r.respondido_em) { r.respondido_em = data.respondido_em; statusBar(r); }
  });
  box.replaceChildren(Admin.el("h2", null, "Histórico"), thread);
  if (error) box.appendChild(Admin.el("p", "msg err", "Não foi possível carregar as respostas anteriores."));
  box.appendChild(form);
}

Admin.init({ page: "contatos", onReady: async () => {
  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  const err = document.getElementById("load-err");
  if (id) {
    document.getElementById("view-list").classList.add("hidden");
    document.getElementById("view-detail").classList.remove("hidden");
    const { data, error } = await Admin.sb.from("contatos").select("*").eq("id", id).maybeSingle();
    const box = document.getElementById("detail");
    if (error || !data) { document.getElementById("status").classList.add("hidden"); box.replaceChildren(Admin.el("div", "card empty", error ? "Não foi possível carregar a mensagem." : "Mensagem não encontrada.")); return; }
    statusBar(data);
    historico(data);
    Admin.markSeen("contatos", data);
    box.replaceChildren(Admin.detail(data, Admin.CONTATO_SECOES, "Recebida em " + Admin.fmtDate(data.created_at)));
    return;
  }
  const { data, error } = await Admin.sb.from("contatos").select("*").order("created_at", { ascending: false });
  err.classList.toggle("hidden", !error);
  if (error) { err.textContent = "Não foi possível carregar as mensagens: " + error.message; return; }
  const sel = document.getElementById("situacao");
  if (["pendentes", "respondidas", "reunioes"].includes(params.get("situacao"))) sel.value = params.get("situacao");
  const render = () => {
    const q = norm(document.getElementById("busca").value.trim());
    const sit = sel.value;
    const match = (r) => !sit || (sit === "reunioes" ? !!r.reuniao_em : (sit === "respondidas") === !!r.respondido_em);
    const rows = data.filter((r) => match(r) && (!q || ["nome", "email", "empresa", "assunto", "mensagem"].some((k) => norm(r[k]).includes(q))));
    document.getElementById("count").textContent = (q || sit ? rows.length + " de " : "") + data.length + (data.length === 1 ? " mensagem recebida" : " mensagens recebidas");
    const list = document.getElementById("list"); list.replaceChildren();
    if (!rows.length) return list.appendChild(Admin.el("div", "empty", data.length ? "Nenhuma mensagem encontrada." : "Nenhuma mensagem ainda."));
    rows.forEach((r) => list.appendChild(Admin.rowLink("/admin/contatos/?id=" + r.id, r.nome, [r.assunto, r.empresa, r.email].filter(Boolean).join(" · "), r.created_at, Admin.mailState(r), true)));
  };
  document.getElementById("busca").addEventListener("input", render);
  sel.addEventListener("change", render);
  render();
}});
</script>
</body>
</html>
