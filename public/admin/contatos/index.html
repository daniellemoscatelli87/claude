<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Contato | Área restrita</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
<style>
  .toolbar { display: flex; gap: 10px; align-items: center; margin: 20px 0 12px; }
  .toolbar input { flex: 1 1 auto; min-width: 0; max-width: 420px; }
  .toolbar select { flex: 0 1 auto; width: auto; max-width: 58%; }
  #status { display: grid; gap: 18px; }
  /* Cabeçalho da mensagem (acordeão) */
  #detail { margin-bottom: 12px; }
  .ch { padding: 0; overflow: hidden; }
  .ch-head { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; text-align: left; background: none; border: 0; border-radius: 0; padding: 16px 18px; color: var(--dark); font-weight: 400; }
  .ch-head:hover { background: #fbfbfc; }
  .ch-head .ini { width: 46px; height: 46px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 16px; }
  .ch-info { display: grid; gap: 2px; min-width: 0; }
  .ch-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .ch-name { font-weight: 800; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ch-when { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .ch-mail { font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ch-subj { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ch-chev { width: 32px; height: 32px; border-radius: 50%; background: var(--track); color: var(--muted); display: grid; place-items: center; transition: transform .2s; }
  .ch-chev svg { width: 18px; height: 18px; }
  .ch.open .ch-chev { transform: rotate(180deg); }
  .ch-body { border-top: 1px solid var(--track); padding: 4px 18px 12px; }
  /* Etapas */
  .steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); position: relative; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; position: relative; }
  .step:not(:first-child)::before { content: ""; position: absolute; top: 13px; right: 50%; width: 100%; height: 2px; background: var(--line); z-index: 0; }
  .step.done:not(:first-child)::before { background: var(--c); }
  .step .dot { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); background: #fff; display: grid; place-items: center; position: relative; z-index: 1; color: #fff; }
  .step .dot svg { width: 14px; height: 14px; }
  .step.done .dot { background: var(--c); border-color: var(--c); }
  .step .lbl { font-size: 12px; font-weight: 700; color: var(--muted); }
  .step.done .lbl { color: var(--c); }
  .step .dt { font-size: 11px; color: var(--muted); min-height: 14px; }
  .s-new { --c: var(--red); } .s-read { --c: #64748b; } .s-ans { --c: #1e7b45; } .s-meet { --c: #1a56c4; }
  /* Próxima ação */
  .next { border-top: 1px solid var(--track); padding-top: 16px; display: grid; gap: 12px; }
  .next .hint { margin: 0; font-size: 14px; color: var(--muted); }
  .next .acts { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .btn-line { background: #fff; border: 1px solid var(--line); color: var(--dark); border-radius: 12px; padding: 10px 16px; font-size: 14px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; }
  .btn-line:hover { border-color: var(--red); color: var(--red); }
  .link-muted, .link-danger { background: none; border: 0; padding: 8px 4px; font-size: 13px; font-weight: 600; color: var(--muted); text-decoration: underline; }
  .link-danger { color: var(--red); }
  .meet-card { display: flex; gap: 12px; align-items: center; background: #e8f0fe; color: #1a56c4; border-radius: 14px; padding: 14px 16px; }
  .meet-card .ic { width: 40px; height: 40px; border-radius: 12px; background: #fff; display: grid; place-items: center; flex-shrink: 0; }
  .meet-card .ic svg { width: 22px; height: 22px; }
  .meet-card .k, .meet-form > .k { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .meet-card .v { font-size: 16px; font-weight: 700; color: var(--dark); }
  .meet-card .v::first-letter { text-transform: uppercase; }
  .meet-form { display: grid; gap: 12px; background: #f8fafc; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .meet-form > .k { color: #1a56c4; }
  .meet-form .fields { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 10px; }
  .meet-form .fld { display: block; min-width: 0; }
  .meet-form .fld span { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  @media (max-width: 480px) { .meet-form .fields { grid-template-columns: 1fr; } }
  .btn-meet { background: #1a56c4; color: #fff; border-radius: 12px; padding: 10px 18px; font-size: 14px; }
  .btn-meet:hover { background: #15479f; }
  a.btn-meet { display: inline-flex; align-items: center; text-decoration: none; }
  .btn-meet:disabled { opacity: .6; cursor: wait; }
  .meet-form input { min-width: 0; width: 100%; font: inherit; font-size: 14px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--dark); min-height: 44px; }
  .meet-form input:focus { outline: none; border-color: #1a56c4; box-shadow: 0 0 0 3px rgb(26 86 196 / .15); }
  #historico { margin-bottom: 12px; }
  .del-card .k { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--red); }
  .del-card p { margin: 6px 0 12px; font-size: 13px; }
  .btn-danger { background: #fff; color: var(--red); border: 1px solid var(--red); border-radius: 999px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-danger:hover { background: var(--red-tint); }
  .btn-danger:disabled { opacity: .6; cursor: wait; }
  /* Painel lateral da reunião */
  .mt-drawer { width: min(460px, 94vw); }
  .mt-body { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 22px 20px 32px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-content: start; }
  .mt-body h2 { margin: 0; padding-right: 36px; }
  .mt-who { margin: -8px 0 0; font-size: 13px; }
  .mt-body .fields { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 10px; }
  .mt-body .fld { display: block; min-width: 0; }
  .mt-body .fld span, .mt-link .lbl { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .mt-body input, .mt-body select, .mt-body textarea { min-width: 0; width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--dark); min-height: 44px; }
  .mt-body textarea { resize: vertical; }
  #mt-close { top: 6px; right: 6px; width: 48px; height: 48px; z-index: 2; display: grid; place-items: center; touch-action: manipulation; }
  #mt-close svg { width: 22px; height: 22px; }
  /* iPhone: data e hora têm largura própria e invadem a coluna vizinha sem isto. */
  .mt-body input[type="date"], .mt-body input[type="time"] { -webkit-appearance: none; appearance: none; display: block; text-align: left; }
  .mt-body input::-webkit-date-and-time-value { text-align: left; }
  .mt-body input:focus, .mt-body select:focus, .mt-body textarea:focus { outline: none; border-color: #1a56c4; box-shadow: 0 0 0 3px rgb(26 86 196 / .15); }
  .mt-link { background: #f0f5ff; border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .mt-link-row button { flex-shrink: 0; }
  .mt-link p { margin: 0; font-size: 13px; }
  .mt-link-row { display: flex; gap: 8px; align-items: center; }
  .mt-link-row a { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #1a56c4; font-weight: 700; text-decoration: none; }
  .mt-gcal { font-size: 13px; font-weight: 600; color: #1a56c4; text-decoration: none; }
  .mt-acts { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .mt-foot { margin: 0; font-size: 12px; }
  .mt-notice { background: #f0f5ff; border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
  .mt-notice p { margin: 0; font-size: 14px; }
  .thread { display: grid; gap: 10px; margin: 12px 0 16px; }
  .bubble { border-radius: 14px; padding: 12px 14px; max-width: 92%; }
  .bubble.in { background: var(--track); justify-self: start; }
  .bubble.out { background: var(--red-tint); justify-self: end; }
  .bubble .who { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .bubble .txt { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
  .reply textarea { width: 100%; min-height: 140px; font: inherit; font-size: 14px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: #f8fafc; color: var(--dark); resize: vertical; outline: none; }
  .reply textarea:focus { border-color: var(--red); background: #fff; box-shadow: 0 0 0 3px rgb(212 77 77 / .15); }
  .reply .row-end { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
  .reply .to { display: block; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; margin-top: 8px; }
  .ev { justify-self: center; font-size: 12px; color: var(--muted); background: #fff; border: 1px dashed var(--line); border-radius: 999px; padding: 4px 12px; text-align: center; }
  .bubble .imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 6px; margin-top: 8px; }
  .bubble .imgs img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; display: block; background: #fff; }
  .bubble .full { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .bubble .full summary { cursor: pointer; font-weight: 600; }
  .bubble .full .txt { margin-top: 6px; font-size: 13px; }
  .bubble .files { display: grid; gap: 4px; margin-top: 8px; font-size: 13px; }
  .bubble .files a { color: var(--red); overflow-wrap: anywhere; }
  .attach { gap: 8px; cursor: pointer; }
  .attach svg { width: 18px; height: 18px; }
  .chips { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; margin-top: 8px; }
  .chips:empty { display: none; }
  .chip { display: flex; align-items: center; gap: 10px; min-width: 0; border: 1px solid var(--line); border-radius: 12px; padding: 6px 8px; background: #fff; font-size: 13px; }
  .chip img { width: 40px; height: 40px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
  .chip .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .sz { flex-shrink: 0; color: var(--muted); font-size: 12px; }
  .chip button { border: 0; background: var(--track); color: var(--muted); width: 28px; height: 28px; padding: 0; border-radius: 50%; font-size: 18px; line-height: 1; }
  .chip button:hover { color: var(--red); }
</style>
</head>
<body>
<main class="wrap hidden" id="app">
  <div id="view-list">
    <h1>Contato</h1>
    <p class="muted" id="count"></p>
    <div class="toolbar"><input type="search" id="busca" placeholder="Buscar" title="Buscar por nome, e-mail, empresa, assunto ou mensagem" aria-label="Buscar por nome, e-mail, empresa, assunto ou mensagem">
      <select id="situacao" aria-label="Situação"><option value="">Todas as mensagens</option><option value="pendentes">Não respondidas</option><option value="respondidas">Respondidas</option><option value="reunioes">Reuniões agendadas</option></select></div>
    <p class="msg err hidden" id="load-err"></p>
    <div class="card"><div class="rows" id="list"></div></div>
  </div>
  <div id="view-detail" class="hidden">
    <a class="back" href="/admin/contatos/">← Todas as mensagens</a>
    <div id="detail"></div>
    <div class="card status-bar" id="status"></div>
    <section class="card" id="historico"></section>
  </div>
</main>
<div class="backdrop" id="mt-backdrop"></div>
<aside class="drawer mt-drawer" id="mt-drawer" aria-label="Reunião">
  <button type="button" class="close" id="mt-close" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  <div class="mt-body" id="mt-body"></div>
</aside>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/admin/admin.js"></script>
<script>
const norm = (s) => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const pad = (n) => String(n).padStart(2, "0");
const toLocalInput = (iso) => { const d = new Date(iso); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };

async function save(r, fields) {
  const { data, error } = await Admin.sb.from("contatos").update(fields).eq("id", r.id).select("id, respondido_em, reuniao_em").maybeSingle();
  if (error || !data) { alert("Não foi possível atualizar a mensagem. Tente novamente."); return false; }
  r.respondido_em = data.respondido_em; r.reuniao_em = data.reuniao_em;
  historico(r); // mostra a mudança registrada no histórico
  return true;
}

// Situação da mensagem: etapas (recebida, lida, respondida, reunião) e a próxima ação, uma de cada vez.
const fmtMeeting = (iso) => { const d = new Date(iso); return d.toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long" }) + " às " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); };
const STEPS = [
  { key: "created_at", label: "Recebida", cls: "s-new" },
  { key: "visualizado_em", label: "Lida", cls: "s-read" },
  { key: "respondido_em", label: "Respondida", cls: "s-ans" },
  { key: "reuniao_em", label: "Reunião", cls: "s-meet" },
];

function statusBar(r) {
  const bar = document.getElementById("status"); bar.replaceChildren();
  const button = (cls, text, onClick) => {
    const b = Admin.el("button", cls, text); b.type = "button";
    b.addEventListener("click", async () => { b.disabled = true; if (await onClick()) statusBar(r); else b.disabled = false; });
    return b;
  };

  // Linha de etapas
  const steps = Admin.el("ol", "steps");
  STEPS.forEach((st) => {
    const done = !!r[st.key];
    const li = Admin.el("li", "step " + st.cls + (done ? " done" : ""));
    const dot = Admin.el("span", "dot"); dot.innerHTML = done ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>' : "";
    const when = done ? (st.key === "reuniao_em" ? new Date(r.reuniao_em).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) : new Date(r[st.key]).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" })) : "";
    li.append(dot, Admin.el("span", "lbl", st.label), Admin.el("span", "dt", when));
    steps.appendChild(li);
  });
  bar.appendChild(steps);

  // Próxima ação
  const next = Admin.el("div", "next");
  if (r.reuniao_em) {
    const card = Admin.el("div", "meet-card");
    const ic = Admin.el("span", "ic"); ic.innerHTML = Admin.icon("meeting");
    const txt = Admin.el("div"); txt.append(Admin.el("div", "k", "Reunião agendada"), Admin.el("div", "v", fmtMeeting(r.reuniao_em)));
    card.append(ic, txt);
    const acts = Admin.el("div", "acts");
    if (r._reuniao?.meet_link) { const m = Admin.el("a", "btn-meet", "Entrar no Google Meet"); m.href = r._reuniao.meet_link; m.target = "_blank"; m.rel = "noopener noreferrer"; acts.appendChild(m); }
    const ed = Admin.el("button", "btn-line", "Editar reunião"); ed.type = "button"; ed.addEventListener("click", () => openMeeting(r));
    acts.appendChild(ed);
    next.append(card, acts);
  } else if (!r.respondido_em) {
    next.append(Admin.el("p", "hint", "Responda pelo histórico abaixo. A mensagem é marcada como respondida automaticamente."));
    const acts = Admin.el("div", "acts");
    acts.append(meetingToggle(r));
    next.appendChild(acts);
  } else {
    next.append(Admin.el("p", "hint", "Respondida em " + Admin.fmtDate(r.respondido_em) + ". Próximo passo: agendar a reunião."));
    const acts = Admin.el("div", "acts");
    acts.append(meetingToggle(r, "btn-ok"), button("link-muted", "Desfazer resposta", () => save(r, { respondido_em: null })));
    next.appendChild(acts);
  }
  bar.appendChild(next);
}

function meetingToggle(r, cls = "btn-line") {
  const b = Admin.el("button", cls, r._reuniao ? "Continuar agendamento" : "Agendar reunião"); b.type = "button";
  b.addEventListener("click", () => openMeeting(r));
  return b;
}

// E-mail ao contato com o motivo do cancelamento da reunião (vai pelo envio de respostas, com a assinatura).
async function avisarCancelamento(r, motivo, titulo, quando) {
  const nome = (r.nome || "").trim().split(/\s+/)[0];
  const texto = (nome ? "Olá, " + nome + ".\n\n" : "") + "A reunião" + (titulo ? " \u201c" + titulo + "\u201d" : "") + (quando ? ", marcada para " + new Date(quando).toLocaleString("pt-BR", { dateStyle: "long", timeStyle: "short" }) + "," : "") + " foi cancelada.\n\nMotivo: " + motivo;
  const { data, error } = await Admin.sb.functions.invoke("responder-contato", { body: { contato_id: r.id, mensagem: texto, anexos: [] } });
  return !error && !!data?.resposta;
}

// Exclusão da mensagem de contato (e de tudo ligado a ela: histórico, respostas, anexos e reunião).
function deleteCard(r) {
  const c = Admin.el("section", "card del-card");
  c.append(Admin.el("div", "k", "Excluir mensagem"), Admin.el("p", "muted", "Apaga a mensagem, o histórico de respostas, os anexos e a reunião agendada (o convidado é avisado do cancelamento)."));
  const btn = Admin.el("button", "btn-danger", "Excluir mensagem"); btn.type = "button";
  const msg = Admin.el("p", "msg err hidden");
  btn.addEventListener("click", async () => {
    const reu = r._reuniao, agendada = reu?.status === "agendada" || (!!r.reuniao_em && !reu);
    const base = "A mensagem de " + (r.nome || "este contato") + " e todo o histórico serão apagados definitivamente. Essa ação não pode ser desfeita.";
    const motivo = await Admin.confirmDialog(agendada && r.email
      ? { title: "Excluir mensagem?", message: base + " A reunião agendada será cancelada e " + r.email + " receberá um e-mail com o motivo.", ok: "Excluir mensagem", field: { label: "Motivo do cancelamento da reunião", placeholder: "Ex.: precisei remarcar por um imprevisto na agenda.", required: true } }
      : { title: "Excluir mensagem?", message: base, ok: "Excluir mensagem" });
    if (motivo === false) return;
    btn.disabled = true; btn.textContent = "Excluindo…"; msg.classList.add("hidden");
    const fail = (t) => { btn.disabled = false; btn.textContent = "Excluir mensagem"; msg.textContent = t; msg.classList.remove("hidden"); };
    let semEmail = false;
    if (reu || r.reuniao_em) {
      const res = await agenda({ acao: "excluir", contato_id: r.id });
      if (res.error && res.error !== "google_desconectado") return fail("Não foi possível cancelar a reunião no Google Agenda: " + erroAgenda(res.error));
      // O e-mail com o motivo sai antes de apagar a mensagem, enquanto o contato ainda existe.
      if (typeof motivo === "string" && motivo) semEmail = !(await avisarCancelamento(r, motivo, reu?.titulo || "", reu?.inicio || r.reuniao_em));
    }
    for (const pasta of ["respostas", "recebidas"]) {
      const { data: files } = await Admin.sb.storage.from("anexos").list(pasta + "/" + r.id, { limit: 1000 });
      if (files?.length) await Admin.sb.storage.from("anexos").remove(files.map((f) => pasta + "/" + r.id + "/" + f.name));
    }
    const { data: del, error } = await Admin.sb.from("contatos").delete().eq("id", r.id).select("id");
    if (error || !del?.length) return fail("Não foi possível excluir a mensagem" + (error ? ": " + error.message : "."));
    Admin.toast(semEmail ? "Mensagem excluída, mas não foi possível enviar o e-mail com o motivo do cancelamento." : "Mensagem excluída com sucesso.", "/admin/contatos/");
  });
  c.append(btn, msg);
  return c;
}

/* ---------- Reunião no Google Agenda (painel lateral) ---------- */
// Data/hora, duração, título, descrição e link do Meet gerado pelo Google; "Enviar convite" cria o evento
// no Google Agenda com o contato como convidado. Alterar avisa o convidado; excluir cancela o evento.
let GOOGLE = null;
async function agenda(body) {
  const { data, error } = await Admin.sb.functions.invoke("google-agenda", { body });
  if (!error) return data || {};
  let m = "falha"; try { m = (await error.context.json()).error || m; } catch {}
  return { error: m };
}
const ERRO_AGENDA = {
  google_desconectado: "Sua conta Google não está conectada ou a conexão expirou. Conecte novamente.",
  sem_credenciais: "Falta configurar as credenciais do Google (GOOGLE_CLIENT_ID e GOOGLE_CLIENT_SECRET) no Supabase.",
  falha: "Não foi possível falar com o Google Agenda. Tente novamente.",
};
const erroAgenda = (e) => ERRO_AGENDA[e] || e;
let mtY = 0;
function closeMeeting() {
  const d = document.getElementById("mt-drawer"); if (!d.classList.contains("open")) return;
  d.classList.remove("open"); document.getElementById("mt-backdrop").classList.remove("open");
  document.body.classList.remove("scroll-lock"); document.body.style.top = ""; window.scrollTo(0, mtY);
}
async function openMeeting(r) {
  const body = document.getElementById("mt-body"); body.replaceChildren(Admin.el("p", "muted", "Carregando…"));
  mtY = window.scrollY; document.body.style.top = -mtY + "px"; document.body.classList.add("scroll-lock");
  document.getElementById("mt-drawer").classList.add("open"); document.getElementById("mt-backdrop").classList.add("open");
  if (!GOOGLE) GOOGLE = await agenda({ acao: "status" });
  renderMeeting(r);
}
function renderMeeting(r) {
  const body = document.getElementById("mt-body"); body.replaceChildren();
  const reu = r._reuniao, agendada = reu?.status === "agendada" || (!!r.reuniao_em && !reu);
  body.append(Admin.el("h2", null, agendada ? "Reunião agendada" : "Agendar reunião"), Admin.el("p", "muted mt-who", [r.nome, r.email].filter(Boolean).join(" · ")));
  if (GOOGLE?.error || !GOOGLE?.conectado) {
    const box = Admin.el("div", "mt-notice");
    box.appendChild(Admin.el("p", null, GOOGLE?.configurado === false ? ERRO_AGENDA.sem_credenciais : "Conecte sua conta Google para gerar o link do Meet e enviar o convite pelo Google Agenda."));
    if (GOOGLE?.configurado !== false) {
      const c = Admin.el("button", "btn-meet", "Conectar Google Agenda"); c.type = "button";
      c.addEventListener("click", async () => { c.disabled = true; const res = await agenda({ acao: "conectar" }); if (res.url) location.href = res.url; else { c.disabled = false; box.appendChild(Admin.el("p", "msg err", erroAgenda(res.error))); } });
      box.appendChild(c);
    }
    body.appendChild(box);
    return;
  }
  const field = (label, input) => { const w = Admin.el("label", "fld"); w.append(Admin.el("span", null, label), input); return w; };
  const ini = reu?.inicio || r.reuniao_em;
  const date = Admin.el("input"); date.type = "date"; date.min = toLocalInput(new Date().toISOString()).slice(0, 10);
  const hour = Admin.el("input"); hour.type = "time";
  if (ini) { const v = toLocalInput(ini); date.value = v.slice(0, 10); hour.value = v.slice(11); } else hour.value = "10:00";
  const dur = Admin.el("select"); [[30, "30 min"], [45, "45 min"], [60, "1 hora"], [90, "1h30"], [120, "2 horas"]].forEach(([m, t]) => dur.append(new Option(t, String(m))));
  dur.value = String(reu?.duracao_min || 60);
  const title = Admin.el("input"); title.type = "text"; title.maxLength = 200; title.value = reu?.titulo || "Reunião com " + (r.nome || "contato") + (r.empresa ? " (" + r.empresa + ")" : "") + " | Dani Moscatelli";
  const subj = Admin.el("input"); subj.type = "text"; subj.maxLength = 300; subj.value = reu ? (reu.assunto ?? "") : (r.assunto || "");
  const desc = Admin.el("textarea"); desc.rows = 5; desc.maxLength = 5000; desc.value = reu?.descricao ?? "";
  const grid = Admin.el("div", "fields"); grid.append(field("Data", date), field("Horário", hour));
  body.append(grid, field("Duração", dur), field("Título", title), field("Assunto", subj), field("Descrição", desc));
  // Link do Meet
  const linkBox = Admin.el("div", "mt-link");
  linkBox.appendChild(Admin.el("span", "lbl", "Link da reunião (Google Meet)"));
  const msg = Admin.el("p", "msg err hidden");
  const values = () => {
    if (!date.value || !hour.value) { msg.textContent = "Escolha a data e o horário."; msg.classList.remove("hidden"); return null; }
    return { contato_id: r.id, inicio: new Date(date.value + "T" + hour.value).toISOString(), duracao_min: Number(dur.value), titulo: title.value.trim(), assunto: subj.value.trim(), descricao: desc.value.trim() };
  };
  const run = async (btn, label, payload, after) => {
    msg.classList.add("hidden"); btn.disabled = true; const old = btn.textContent; btn.textContent = label;
    const res = await agenda(payload);
    btn.disabled = false; btn.textContent = old;
    if (res.error) { msg.textContent = erroAgenda(res.error); msg.classList.remove("hidden"); if (res.error === "google_desconectado") { GOOGLE = { configurado: true, conectado: false }; } return; }
    after(res);
  };
  if (reu?.meet_link) {
    const row = Admin.el("div", "mt-link-row");
    const a = Admin.el("a", null, reu.meet_link.replace(/^https?:\/\//, "")); a.href = reu.meet_link; a.target = "_blank"; a.rel = "noopener noreferrer";
    const cp = Admin.el("button", "btn-line", "Copiar"); cp.type = "button";
    cp.addEventListener("click", async () => { try { await navigator.clipboard.writeText(reu.meet_link); cp.textContent = "Copiado"; setTimeout(() => (cp.textContent = "Copiar"), 1500); } catch {} });
    row.append(a, cp); linkBox.appendChild(row);
    if (reu.evento_link) { const g = Admin.el("a", "mt-gcal", "Abrir no Google Agenda →"); g.href = reu.evento_link; g.target = "_blank"; g.rel = "noopener noreferrer"; linkBox.appendChild(g); }
  } else {
    linkBox.appendChild(Admin.el("p", "muted", "O link é criado pelo Google ao gerar a reunião."));
    const gen = Admin.el("button", "btn-line", "Gerar link do Meet"); gen.type = "button";
    gen.addEventListener("click", () => { const v = values(); if (v) run(gen, "Gerando…", { acao: "salvar", ...v, enviar: false }, (res) => { r._reuniao = res.reuniao; renderMeeting(r); statusBar(r); }); });
    linkBox.appendChild(gen);
  }
  body.append(linkBox, msg);
  const acts = Admin.el("div", "mt-acts");
  const send = Admin.el("button", "btn-meet", agendada ? "Salvar e avisar o convidado" : "Enviar convite"); send.type = "button";
  send.addEventListener("click", () => {
    const v = values(); if (!v) return;
    run(send, agendada ? "Salvando…" : "Enviando…", { acao: "salvar", ...v, enviar: true }, (res) => {
      r._reuniao = res.reuniao; r.reuniao_em = res.reuniao.inicio; r.respondido_em = r.respondido_em || res.reuniao.updated_at;
      closeMeeting(); statusBar(r); historico(r);
    });
  });
  acts.appendChild(send);
  if (reu || r.reuniao_em) {
    const del = Admin.el("button", "link-danger", agendada ? "Excluir reunião" : "Descartar"); del.type = "button";
    del.addEventListener("click", async () => {
      const motivo = await Admin.confirmDialog(agendada
        ? { title: "Excluir reunião?", message: "O evento será cancelado no Google Agenda e " + (r.email || "o convidado") + " receberá um e-mail com o motivo do cancelamento.", ok: "Excluir reunião", field: { label: "Motivo do cancelamento", placeholder: "Ex.: precisei remarcar por um imprevisto na agenda.", required: true } }
        : { title: "Descartar rascunho?", message: "O rascunho e o link do Meet gerado serão apagados.", ok: "Descartar" });
      if (motivo === false) return;
      const quando = reu?.inicio || r.reuniao_em, tituloReu = reu?.titulo || "";
      run(del, "Excluindo…", { acao: "excluir", contato_id: r.id }, async () => {
        r._reuniao = null; r.reuniao_em = null; closeMeeting(); statusBar(r);
        let aviso = agendada ? "Reunião excluída com sucesso." : "Rascunho descartado com sucesso.";
        if (agendada && r.email && typeof motivo === "string") {
          const ok = await avisarCancelamento(r, motivo, tituloReu, quando);
          aviso = ok ? "Reunião excluída com sucesso. O motivo foi enviado para " + r.email + "." : "Reunião excluída, mas não foi possível enviar o e-mail com o motivo.";
        }
        historico(r); Admin.toast(aviso);
      });
    });
    acts.appendChild(del);
  }
  body.appendChild(acts);
  if (r.email) body.appendChild(Admin.el("p", "muted mt-foot", agendada ? "Ao salvar, " + r.email + " recebe a atualização pelo Google Agenda." : "Ao enviar, " + r.email + " recebe o convite do Google Agenda com o link do Meet."));
}

// Cabeçalho da mensagem em acordeão: fechado mostra nome, e-mail, data/hora e assunto;
// aberto mostra todos os dados enviados pelo formulário.
function contactHeader(r) {
  const card = Admin.el("section", "card ch");
  const head = Admin.el("button", "ch-head"); head.type = "button"; head.setAttribute("aria-expanded", "false"); head.setAttribute("aria-controls", "ch-body");
  const info = Admin.el("span", "ch-info");
  const top = Admin.el("span", "ch-top"); top.append(Admin.el("span", "ch-name", r.nome || "Sem nome"), Admin.el("span", "ch-when", Admin.fmtDate(r.created_at)));
  info.append(top, Admin.el("span", "ch-mail", r.email || "Sem e-mail"), Admin.el("span", "ch-subj", r.assunto || "Sem assunto"));
  const chev = Admin.el("span", "ch-chev"); chev.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
  head.append(Admin.el("span", "ini", Admin.initials(r.nome)), info, chev);
  const body = Admin.el("div", "ch-body hidden"); body.id = "ch-body";
  const full = Admin.detail(r, Admin.CONTATO_SECOES, "");
  full.classList.remove("card"); full.querySelector(".detail-head")?.remove();
  body.appendChild(full);
  head.addEventListener("click", () => {
    const open = body.classList.toggle("hidden") === false;
    head.setAttribute("aria-expanded", String(open));
    card.classList.toggle("open", open);
  });
  card.append(head, body);
  return card;
}

// Histórico completo: mensagem recebida, respostas enviadas (com imagens) e cada mudança de situação,
// em ordem cronológica. Abaixo, o campo para responder com anexos de imagem.
const EVENTOS = {
  lida: () => "Mensagem aberta",
  respondida: () => "Marcada como respondida",
  resposta_desfeita: () => "Resposta desfeita",
  reuniao_agendada: (d) => "Reunião agendada para " + fmtMeeting(d),
  reuniao_alterada: (d) => "Reunião remarcada para " + fmtMeeting(d),
  reuniao_cancelada: () => "Reunião cancelada",
};
const MAX_ANEXOS = 10, MAX_MB = 10;
const fmtSize = (n) => (n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB");
const safeName = (n) => n.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^\w.-]+/g, "-").slice(-80);

async function historico(r) {
  const box = document.getElementById("historico");
  box.replaceChildren(Admin.el("h2", null, "Histórico"), Admin.el("p", "muted", "Carregando…"));
  const [resp, evs, rec] = await Promise.all([
    Admin.sb.from("respostas").select("id, created_at, mensagem, anexos").eq("contato_id", r.id).order("created_at", { ascending: true }),
    Admin.sb.from("contato_eventos").select("id, created_at, tipo, detalhe").eq("contato_id", r.id).order("created_at", { ascending: true }),
    Admin.sb.from("mensagens_recebidas").select("id, created_at, texto, texto_completo, anexos").eq("contato_id", r.id).order("created_at", { ascending: true }),
  ]);
  const respostas = resp.data || [], eventos = evs.data || [], recebidas = rec.data || [];

  // Links temporários para ver as imagens enviadas (o bucket é privado).
  const paths = [...respostas, ...recebidas].flatMap((x) => (x.anexos || []).map((a) => a.path));
  const urls = {};
  if (paths.length) {
    const { data } = await Admin.sb.storage.from("anexos").createSignedUrls(paths, 3600);
    (data || []).forEach((u) => { if (u.signedUrl) urls[u.path] = u.signedUrl; });
  }

  const items = [
    { at: r.created_at, kind: "in" },
    ...respostas.map((x) => ({ at: x.created_at, kind: "out", x })),
    ...recebidas.map((x) => ({ at: x.created_at, kind: "in", x })),
    ...eventos.map((x) => ({ at: x.created_at, kind: "ev", x })),
  ].sort((a, b) => new Date(a.at) - new Date(b.at));

  const thread = Admin.el("div", "thread");
  for (const it of items) {
    if (it.kind === "ev") {
      const f = EVENTOS[it.x.tipo];
      thread.appendChild(Admin.el("div", "ev", (f ? f(it.x.detalhe) : it.x.tipo) + " · " + Admin.fmtDate(it.at)));
      continue;
    }
    const b = Admin.el("div", "bubble " + it.kind);
    b.appendChild(Admin.el("div", "who", (it.kind === "in" ? r.nome || "Contato" : "Você") + " · " + Admin.fmtDate(it.at)));
    const text = !it.x ? r.mensagem : it.kind === "in" ? it.x.texto : it.x.mensagem;
    if (text) b.appendChild(Admin.el("div", "txt", text));
    // Resposta recebida por e-mail: permite ver o e-mail inteiro, com o trecho citado.
    if (it.x?.texto_completo && it.x.texto_completo.trim() !== (it.x.texto || "").trim()) {
      const more = Admin.el("details", "full");
      more.append(Admin.el("summary", null, "Ver e-mail completo"), Admin.el("div", "txt", it.x.texto_completo));
      b.appendChild(more);
    }
    const anexos = it.x?.anexos || [];
    const imagens = anexos.filter((a) => (a.type || "").startsWith("image/"));
    const outros = anexos.filter((a) => !(a.type || "").startsWith("image/"));
    if (outros.length) {
      const l = Admin.el("div", "files");
      outros.forEach((a) => { const link = Admin.el("a", null, "📎 " + a.name); link.href = urls[a.path] || "#"; link.target = "_blank"; link.rel = "noopener"; l.appendChild(link); });
      b.appendChild(l);
    }
    if (imagens.length) {
      const g = Admin.el("div", "imgs");
      imagens.forEach((a) => {
        const link = Admin.el("a"); link.href = urls[a.path] || "#"; link.target = "_blank"; link.rel = "noopener"; link.title = a.name;
        const img = Admin.el("img"); img.src = urls[a.path] || ""; img.alt = a.name; img.loading = "lazy";
        link.appendChild(img); g.appendChild(link);
      });
      b.appendChild(g);
    }
    thread.appendChild(b);
  }

  // Formulário de resposta
  const form = Admin.el("form", "reply");
  const label = Admin.el("label", "l", "Responder"); label.htmlFor = "resposta";
  const ta = Admin.el("textarea"); ta.id = "resposta"; ta.placeholder = "Escreva sua resposta…";
  const files = [];
  const picker = Admin.el("input"); picker.type = "file"; picker.accept = "image/*"; picker.multiple = true; picker.id = "anexos"; picker.className = "hidden";
  const attach = Admin.el("label", "btn-line attach"); attach.htmlFor = "anexos"; attach.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>Anexar imagem';
  const chips = Admin.el("div", "chips");
  const msg = Admin.el("p", "msg"); msg.setAttribute("aria-live", "polite");
  const renderChips = () => {
    chips.replaceChildren();
    files.forEach((f, i) => {
      const c = Admin.el("div", "chip");
      const im = Admin.el("img"); im.src = URL.createObjectURL(f); im.alt = "";
      const rm = Admin.el("button", null, "×"); rm.type = "button"; rm.setAttribute("aria-label", "Remover " + f.name);
      rm.addEventListener("click", () => { files.splice(i, 1); renderChips(); });
      c.append(im, Admin.el("span", "nm", f.name), Admin.el("span", "sz", fmtSize(f.size)), rm);
      chips.appendChild(c);
    });
  };
  picker.addEventListener("change", () => {
    msg.className = "msg"; msg.textContent = "";
    for (const f of picker.files) {
      if (!f.type.startsWith("image/")) { msg.className = "msg err"; msg.textContent = "Só é possível anexar imagens."; continue; }
      if (f.size > MAX_MB * 1048576) { msg.className = "msg err"; msg.textContent = f.name + " passa de " + MAX_MB + " MB."; continue; }
      if (files.length >= MAX_ANEXOS) { msg.className = "msg err"; msg.textContent = "Máximo de " + MAX_ANEXOS + " imagens por resposta."; break; }
      files.push(f);
    }
    picker.value = "";
    renderChips();
  });
  const to = Admin.el("span", "to", r.email ? "Para: " + r.email + " · Sua assinatura é incluída automaticamente no final do e-mail." : "Este contato não informou e-mail.");
  const btn = Admin.el("button", "btn-ok", "Enviar resposta"); btn.type = "submit"; btn.disabled = !r.email;
  const tools = Admin.el("div", "row-end"); tools.append(attach, btn);
  form.append(label, ta, picker, chips, tools, to, msg);
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const texto = ta.value.trim();
    msg.className = "msg";
    if (!texto && !files.length) { msg.className = "msg err"; msg.textContent = "Escreva a resposta ou anexe uma imagem."; return; }
    btn.disabled = true;
    const fail = (t) => { btn.disabled = false; btn.textContent = "Enviar resposta"; msg.className = "msg err"; msg.textContent = t; };
    const anexos = [];
    for (const [i, f] of files.entries()) {
      btn.textContent = "Enviando imagem " + (i + 1) + " de " + files.length + "…";
      const path = "respostas/" + r.id + "/" + Date.now() + "-" + i + "-" + safeName(f.name);
      const { error } = await Admin.sb.storage.from("anexos").upload(path, f, { contentType: f.type, upsert: false });
      if (error) return fail("Não foi possível enviar a imagem " + f.name + ". Tente novamente.");
      anexos.push({ path, name: f.name, type: f.type, size: f.size });
    }
    btn.textContent = "Enviando…";
    const { data, error } = await Admin.sb.functions.invoke("responder-contato", { body: { contato_id: r.id, mensagem: texto, anexos } });
    if (error || !data?.resposta) {
      let detail = "";
      try { detail = (await error?.context?.json())?.error || ""; } catch {}
      return fail("Não foi possível enviar a resposta." + (detail ? " " + detail : " Tente novamente."));
    }
    if (!r.respondido_em) { r.respondido_em = data.respondido_em; statusBar(r); }
    await historico(r);
    const m = document.querySelector("#historico .reply .msg"); if (m) m.textContent = "Resposta enviada para " + r.email + ".";
  });

  box.replaceChildren(Admin.el("h2", null, "Histórico"), thread);
  if (resp.error || evs.error || rec.error) box.appendChild(Admin.el("p", "msg err", "Parte do histórico não pôde ser carregada."));
  box.appendChild(form);
}

Admin.init({ page: "contatos", onReady: async () => {
  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  const err = document.getElementById("load-err");
  if (id) {
    document.getElementById("view-list").classList.add("hidden");
    document.getElementById("view-detail").classList.remove("hidden");
    const { data, error } = await Admin.sb.from("contatos").select("*").eq("id", id).maybeSingle();
    const box = document.getElementById("detail");
    if (error || !data) { document.getElementById("status").classList.add("hidden"); box.replaceChildren(Admin.el("div", "card empty", error ? "Não foi possível carregar a mensagem." : "Mensagem não encontrada.")); return; }
    Admin.markSeen("contatos", data);
    data.visualizado_em = data.visualizado_em || new Date().toISOString();
    const { data: reu } = await Admin.sb.from("reunioes").select("*").eq("contato_id", data.id).maybeSingle();
    data._reuniao = reu || null;
    statusBar(data);
    historico(data);
    document.getElementById("view-detail").appendChild(deleteCard(data));
    if (params.get("reuniao")) openMeeting(data);
    document.getElementById("mt-close").addEventListener("click", closeMeeting);
    document.getElementById("mt-backdrop").addEventListener("click", closeMeeting);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMeeting(); });
    box.replaceChildren(contactHeader(data));
    return;
  }
  const { data, error } = await Admin.sb.from("contatos").select("*").order("created_at", { ascending: false });
  err.classList.toggle("hidden", !error);
  if (error) { err.textContent = "Não foi possível carregar as mensagens: " + error.message; return; }
  const sel = document.getElementById("situacao");
  if (["pendentes", "respondidas", "reunioes"].includes(params.get("situacao"))) sel.value = params.get("situacao");
  const render = () => {
    const q = norm(document.getElementById("busca").value.trim());
    const sit = sel.value;
    const match = (r) => !sit || (sit === "reunioes" ? !!r.reuniao_em : (sit === "respondidas") === !!r.respondido_em);
    const rows = data.filter((r) => match(r) && (!q || ["nome", "email", "empresa", "assunto", "mensagem"].some((k) => norm(r[k]).includes(q))));
    document.getElementById("count").textContent = (q || sit ? rows.length + " de " : "") + data.length + (data.length === 1 ? " mensagem recebida" : " mensagens recebidas");
    const list = document.getElementById("list"); list.replaceChildren();
    if (!rows.length) return list.appendChild(Admin.el("div", "empty", data.length ? "Nenhuma mensagem encontrada." : "Nenhuma mensagem ainda."));
    rows.forEach((r) => list.appendChild(Admin.rowLink("/admin/contatos/?id=" + r.id, r.nome, [r.assunto, r.empresa, r.email].filter(Boolean).join(" · "), r.created_at, Admin.mailState(r), true)));
  };
  document.getElementById("busca").addEventListener("input", render);
  sel.addEventListener("change", render);
  render();
}});
</script>
